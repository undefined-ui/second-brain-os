ly what to write next, or exactly what to go read\nabout.</p>\n<p>What is not acceptable is a permanent gap. Links to pages that will never exist\nmake the graph lie about its own coverage.</p>\n<h2 id=\"how-many\">How many</h2>\n<p>There is no target number, but the shape matters. A page with no outbound links\nis a dead end. A page with forty is usually a list pretending to be a page.</p>\n<p>Watch the average across the vault rather than any single page. Below roughly\ntwo links per page, the graph is not connected enough to answer anything the\nindividual pages could not. Track it with <code>scripts/vault_stats.py</code>.</p>\n<h2 id=\"hub-pages\">Hub pages</h2>\n<p>Some pages accumulate links until everything routes through them. A general\nconcept that every source touches becomes a hub, and once it is a hub, the graph\naround it stops being informative: everything is two hops from everything.</p>\n<p>The fix is to split the hub into the specific ideas people are actually linking\nto. If forty pages link to a single broad concept, they are linking to four\ndifferent aspects of it.</p>\n<h2 id=\"decorative-links\">Decorative links</h2>\n<p>A link is a claim that two pages are related in a way worth following. Links\nadded because a word happened to appear are noise, and enough of them make the\ngraph unusable in exactly the way an empty graph is unusable.</p>\n<p>The test: would you follow this link while researching the topic? If not,\ndelete it.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"frontmatter-schema.md\">Frontmatter schema</a></p>", "headings": ["The rule", "Link, do not restate", "Both directions", "Links that do not exist yet", "How many", "Hub pages", "Decorative links", "Next"], "words": 481, "text": "Links are the entire value of the structure. Without them you have a folder of files with good filenames, which is a search index, and search indexes already exist. The rule Link the first mention of any concept or entity, on every page. That is it. Applied consistently, it produces the graph on its own, with no separate linking pass and no maintenance ritual. Link, do not restate If you are explaining something that already has a page, link it and move on. This is what keeps knowledge in one place. When the explanation of a concept lives on four pages in four slightly different versions, updating it means finding all four, and you will not. Linked, it lives once and improves once. Both directions A new page links out to what it references. What it references links back. One-directional linking produces pages that reference the vault but that the vault never reaches. They exist, they are correct, and nothing finds them. Obsidian shows unlinked backlinks, which helps you spot these, but the agent should be closing the loop at ingest rather than leaving it to you. Links that do not exist yet Write the link anyway, then either create the target page in the same run or record it under Gaps in index.md . Gaps are useful information. A page that three sources have linked to and that does not exist yet is exactly what to write next, or exactly what to go read about. What is not acceptable is a permanent gap. Links to pages that will never exist make the graph lie about its own coverage. How many There is no target number, but the shape matters. A page with no outbound links is a dead end. A page with forty is usually a list pretending to be a page. Watch the average across the vault rather than any single page. Below roughly two links per page, the graph is not connected enough to answer anything the individual pages could not. Track it with scripts/vault_stats.py . Hub pages Some pages accumulate links until everything routes through them. A general concept that every source touches becomes a hub, and once it is a hub, the graph around it stops being informative: everything is two hops from everything. The fix is to split the hub into the specific ideas people are actually linking to. If forty pages link to a single broad concept, they are linking to four different aspects of it. Decorative links A link is a claim that two pages are related in a way worth following. Links added because a word happened to appear are noise, and enough of them make the graph unusable in exactly the way an empty graph is unusable. The test: would you follow this link while researching the topic? If not, delete it. Next Frontmatter schema frontmatter-schema.md", "links": [{"to": "04-structuring/frontmatter-schema", "label": "Frontmatter schema"}]}, {"id": "04-structuring/frontmatter-schema", "path": "docs/04-structuring/frontmatter-schema.md", "section": "04-structuring", "section_title": "Structuring", "title": "Frontmatter schema", "html": "<p>Frontmatter is what makes the vault queryable by something other than text\nsearch. It costs nothing to write and it is what Dataview, scripts and the agent\nitself use to find things by shape.</p>\n<h2 id=\"the-schema\">The schema</h2>\n<pre><code class=\"language-yaml\">---\ntitle: Canonical name\ntype: source | entity | concept | synthesis\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\naliases: [other names this is known by]\ntags: [two or three]\n---\n</code></pre>\n<p>Source pages add:</p>\n<pre><code class=\"language-yaml\">url: https://...\nauthor:\npublished: YYYY-MM-DD\n</code></pre>\n<p>Entity pages add <code>kind: person | org | product | tool</code>.</p>\n<h2 id=\"why-each-field-earns-its-place\">Why each field earns its place</h2>\n<p><code>type</code> drives every structural query and every lint check. Without it you cannot\nask how many concepts you have, or find sources with no concepts attached.</p>\n<p><code>updated</code> is what makes review possible. Stale concept pages are the main way a\nvault rots, and you cannot find them without a date.</p>\n<p><code>aliases</code> is what makes wikilinks resolve when the same thing has three names.\nSee <a href=\"naming-and-aliases.md\">naming and aliases</a>.</p>\n<p><code>url</code> on a source page is what separates a citation from a claim. A source page\nwithout it is unverifiable.</p>\n<h2 id=\"tags\">Tags</h2>\n<p>Two or three per page, from a small controlled vocabulary you actually maintain.</p>\n<p>Tags fail in one specific way: the vocabulary grows until it is meaningless.\nFifty tags used once each are worse than no tags, because they create the\nimpression of a taxonomy while doing none of the work.</p>\n<p>Keep the list in <code>CLAUDE.md</code> and instruct the agent to use existing tags or\npropose a new one explicitly rather than inventing them silently.</p>\n<p>Folders and links carry the structural load. Tags are for cross-cutting\nqualities that do not fit either: <code>unverified</code>, <code>to-revisit</code>, <code>disputed</code>.</p>\n<h2 id=\"empty-fields\">Empty fields</h2>\n<p>Leave a field out rather than filling it with a guess. An absent <code>published</code>\nmeans unknown, which the agent can say honestly. A guessed date becomes a fact\nin a concept page three weeks later.</p>\n<h2 id=\"keep-it-stable\">Keep it stable</h2>\n<p>Adding a field to the schema means either backfilling every page or living with\na mixed vault where queries miss the older half.</p>\n<p>Decide the schema early, keep it small, and change it rarely. When you do change\nit, run a backfill pass over the whole vault in one go rather than letting the\nchange apply only to new pages.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"naming-and-aliases.md\">Naming and aliases</a></p>", "headings": ["The schema", "Why each field earns its place", "Tags", "Empty fields", "Keep it stable", "Next"], "words": 385, "text": "Frontmatter is what makes the vault queryable by something other than text search. It costs nothing to write and it is what Dataview, scripts and the agent itself use to find things by shape. The schema yaml --- title: Canonical name type: source | entity | concept | synthesis created: YYYY-MM-DD updated: YYYY-MM-DD aliases: other names this is known by tags: two or three --- Source pages add: yaml url: https://... author: published: YYYY-MM-DD Entity pages add kind: person | org | product | tool . Why each field earns its place type drives every structural query and every lint check. Without it you cannot ask how many concepts you have, or find sources with no concepts attached. updated is what makes review possible. Stale concept pages are the main way a vault rots, and you cannot find them without a date. aliases is what makes wikilinks resolve when the same thing has three names. See naming and aliases naming-and-aliases.md . url on a source page is what separates a citation from a claim. A source page without it is unverifiable. Tags Two or three per page, from a small controlled vocabulary you actually maintain. Tags fail in one specific way: the vocabulary grows until it is meaningless. Fifty tags used once each are worse than no tags, because they create the impression of a taxonomy while doing none of the work. Keep the list in CLAUDE.md and instruct the agent to use existing tags or propose a new one explicitly rather than inventing them silently. Folders and links carry the structural load. Tags are for cross-cutting qualities that do not fit either: unverified , to-revisit , disputed . Empty fields Leave a field out rather than filling it with a guess. An absent published means unknown, which the agent can say honestly. A guessed date becomes a fact in a concept page three weeks later. Keep it stable Adding a field to the schema means either backfilling every page or living with a mixed vault where queries miss the older half. Decide the schema early, keep it small, and change it rarely. When you do change it, run a backfill pass over the whole vault in one go rather than letting the change apply only to new pages. Next Naming and aliases naming-and-aliases.md", "links": [{"to": "04-structuring/naming-and-aliases", "label": "naming and aliases"}, {"to": "04-structuring/naming-and-aliases", "label": "Naming and aliases"}]}, {"id": "04-structuring/naming-and-aliases", "path": "docs/04-structuring/naming-and-aliases.md", "section": "04-structuring", "section_title": "Structuring", "title": "Naming and aliases", "html": "<p>Wikilinks resolve by name, so the name is not cosmetic. It is the key the whole\ngraph is built on.</p>\n<h2 id=\"canonical-titles\">Canonical titles</h2>\n<p>One page, one canonical title, and it is the name you would use talking to\nsomeone in the field.</p>\n<p>Practical rules that avoid most of the pain:</p>\n<ul>\n<li><strong>Singular, not plural.</strong> <code>Vector database</code>, not <code>Vector databases</code>.</li>\n<li><strong>Spell out acronyms in the title, put the acronym in aliases.</strong> The title is\n  for the reader, the alias is for the link.</li>\n<li><strong>No dates, no versions in the title</strong> unless the thing genuinely is a\n  version. A page called <code>MCP spec 2026-07</code> becomes wrong in a month; a page\n  called <code>MCP</code> with a version history does not.</li>\n<li><strong>No your-vault-specific prefixes.</strong> <code>Concept - RAG</code> fights the link syntax\n  for no benefit.</li>\n</ul>\n<h2 id=\"aliases\">Aliases</h2>\n<p>Everything the same subject gets called, listed in frontmatter:</p>\n<pre><code class=\"language-yaml\">title: Retrieval augmented generation\naliases: [RAG, retrieval-augmented generation]\n</code></pre>\n<p>Aliases are what stop the vault from quietly growing three pages for one thing.\nWithout the alias, a source that says RAG creates <code>RAG</code>, and a source that\nspells it out creates a second page, and neither knows about the other.</p>\n<p>Add aliases at creation, not later. By the time you notice the duplicate, both\npages have inbound links.</p>\n<h2 id=\"two-things-with-the-same-name\">Two things with the same name</h2>\n<p>Disambiguate in the title, not with a suffix nobody would type:</p>\n<pre><code>Mercury (planet)\nMercury (element)\n</code></pre>\n<p>Then alias the bare word to whichever one is dominant in your vault, or to\nneither if both matter, which forces the agent to pick explicitly rather than\nguessing.</p>\n<p>Same applies to people who share a name and to your own projects that collide\nwith a well-known product.</p>\n<h2 id=\"renaming\">Renaming</h2>\n<p>Obsidian updates links when you rename inside the app. The agent renaming a file\ndirectly does not, and that is the single most common source of broken links in\nan agent-maintained vault.</p>\n<p>Rule for <code>CLAUDE.md</code>: renames go through a documented procedure. Update the\nfile, update every inbound link, add the old name as an alias, and record it in\n<code>log.md</code>. The alias matters because it keeps external references and your own\nmemory working.</p>\n<p>Then run <code>scripts/link_check.py</code> to confirm nothing dangled.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"dedupe-and-merge.md\">Deduplication and merging</a></p>", "headings": ["Canonical titles", "Aliases", "Two things with the same name", "Renaming", "Next"], "words": 372, "text": "Wikilinks resolve by name, so the name is not cosmetic. It is the key the whole graph is built on. Canonical titles One page, one canonical title, and it is the name you would use talking to someone in the field. Practical rules that avoid most of the pain: - Singular, not plural. Vector database , not Vector databases . - Spell out acronyms in the title, put the acronym in aliases. The title is for the reader, the alias is for the link. - No dates, no versions in the title unless the thing genuinely is a version. A page called MCP spec 2026-07 becomes wrong in a month; a page called MCP with a version history does not. - No your-vault-specific prefixes. Concept - RAG fights the link syntax for no benefit. Aliases Everything the same subject gets called, listed in frontmatter: yaml title: Retrieval augmented generation aliases: RAG, retrieval-augmented generation Aliases are what stop the vault from quietly growing three pages for one thing. Without the alias, a source that says RAG creates RAG , and a source that spells it out creates a second page, and neither knows about the other. Add aliases at creation, not later. By the time you notice the duplicate, both pages have inbound links. Two things with the same name Disambiguate in the title, not with a suffix nobody would type: Mercury planet Mercury element Then alias the bare word to whichever one is dominant in your vault, or to neither if both matter, which forces the agent to pick explicitly rather than guessing. Same applies to people who share a name and to your own projects that collide with a well-known product. Renaming Obsidian updates links when you rename inside the app. The agent renaming a file directly does not, and that is the single most common source of broken links in an agent-maintained vault. Rule for CLAUDE.md : renames go through a documented procedure. Update the file, update every inbound link, add the old name as an alias, and record it in log.md . The alias matters because it keeps external references and your own memory working. Then run scripts/link_check.py to confirm nothing dangled. Next Deduplication and merging dedupe-and-merge.md", "links": [{"to": "04-structuring/dedupe-and-merge", "label": "Deduplication and merging"}]}, {"id": "04-structuring/dedupe-and-merge", "path": "docs/04-structuring/dedupe-and-merge.md", "section": "04-structuring", "section_title": "Structuring", "title": "Deduplication and merging", "html": "<p>Duplicates are inevitable. Two sources use different words for the same idea, an\nalias was missing, a bulk import ran before the vault had the concept. The\nquestion is not how to prevent them entirely but how to catch them before they\nboth accumulate links.</p>\n<h2 id=\"finding-them\">Finding them</h2>\n<p>Signals, in order of reliability:</p>\n<ul>\n<li><strong>Similar titles.</strong> Cheap to check, catches the plural and acronym cases.</li>\n<li><strong>Overlapping aliases.</strong> Two pages claiming the same alias is always a bug.</li>\n<li><strong>Shared inbound links.</strong> Two pages that the same five sources both link to\n  are usually one page.</li>\n<li><strong>Content similarity.</strong> Expensive, but catches the cases where the names look\n  unrelated.</li>\n</ul>\n<p><code>second-brain-lint</code> runs the first three and proposes merges. It does not\nperform them, which is deliberate.</p>\n<h2 id=\"why-merging-is-not-automatic\">Why merging is not automatic</h2>\n<p>A merge is irreversible in the way that matters: once two pages are one, you\ncannot tell which claim came from which, and the agent's judgement about \"these\nare the same thing\" is exactly the judgement that goes wrong.</p>\n<p>Two ideas that look identical from their summaries are often a general case and\na specific one, and merging them loses the distinction permanently.</p>\n<p>So: the agent proposes, you decide. Reviewing a merge takes fifteen seconds.</p>\n<h2 id=\"the-procedure\">The procedure</h2>\n<p>When you approve one:</p>\n<ol>\n<li><strong>Pick the survivor</strong> by canonical name, not by which is longer.</li>\n<li><strong>Merge content,</strong> keeping every distinct claim with its source. Overlapping\n   claims collapse, differing ones both stay.</li>\n<li><strong>Merge aliases,</strong> including the dead page's title as an alias on the\n   survivor.</li>\n<li><strong>Redirect inbound links</strong> to the survivor.</li>\n<li><strong>Leave a stub</strong> at the old path only if it was linked from outside the\n   vault. Otherwise delete it.</li>\n<li><strong>Record it in <code>log.md</code></strong> with both names, so a page that vanishes is\n   traceable.</li>\n</ol>\n<p>Step 6 is the one agents skip and the one you will need. A page that disappears\nwithout a record is indistinguishable from a page that was deleted by mistake.</p>\n<h2 id=\"do-not-dedupe-live\">Do not dedupe live</h2>\n<p>Merging during an ingest run means the agent is restructuring the vault while\nadding to it, and a bad merge lands in the middle of otherwise good work.</p>\n<p>Run dedupe as its own pass, weekly or after a large import, on a clean git\nstate. Then a wrong merge is one <code>git checkout</code> away from undone.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"contradictions-and-supersession.md\">Contradictions and supersession</a></p>", "headings": ["Finding them", "Why merging is not automatic", "The procedure", "Do not dedupe live", "Next"], "words": 394, "text": "Duplicates are inevitable. Two sources use different words for the same idea, an alias was missing, a bulk import ran before the vault had the concept. The question is not how to prevent them entirely but how to catch them before they both accumulate links. Finding them Signals, in order of reliability: - Similar titles. Cheap to check, catches the plural and acronym cases. - Overlapping aliases. Two pages claiming the same alias is always a bug. - Shared inbound links. Two pages that the same five sources both link to are usually one page. - Content similarity. Expensive, but catches the cases where the names look unrelated. second-brain-lint runs the first three and proposes merges. It does not perform them, which is deliberate. Why merging is not automatic A merge is irreversible in the way that matters: once two pages are one, you cannot tell which claim came from which, and the agent's judgement about \"these are the same thing\" is exactly the judgement that goes wrong. Two ideas that look identical from their summaries are often a general case and a specific one, and merging them loses the distinction permanently. So: the agent proposes, you decide. Reviewing a merge takes fifteen seconds. The procedure When you approve one: 1. Pick the survivor by canonical name, not by which is longer. 2. Merge content, keeping every distinct claim with its source. Overlapping claims collapse, differing ones both stay. 3. Merge aliases, including the dead page's title as an alias on the survivor. 4. Redirect inbound links to the survivor. 5. Leave a stub at the old path only if it was linked from outside the vault. Otherwise delete it. 6. Record it in log.md with both names, so a page that vanishes is traceable. Step 6 is the one agents skip and the one you will need. A page that disappears without a record is indistinguishable from a page that was deleted by mistake. Do not dedupe live Merging during an ingest run means the agent is restructuring the vault while adding to it, and a bad merge lands in the middle of otherwise good work. Run dedupe as its own pass, weekly or after a large import, on a clean git state. Then a wrong merge is one git checkout away from undone. Next Contradictions and supersession contradictions-and-supersession.md", "links": [{"to": "04-structuring/contradictions-and-supersession", "label": "Contradictions and supersession"}]}, {"id": "04-structuring/contradictions-and-supersession", "path": "docs/04-structuring/contradictions-and-supersession.md", "section": "04-structuring", "section_title": "Structuring", "title": "Contradictions and supersession", "html": "<p>This is the rule that separates a second brain from a search engine, and the one\nmost implementations get wrong.</p>\n<p>When a new source disagrees with what a page already says, the page records\nboth. It does not overwrite.</p>\n<h2 id=\"why-overwriting-is-the-worst-failure-mode\">Why overwriting is the worst failure mode</h2>\n<p>A vault that silently updates to the latest claim has no memory of what you\nbelieved and why. It always presents the most recent thing you read as the\ntruth, which is a ranking by recency, not by evidence.</p>\n<p>Worse, it is invisible. Nothing errors. The page simply says something different\nthan it did last month, with the same confidence, and you have no way to notice\nor to check what changed.</p>\n<p>The history is the asset. Knowing that you believed X because of a 2024 source,\nthen revised to Y after better evidence, is more valuable than either claim\nalone, because it tells you how firm Y actually is.</p>\n<h2 id=\"what-a-contradiction-looks-like-on-a-page\">What a contradiction looks like on a page</h2>\n<p>Both positions, each attributed and dated:</p>\n<pre><code class=\"language-markdown\">## Current position\n\nRetrieval quality degrades past roughly 50k tokens of context\n([[Lost in the Middle]], 2023).\n\n## Contested\n\n[[Some 2026 benchmark]] reports no degradation up to 200k on the same task\nfamily. The two use different evaluation setups: the first measures position\nsensitivity, the second end-task accuracy. Unresolved.\n</code></pre>\n<p>The reader can act on that. A page that had silently adopted whichever was\ningested last cannot be acted on at all.</p>\n<h2 id=\"supersession\">Supersession</h2>\n<p>Sometimes it is not a genuine disagreement, it is old information. A tool\nchanged its API, a company was acquired, a paper was retracted.</p>\n<p>Mark the old claim as superseded and keep it:</p>\n<pre><code class=\"language-markdown\">~~Requires Node 18 or later~~ superseded 2026-05: the native installer no\nlonger requires Node ([[source]]).\n</code></pre>\n<p>Deleting it means that when you read something written before the change, you\nhave no way to reconcile it with what the vault now says.</p>\n<h2 id=\"confidence\">Confidence</h2>\n<p>Not everything ingested deserves equal weight. A tag or a frontmatter field is\nenough:</p>\n<ul>\n<li><strong>stated</strong> by a primary source you trust</li>\n<li><strong>reported</strong> by secondary coverage</li>\n<li><strong>self-reported</strong> by the party it benefits</li>\n<li><strong>unverified</strong></li>\n</ul>\n<p>Self-reported numbers in particular should never lose that label. A company's\nown performance claim repeated as fact in a concept page is how a vault becomes\nconfidently wrong.</p>\n<h2 id=\"the-instruction\">The instruction</h2>\n<p>In <code>CLAUDE.md</code>, worded so it generalises rather than covering only the obvious\ncase:</p>\n<pre><code>When a new source disagrees with an existing page, do not overwrite. Record both\npositions with sources and dates, and say what would settle it. If the new\nsource is clearly better evidence, mark the older claim superseded rather than\ndeleting it. Never resolve a contradiction by picking the more recent source.\n</code></pre>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"index-and-log.md\">index.md and log.md</a></p>", "headings": ["Why overwriting is the worst failure mode", "What a contradiction looks like on a page", "Current position", "Contested", "Supersession", "Confidence", "The instruction", "Next"], "words": 463, "text": "This is the rule that separates a second brain from a search engine, and the one most implementations get wrong. When a new source disagrees with what a page already says, the page records both. It does not overwrite. Why overwriting is the worst failure mode A vault that silently updates to the latest claim has no memory of what you believed and why. It always presents the most recent thing you read as the truth, which is a ranking by recency, not by evidence. Worse, it is invisible. Nothing errors. The page simply says something different than it did last month, with the same confidence, and you have no way to notice or to check what changed. The history is the asset. Knowing that you believed X because of a 2024 source, then revised to Y after better evidence, is more valuable than either claim alone, because it tells you how firm Y actually is. What a contradiction looks like on a page Both positions, each attributed and dated: markdown Current position Retrieval quality degrades past roughly 50k tokens of context Lost in the Middle , 2023 . Contested Some 2026 benchmark reports no degradation up to 200k on the same task family. The two use different evaluation setups: the first measures position sensitivity, the second end-task accuracy. Unresolved. The reader can act on that. A page that had silently adopted whichever was ingested last cannot be acted on at all. Supersession Sometimes it is not a genuine disagreement, it is old information. A tool changed its API, a company was acquired, a paper was retracted. Mark the old claim as superseded and keep it: markdown ~~Requires Node 18 or later~~ superseded 2026-05: the native installer no longer requires Node source . Deleting it means that when you read something written before the change, you have no way to reconcile it with what the vault now says. Confidence Not everything ingested deserves equal weight. A tag or a frontmatter field is enough: - stated by a primary source you trust - reported by secondary coverage - self-reported by the party it benefits - unverified Self-reported numbers in particular should never lose that label. A company's own performance claim repeated as fact in a concept page is how a vault becomes confidently wrong. The instruction In CLAUDE.md , worded so it generalises rather than covering only the obvious case: When a new source disagrees with an existing page, do not overwrite. Record both positions with sources and dates, and say what would settle it. If the new source is clearly better evidence, mark the older claim superseded rather than deleting it. Never resolve a contradiction by picking the more recent source. Next index.md and log.md index-and-log.md", "links": [{"to": "04-structuring/index-and-log", "label": "index.md and log.md"}]}, {"id": "04-structuring/index-and-log", "path": "docs/04-structuring/index-and-log.md", "section": "04-structuring", "section_title": "Structuring", "title": "index.md and log.md", "html": "<p>Two files that are not knowledge, but without which the knowledge is hard to\nreach and impossible to audit.</p>\n<h2 id=\"indexmd\">index.md</h2>\n<p>The catalog. Every page, grouped by type, with the gaps listed at the bottom.</p>\n<p>Its real job is retrieval economy. When the agent gets a question, reading the\nindex first tells it what exists and which pages are worth opening. Without it,\nthe alternative is a full-text sweep, which is slower, costs more context, and\nmisses pages whose wording differs from the question.</p>\n<p>Keep it navigable rather than exhaustive-looking:</p>\n<pre><code class=\"language-markdown\">## Concepts\n\n### Retrieval\n- [[Retrieval augmented generation]] - chunking, embeddings, when it beats a wiki\n- [[GraphRAG]] - entity graph plus community summaries\n\n### Agents\n- [[Agent harness]] - the loop around a model\n</code></pre>\n<p>One line of description per entry. That line is what lets the agent decide\nwhether to open the page, and it is worth the tokens.</p>\n<h2 id=\"gaps\">Gaps</h2>\n<p>At the bottom of the index, the pages that are linked and do not exist.</p>\n<p>This section is the most actionable thing in the vault. It is a list of what\nyour own material keeps referring to and you have never written down, which is\nusually a precise map of what to read next.</p>\n<h2 id=\"logmd\">log.md</h2>\n<p>One line per operation, appended, newest at the bottom.</p>\n<pre><code>2026-09-07 ingest raw/karpathy-gist.md -&gt; 1 source, 2 concepts, 1 entity, 9 links\n2026-09-07 merge [[RAG]] &lt;- [[Retrieval-augmented generation]]\n2026-09-08 lint -&gt; 3 broken links fixed, 2 orphans flagged\n</code></pre>\n<p>The log is what makes an agent-maintained vault auditable. When a page says\nsomething you do not recognise, the log tells you which run produced it. When\nsomething disappears, the log is the difference between a traceable merge and a\nmystery.</p>\n<p>It also gives the <a href=\"../../skills/README.md\">review skill</a> its raw material: what\nchanged this week comes from here, not from guessing at file timestamps.</p>\n<h2 id=\"keeping-both-from-bloating\">Keeping both from bloating</h2>\n<p>The index grows with the vault, which is fine, but flat lists stop being\nnavigable somewhere around two hundred entries. Group by theme, and once a theme\nhas more than about thirty entries, give it its own index page and link it from\nthe main one.</p>\n<p>The log grows forever and nobody reads old entries. Roll entries older than a\nfew months into one summary line per month, or archive them into a dated file.\nKeep recent detail, compress history.</p>\n<h2 id=\"the-rule-that-matters\">The rule that matters</h2>\n<p>Both files update in the same run as the work they describe.</p>\n<p>An index that lags is worse than no index, because the agent trusts it and stops\nlooking for pages it does not list. A log written later is a reconstruction, not\na record.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../05-graphs/README.md\">Graphs</a>, where these structures start paying off.</p>", "headings": ["index.md", "Concepts", "Gaps", "log.md", "Keeping both from bloating", "The rule that matters", "Next"], "words": 456, "text": "Two files that are not knowledge, but without which the knowledge is hard to reach and impossible to audit. index.md The catalog. Every page, grouped by type, with the gaps listed at the bottom. Its real job is retrieval economy. When the agent gets a question, reading the index first tells it what exists and which pages are worth opening. Without it, the alternative is a full-text sweep, which is slower, costs more context, and misses pages whose wording differs from the question. Keep it navigable rather than exhaustive-looking: markdown Concepts Retrieval - Retrieval augmented generation - chunking, embeddings, when it beats a wiki - GraphRAG - entity graph plus community summaries Agents - Agent harness - the loop around a model One line of description per entry. That line is what lets the agent decide whether to open the page, and it is worth the tokens. Gaps At the bottom of the index, the pages that are linked and do not exist. This section is the most actionable thing in the vault. It is a list of what your own material keeps referring to and you have never written down, which is usually a precise map of what to read next. log.md One line per operation, appended, newest at the bottom. 2026-09-07 ingest raw/karpathy-gist.md - 1 source, 2 concepts, 1 entity, 9 links 2026-09-07 merge RAG <- Retrieval-augmented generation 2026-09-08 lint - 3 broken links fixed, 2 orphans flagged The log is what makes an agent-maintained vault auditable. When a page says something you do not recognise, the log tells you which run produced it. When something disappears, the log is the difference between a traceable merge and a mystery. It also gives the review skill ../../skills/README.md its raw material: what changed this week comes from here, not from guessing at file timestamps. Keeping both from bloating The index grows with the vault, which is fine, but flat lists stop being navigable somewhere around two hundred entries. Group by theme, and once a theme has more than about thirty entries, give it its own index page and link it from the main one. The log grows forever and nobody reads old entries. Roll entries older than a few months into one summary line per month, or archive them into a dated file. Keep recent detail, compress history. The rule that matters Both files update in the same run as the work they describe. An index that lags is worse than no index, because the agent trusts it and stops looking for pages it does not list. A log written later is a reconstruction, not a record. Next Graphs ../05-graphs/README.md , where these structures start paying off.", "links": []}, {"id": "05-graphs/graph-basics", "path": "docs/05-graphs/graph-basics.md", "section": "05-graphs", "section_title": "Graphs", "title": "Graph basics for a knowledge base", "html": "<p>Your vault is a graph whether you plan it or not. Pages are nodes, wikilinks are\nedges. Every structural decision in the previous section was a decision about\nwhat shape that graph takes.</p>\n<p>Four terms are enough to reason about it.</p>\n<p><strong>Degree</strong> is how many links a page has. In-degree is how many point at it,\nout-degree how many it points out. A page with zero in-degree is unreachable by\nfollowing links, which is what makes orphans a problem rather than a cosmetic\nissue.</p>\n<p><strong>Path length</strong> is how many hops separate two pages. This is the one that\nmatters for answers: the agent following links from a starting page can only\nreach what is a few hops away before the context budget runs out. Two related\nideas eight hops apart will never be connected in an answer.</p>\n<p><strong>Clustering</strong> is how much a page's neighbours link to each other. High\nclustering means a genuine topic area. Low clustering with high degree usually\nmeans a page that collects unrelated things.</p>\n<p><strong>Components</strong> are the disconnected islands. A vault in five components is five\nvaults, and nothing in one will ever inform an answer about another.</p>\n<h2 id=\"the-shapes-that-go-wrong\">The shapes that go wrong</h2>\n<p><strong>The star.</strong> Everything links to two or three hub pages and to nothing else.\nPath length between any two leaves is short, but only through the hub, so the\ngraph tells you nothing beyond \"these are all in my vault\". Usually caused by\nlinking to broad concepts instead of specific ones.</p>\n<p><strong>The chain.</strong> Sources link to the concept they introduced and nothing links\nsideways. Common after a bulk import that ran without checking existing pages.\nThe vault grows and never connects.</p>\n<p><strong>Islands.</strong> Distinct topic clusters with no bridges. Sometimes legitimate: your\ncooking notes and your database notes genuinely do not connect. Often not: two\nclusters about related things that were built under different vocabulary and\nnever linked because the aliases were missing.</p>\n<h2 id=\"what-a-healthy-graph-looks-like\">What a healthy graph looks like</h2>\n<p>Dense within topics, sparse but present between them. Most pages reachable from\nmost pages within three or four hops. Hubs that exist but do not dominate. A\nsmall number of bridge pages that connect clusters, which are usually your most\nvaluable pages, because they hold the connections you could not have made from\none source alone.</p>\n<h2 id=\"why-any-of-this-matters\">Why any of this matters</h2>\n<p>When you ask the vault something, the agent starts at the pages that match and\nwalks outward. The graph is the search space. A well-shaped graph means the walk\nreaches the relevant material in a few hops; a badly shaped one means it either\nreaches nothing or reaches everything.</p>\n<p>That is the whole argument for the linking rules. They are not tidiness, they\nare what determines whether retrieval works.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"obsidian-graph-view.md\">Reading the Obsidian graph view</a></p>", "headings": ["The shapes that go wrong", "What a healthy graph looks like", "Why any of this matters", "Next"], "words": 465, "text": "Your vault is a graph whether you plan it or not. Pages are nodes, wikilinks are edges. Every structural decision in the previous section was a decision about what shape that graph takes. Four terms are enough to reason about it. Degree is how many links a page has. In-degree is how many point at it, out-degree how many it points out. A page with zero in-degree is unreachable by following links, which is what makes orphans a problem rather than a cosmetic issue. Path length is how many hops separate two pages. This is the one that matters for answers: the agent following links from a starting page can only reach what is a few hops away before the context budget runs out. Two related ideas eight hops apart will never be connected in an answer. Clustering is how much a page's neighbours link to each other. High clustering means a genuine topic area. Low clustering with high degree usually means a page that collects unrelated things. Components are the disconnected islands. A vault in five components is five vaults, and nothing in one will ever inform an answer about another. The shapes that go wrong The star. Everything links to two or three hub pages and to nothing else. Path length between any two leaves is short, but only through the hub, so the graph tells you nothing beyond \"these are all in my vault\". Usually caused by linking to broad concepts instead of specific ones. The chain. Sources link to the concept they introduced and nothing links sideways. Common after a bulk import that ran without checking existing pages. The vault grows and never connects. Islands. Distinct topic clusters with no bridges. Sometimes legitimate: your cooking notes and your database notes genuinely do not connect. Often not: two clusters about related things that were built under different vocabulary and never linked because the aliases were missing. What a healthy graph looks like Dense within topics, sparse but present between them. Most pages reachable from most pages within three or four hops. Hubs that exist but do not dominate. A small number of bridge pages that connect clusters, which are usually your most valuable pages, because they hold the connections you could not have made from one source alone. Why any of this matters When you ask the vault something, the agent starts at the pages that match and walks outward. The graph is the search space. A well-shaped graph means the walk reaches the relevant material in a few hops; a badly shaped one means it either reaches nothing or reaches everything. That is the whole argument for the linking rules. They are not tidiness, they are what determines whether retrieval works. Next Reading the Obsidian graph view obsidian-graph-view.md", "links": [{"to": "05-graphs/obsidian-graph-view", "label": "Reading the Obsidian graph view"}]}, {"id": "05-graphs/obsidian-graph-view", "path": "docs/05-graphs/obsidian-graph-view.md", "section": "05-graphs", "section_title": "Graphs", "title": "Reading the Obsidian graph view", "html": "<p>The global graph is the screenshot everyone posts. It is the least useful view\nin the app.</p>\n<p>At two hundred pages it is a hairball, and a hairball tells you nothing except\nthat you have pages. What it is good for is spotting shape at a glance: isolated\nclumps, a single dominant hub, a scatter of unconnected dots around the edge.</p>\n<h2 id=\"local-graph\">Local graph</h2>\n<p>This is the view that does work. Open a page, show the local graph, set depth to\ntwo.</p>\n<p>You are looking for two things. What is one hop away should be obviously\nrelated; anything surprising there is either a decorative link to delete or a\nconnection worth reading. What is missing at two hops tells you where the page\nis under-connected.</p>\n<p>Reviewing the local graph of a page you just wrote is the fastest quality check\nthere is, and it takes five seconds.</p>\n<h2 id=\"filters-that-make-the-global-view-usable\">Filters that make the global view usable</h2>\n<ul>\n<li><strong>Filter by type.</strong> <code>-path:sources</code> hides source pages and leaves the concept\n  graph, which is the part with meaning in it. Sources outnumber concepts\n  heavily and drown them visually.</li>\n<li><strong>Groups by colour.</strong> Colour concepts, entities and synthesis differently. A\n  cluster with no concept pages in it is a pile of sources nobody has processed.</li>\n<li><strong>Orphan toggle.</strong> Turn orphans on deliberately, look at what appears, then\n  fix or delete them.</li>\n<li><strong>Depth and forces.</strong> Lower link force spreads clusters apart enough to see\n  bridges.</li>\n</ul>\n<h2 id=\"what-to-look-for\">What to look for</h2>\n<p><strong>Dots at the edge, connected to one thing.</strong> Failed ingests, usually. The\nsource page was written and the concepts never linked back.</p>\n<p><strong>One giant node in the middle.</strong> A hub that has swallowed the graph. Split it.</p>\n<p><strong>Two clusters with a single connecting page.</strong> That page is doing real work.\nIt is also fragile: if it is wrong, both clusters are wrong about each other.</p>\n<p><strong>A cluster you do not recognise.</strong> Usually the most interesting thing on\nscreen. It means the vault has accumulated material on a topic you have not\nconsciously been tracking.</p>\n<h2 id=\"what-the-view-cannot-tell-you\">What the view cannot tell you</h2>\n<p>It shows that pages are connected, never why. Every edge looks the same whether\nit means \"supports\", \"contradicts\" or \"mentioned once in passing\".</p>\n<p>That limitation is the entire argument for the next page.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"typed-links.md\">Typed links</a></p>", "headings": ["Local graph", "Filters that make the global view usable", "What to look for", "What the view cannot tell you", "Next"], "words": 383, "text": "The global graph is the screenshot everyone posts. It is the least useful view in the app. At two hundred pages it is a hairball, and a hairball tells you nothing except that you have pages. What it is good for is spotting shape at a glance: isolated clumps, a single dominant hub, a scatter of unconnected dots around the edge. Local graph This is the view that does work. Open a page, show the local graph, set depth to two. You are looking for two things. What is one hop away should be obviously related; anything surprising there is either a decorative link to delete or a connection worth reading. What is missing at two hops tells you where the page is under-connected. Reviewing the local graph of a page you just wrote is the fastest quality check there is, and it takes five seconds. Filters that make the global view usable - Filter by type. -path:sources hides source pages and leaves the concept graph, which is the part with meaning in it. Sources outnumber concepts heavily and drown them visually. - Groups by colour. Colour concepts, entities and synthesis differently. A cluster with no concept pages in it is a pile of sources nobody has processed. - Orphan toggle. Turn orphans on deliberately, look at what appears, then fix or delete them. - Depth and forces. Lower link force spreads clusters apart enough to see bridges. What to look for Dots at the edge, connected to one thing. Failed ingests, usually. The source page was written and the concepts never linked back. One giant node in the middle. A hub that has swallowed the graph. Split it. Two clusters with a single connecting page. That page is doing real work. It is also fragile: if it is wrong, both clusters are wrong about each other. A cluster you do not recognise. Usually the most interesting thing on screen. It means the vault has accumulated material on a topic you have not consciously been tracking. What the view cannot tell you It shows that pages are connected, never why. Every edge looks the same whether it means \"supports\", \"contradicts\" or \"mentioned once in passing\". That limitation is the entire argument for the next page. Next Typed links typed-links.md", "links": [{"to": "05-graphs/typed-links", "label": "Typed links"}]}, {"id": "05-graphs/typed-links", "path": "docs/05-graphs/typed-links.md", "section": "05-graphs", "section_title": "Graphs", "title": "Typed links", "html": "<p>A plain <code>[[wikilink]]</code> says two pages are related. It does not say how, and at\nscale that is a real loss.</p>\n<p>You cannot ask an untyped graph what contradicts a claim, what evidence supports\nit, or which pages extend a method. Every edge is the same edge, so every\nquestion collapses to \"what is nearby\".</p>\n<h2 id=\"a-minimal-vocabulary\">A minimal vocabulary</h2>\n<p>Small enough to remember, expressive enough to be worth it:</p>\n<ul>\n<li><strong>supports</strong> - this page is evidence for that one</li>\n<li><strong>contradicts</strong> - this page argues against it</li>\n<li><strong>extends</strong> - builds on it, adds to it</li>\n<li><strong>part-of</strong> - a component of a larger thing</li>\n<li><strong>applies</strong> - a use of a method in practice</li>\n</ul>\n<p>Five is deliberately few. Every additional type is one the agent has to choose\nbetween correctly on every link, and a vocabulary of twenty produces\ninconsistent tagging, which is worse than none.</p>\n<h2 id=\"two-ways-to-encode-it\">Two ways to encode it</h2>\n<p><strong>Inline, next to the link:</strong></p>\n<pre><code class=\"language-markdown\">The position sensitivity result (supports:: [[Lost in the Middle]]) suggests\ncontext length alone does not fix retrieval.\n</code></pre>\n<p>Dataview reads inline fields, so this is queryable inside Obsidian without extra\ntooling.</p>\n<p><strong>In frontmatter, per page:</strong></p>\n<pre><code class=\"language-yaml\">contradicts: [&quot;[[Long context replaces RAG]]&quot;]\nextends: [&quot;[[Retrieval augmented generation]]&quot;]\n</code></pre>\n<p>Cleaner to query, further from the sentence the link came from. Frontmatter for\npage-level relationships, inline for claim-level ones.</p>\n<h2 id=\"what-it-buys-you\">What it buys you</h2>\n<pre><code class=\"language-dataview\">LIST FROM &quot;wiki/concepts&quot;\nWHERE contains(contradicts, this.file.link)\n</code></pre>\n<p>That is \"everything in my vault that argues against this page\", which is a\nquestion a plain graph cannot answer at all.</p>\n<p>At the agent level it is stronger still. An ingest that records a new source as\n<code>contradicts</code> an existing page has done the work of flagging the disagreement\nstructurally, rather than burying it in prose that only surfaces if someone\nreads the page.</p>\n<h2 id=\"do-not-type-everything\">Do not type everything</h2>\n<p>Most links are plain mentions and should stay plain. Typing every link makes the\nvocabulary meaningless and makes ingestion slower and more error-prone.</p>\n<p>Type the links where the relationship is the point: evidence, disagreement,\nextension. Roughly one in five links, in practice.</p>\n<h2 id=\"the-instruction\">The instruction</h2>\n<pre><code>When a source supports, contradicts or extends a claim on an existing page,\nrecord the relationship with a typed link. Plain wikilinks for ordinary\nmentions. Do not type a relationship you are inferring; only type what the\nsource states.\n</code></pre>\n<p>That last sentence matters. An agent guessing at relationships produces a graph\nthat looks rigorous and encodes its own assumptions.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"graph-vs-vectors.md\">Graph vs embeddings</a></p>", "headings": ["A minimal vocabulary", "Two ways to encode it", "What it buys you", "Do not type everything", "The instruction", "Next"], "words": 418, "text": "A plain wikilink says two pages are related. It does not say how, and at scale that is a real loss. You cannot ask an untyped graph what contradicts a claim, what evidence supports it, or which pages extend a method. Every edge is the same edge, so every question collapses to \"what is nearby\". A minimal vocabulary Small enough to remember, expressive enough to be worth it: - supports - this page is evidence for that one - contradicts - this page argues against it - extends - builds on it, adds to it - part-of - a component of a larger thing - applies - a use of a method in practice Five is deliberately few. Every additional type is one the agent has to choose between correctly on every link, and a vocabulary of twenty produces inconsistent tagging, which is worse than none. Two ways to encode it Inline, next to the link: markdown The position sensitivity result supports:: Lost in the Middle suggests context length alone does not fix retrieval. Dataview reads inline fields, so this is queryable inside Obsidian without extra tooling. In frontmatter, per page: yaml contradicts: \" Long context replaces RAG \" extends: \" Retrieval augmented generation \" Cleaner to query, further from the sentence the link came from. Frontmatter for page-level relationships, inline for claim-level ones. What it buys you dataview LIST FROM \"wiki/concepts\" WHERE contains contradicts, this.file.link That is \"everything in my vault that argues against this page\", which is a question a plain graph cannot answer at all. At the agent level it is stronger still. An ingest that records a new source as contradicts an existing page has done the work of flagging the disagreement structurally, rather than burying it in prose that only surfaces if someone reads the page. Do not type everything Most links are plain mentions and should stay plain. Typing every link makes the vocabulary meaningless and makes ingestion slower and more error-prone. Type the links where the relationship is the point: evidence, disagreement, extension. Roughly one in five links, in practice. The instruction When a source supports, contradicts or extends a claim on an existing page, record the relationship with a typed link. Plain wikilinks for ordinary mentions. Do not type a relationship you are inferring; only type what the source states. That last sentence matters. An agent guessing at relationships produces a graph that looks rigorous and encodes its own assumptions. Next Graph vs embeddings graph-vs-vectors.md", "links": [{"to": "05-graphs/graph-vs-vectors", "label": "Graph vs embeddings"}]}, {"id": "05-graphs/graph-vs-vectors", "path": "docs/05-graphs/graph-vs-vectors.md", "section": "05-graphs", "section_title": "Graphs", "title": "Graph vs embeddings", "html": "<p>The usual advice for asking questions of your own documents is to embed them and\nretrieve by similarity. This guide does not, and the reason is worth\nunderstanding rather than taking on faith.</p>\n<h2 id=\"what-each-is-good-at\">What each is good at</h2>\n<p><strong>Embeddings</strong> find text that means something similar to your query, including\nwhen the wording is completely different. They are good at recall, they need no\nstructure, and they work on a pile of documents you have never organised.</p>\n<p><strong>A graph</strong> finds things that are explicitly connected, in a direction you can\nfollow, with a reason attached if the links are typed. It is good at\nmulti-hop questions and at telling you why two things are related.</p>\n<h2 id=\"where-similarity-fails\">Where similarity fails</h2>\n<p>The failure is specific: similarity retrieves chunks that resemble the question,\nand the answer to a good question often does not resemble it.</p>\n<p>Ask what connects two ideas, and the passages that establish the connection may\nshare no vocabulary with either. Ask what you have changed your mind about, and\nno chunk is similar to that, because the answer lives in the relationship\nbetween two pages written a year apart.</p>\n<p>There is also the ranking problem. Twenty chunks that all half-answer the\nquestion crowd out the one page that answers it fully, because similarity has no\nnotion of completeness.</p>\n<h2 id=\"where-the-graph-fails\">Where the graph fails</h2>\n<p>Recall. If a page was never linked, the graph cannot reach it, and the linking\nrules are exactly the thing that degrades quietly when ingestion gets sloppy.</p>\n<p>The graph also cannot find the thing you half-remember but cannot name. That is\na search problem, and full-text search on a vault of a few thousand pages is\ninstant, which is why <code>ripgrep</code> covers most of this in practice.</p>\n<h2 id=\"why-a-personal-vault-leans-graph\">Why a personal vault leans graph</h2>\n<p>Three reasons specific to this scale.</p>\n<p>Your corpus is small. A few thousand pages is not a retrieval problem, it is a\nfolder. The infrastructure that embeddings require pays off at millions of\ndocuments and costs more than it returns below that.</p>\n<p>Your corpus is already chunked. Atomic pages are semantic units written by\nsomething that understood them. Splitting them again into fixed-size chunks\ndestroys the structure you paid to create.</p>\n<p>Your questions are relational. What do I know about X, what connects X and Y,\nwhat argues against Z. Those are graph queries.</p>\n<h2 id=\"hybrid-when-you-get-there\">Hybrid, when you get there</h2>\n<p>The combination that makes sense: full-text search or embeddings to find\nentry points, the graph to expand from them.</p>\n<p>That way recall comes from search and structure comes from the graph, each doing\nwhat it is good at. See <a href=\"../07-retrieval/rag-on-top.md\">adding RAG when you need\nit</a> for the threshold where it starts to be worth\nthe maintenance.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"graphrag.md\">GraphRAG and where it fits</a></p>", "headings": ["What each is good at", "Where similarity fails", "Where the graph fails", "Why a personal vault leans graph", "Hybrid, when you get there", "Next"], "words": 460, "text": "The usual advice for asking questions of your own documents is to embed them and retrieve by similarity. This guide does not, and the reason is worth understanding rather than taking on faith. What each is good at Embeddings find text that means something similar to your query, including when the wording is completely different. They are good at recall, they need no structure, and they work on a pile of documents you have never organised. A graph finds things that are explicitly connected, in a direction you can follow, with a reason attached if the links are typed. It is good at multi-hop questions and at telling you why two things are related. Where similarity fails The failure is specific: similarity retrieves chunks that resemble the question, and the answer to a good question often does not resemble it. Ask what connects two ideas, and the passages that establish the connection may share no vocabulary with either. Ask what you have changed your mind about, and no chunk is similar to that, because the answer lives in the relationship between two pages written a year apart. There is also the ranking problem. Twenty chunks that all half-answer the question crowd out the one page that answers it fully, because similarity has no notion of completeness. Where the graph fails Recall. If a page was never linked, the graph cannot reach it, and the linking rules are exactly the thing that degrades quietly when ingestion gets sloppy. The graph also cannot find the thing you half-remember but cannot name. That is a search problem, and full-text search on a vault of a few thousand pages is instant, which is why ripgrep covers most of this in practice. Why a personal vault leans graph Three reasons specific to this scale. Your corpus is small. A few thousand pages is not a retrieval problem, it is a folder. The infrastructure that embeddings require pays off at millions of documents and costs more than it returns below that. Your corpus is already chunked. Atomic pages are semantic units written by something that understood them. Splitting them again into fixed-size chunks destroys the structure you paid to create. Your questions are relational. What do I know about X, what connects X and Y, what argues against Z. Those are graph queries. Hybrid, when you get there The combination that makes sense: full-text search or embeddings to find entry points, the graph to expand from them. That way recall comes from search and structure comes from the graph, each doing what it is good at. See adding RAG when you need it ../07-retrieval/rag-on-top.md for the threshold where it starts to be worth the maintenance. Next GraphRAG and where it fits graphrag.md", "links": [{"to": "07-retrieval/rag-on-top", "label": "adding RAG when you need\nit"}, {"to": "05-graphs/graphrag", "label": "GraphRAG and where it fits"}]}, {"id": "05-graphs/graphrag", "path": "docs/05-graphs/graphrag.md", "section": "05-graphs", "section_title": "Graphs", "title": "GraphRAG and where it fits", "html": "<p>GraphRAG is the approach of building a graph from a corpus first, then answering\nquestions against the graph rather than against raw chunks. Microsoft Research\npublished the best-known version, \"From Local to Global: A Graph RAG Approach to\nQuery-Focused Summarization\".</p>\n<p>The pipeline, in outline: extract entities and relationships from every\ndocument, build a graph, detect communities of densely connected entities,\nsummarise each community, and answer questions by drawing on the community\nsummaries rather than on retrieved passages.</p>\n<h2 id=\"why-it-exists\">Why it exists</h2>\n<p>It targets a specific failure of chunk retrieval: questions about the corpus as\na whole. \"What are the main themes here\" cannot be answered by retrieving the\nfive most similar chunks, because no chunk contains the answer. It has to be\nassembled from everything.</p>\n<p>That class of question is exactly what people want from a second brain and\nexactly what similarity search is worst at.</p>\n<h2 id=\"what-your-vault-already-has\">What your vault already has</h2>\n<p>Read the pipeline again against a well-maintained wiki and most of it is already\nbuilt.</p>\n<p>Entity extraction is what ingestion does when it writes entity pages.\nRelationships are the wikilinks, with types if you added them. The graph is the\nvault. What is missing is the community layer: the detection of clusters and the\nsummaries over them.</p>\n<p>And that missing piece has a manual equivalent you are already writing.\nSynthesis pages are community summaries, produced by a model that read the\nsources rather than by an algorithm clustering entities.</p>\n<h2 id=\"whether-to-run-it\">Whether to run it</h2>\n<p>Probably not, at personal scale, and the honest reason is size. The approach\nearns its cost on corpora too large to have been curated by hand. A few thousand\ncurated pages with real links do not need automated community detection to find\ntheir own themes; you can see the clusters in the graph view.</p>\n<p>There is a case for it as an audit rather than as a retrieval system. Running\ncommunity detection over your exported graph and comparing the algorithmic\nclusters against your synthesis pages tells you where the vault has themes you\nhave not noticed. That is a once-a-quarter exercise, not infrastructure.</p>\n<h2 id=\"related-research-worth-reading\">Related research worth reading</h2>\n<p><strong>HippoRAG</strong> applies personalised PageRank over a knowledge graph for multi-hop\nquestions, which is a more direct analogue of what an agent does walking links\noutward from a starting page.</p>\n<p>Read the papers themselves rather than summaries of them. Both are specific\nabout the conditions their results hold under, and those conditions are what\ndecide whether the approach transfers to your situation.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"exporting-your-graph.md\">Exporting the graph</a></p>", "headings": ["Why it exists", "What your vault already has", "Whether to run it", "Related research worth reading", "Next"], "words": 420, "text": "GraphRAG is the approach of building a graph from a corpus first, then answering questions against the graph rather than against raw chunks. Microsoft Research published the best-known version, \"From Local to Global: A Graph RAG Approach to Query-Focused Summarization\". The pipeline, in outline: extract entities and relationships from every document, build a graph, detect communities of densely connected entities, summarise each community, and answer questions by drawing on the community summaries rather than on retrieved passages. Why it exists It targets a specific failure of chunk retrieval: questions about the corpus as a whole. \"What are the main themes here\" cannot be answered by retrieving the five most similar chunks, because no chunk contains the answer. It has to be assembled from everything. That class of question is exactly what people want from a second brain and exactly what similarity search is worst at. What your vault already has Read the pipeline again against a well-maintained wiki and most of it is already built. Entity extraction is what ingestion does when it writes entity pages. Relationships are the wikilinks, with types if you added them. The graph is the vault. What is missing is the community layer: the detection of clusters and the summaries over them. And that missing piece has a manual equivalent you are already writing. Synthesis pages are community summaries, produced by a model that read the sources rather than by an algorithm clustering entities. Whether to run it Probably not, at personal scale, and the honest reason is size. The approach earns its cost on corpora too large to have been curated by hand. A few thousand curated pages with real links do not need automated community detection to find their own themes; you can see the clusters in the graph view. There is a case for it as an audit rather than as a retrieval system. Running community detection over your exported graph and comparing the algorithmic clusters against your synthesis pages tells you where the vault has themes you have not noticed. That is a once-a-quarter exercise, not infrastructure. Related research worth reading HippoRAG applies personalised PageRank over a knowledge graph for multi-hop questions, which is a more direct analogue of what an agent does walking links outward from a starting page. Read the papers themselves rather than summaries of them. Both are specific about the conditions their results hold under, and those conditions are what decide whether the approach transfers to your situation. Next Exporting the graph exporting-your-graph.md", "links": [{"to": "05-graphs/exporting-your-graph", "label": "Exporting the graph"}]}, {"id": "05-graphs/exporting-your-graph", "path": "docs/05-graphs/exporting-your-graph.md", "section": "05-graphs", "section_title": "Graphs", "title": "Exporting the graph", "html": "<p>Obsidian's graph view is a viewer. To compute anything, you need the graph\noutside it.</p>\n<h2 id=\"export\">Export</h2>\n<pre><code class=\"language-bash\">python3 scripts/graph_export.py ~/brain edges.csv\npython3 scripts/graph_export.py ~/brain graph.graphml --format graphml\n</code></pre>\n<p>The script parses every wikilink into an edge list, carries the page <code>type</code> as a\nnode attribute, and has no dependencies. CSV for code, GraphML for Gephi.</p>\n<h2 id=\"analysis\">Analysis</h2>\n<pre><code class=\"language-python\">import networkx as nx, csv\n\ng = nx.DiGraph()\nwith open(&quot;edges.csv&quot;) as f:\n    next(f)\n    g.add_edges_from(tuple(r) for r in csv.reader(f))\n\nprint(nx.number_weakly_connected_components(g))\nprint(sorted(nx.pagerank(g).items(), key=lambda kv: -kv[1])[:10])\nprint([n for n in g if g.in_degree(n) == 0])\n</code></pre>\n<p>Three questions in ten lines: how fragmented is the vault, which pages are\nstructurally central, and what is unreachable.</p>\n<p>PageRank on a knowledge graph is worth running once. The top pages are what your\nvault is actually about, which is reliably different from what you would say it\nis about.</p>\n<h2 id=\"betweenness-the-one-worth-the-compute\">Betweenness, the one worth the compute</h2>\n<pre><code class=\"language-python\">b = nx.betweenness_centrality(g)\n</code></pre>\n<p>Betweenness measures how often a page sits on the shortest path between two\nothers. High-betweenness pages are the bridges between clusters.</p>\n<p>They matter for two reasons. They are your most valuable pages, holding\nconnections no single source contained. And they are the fragile points: if a\nbridge page is wrong or gets deleted in a merge, two areas of the vault silently\nstop informing each other.</p>\n<h2 id=\"graph-databases\">Graph databases</h2>\n<p>Kuzu is embedded, no server, reads CSV directly, and Cypher queries over your\nown notes are genuinely fun for an evening. Neo4j is the full version and is\noverkill unless you are building something on top.</p>\n<p>Be clear about what this is: an analysis layer, not a replacement. The markdown\nstays canonical, the database is a rebuildable derivative. The moment you start\nwriting knowledge that exists only in the database, you have lost the\nportability that made the whole approach worth choosing.</p>\n<h2 id=\"gephi\">Gephi</h2>\n<p>For looking rather than computing. Load the GraphML, run ForceAtlas2, size nodes\nby degree, colour by type. It renders large graphs in a way Obsidian cannot, and\nit is what to use if you want a screenshot worth showing.</p>\n<h2 id=\"keep-it-in-sync\">Keep it in sync</h2>\n<p>The export is a snapshot and it is stale immediately. Regenerate it rather than\nmaintaining it, and never edit the exported graph expecting the vault to follow.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"metrics.md\">Graph metrics worth tracking</a></p>", "headings": ["Export", "Analysis", "Betweenness, the one worth the compute", "Graph databases", "Gephi", "Keep it in sync", "Next"], "words": 384, "text": "Obsidian's graph view is a viewer. To compute anything, you need the graph outside it. Export bash python3 scripts/graph_export.py ~/brain edges.csv python3 scripts/graph_export.py ~/brain graph.graphml --format graphml The script parses every wikilink into an edge list, carries the page type as a node attribute, and has no dependencies. CSV for code, GraphML for Gephi. Analysis python import networkx as nx, csv g = nx.DiGraph with open \"edges.csv\" as f: next f g.add_edges_from tuple r for r in csv.reader f print nx.number_weakly_connected_components g print sorted nx.pagerank g .items , key=lambda kv: -kv 1 :10 print n for n in g if g.in_degree n == 0 Three questions in ten lines: how fragmented is the vault, which pages are structurally central, and what is unreachable. PageRank on a knowledge graph is worth running once. The top pages are what your vault is actually about, which is reliably different from what you would say it is about. Betweenness, the one worth the compute python b = nx.betweenness_centrality g Betweenness measures how often a page sits on the shortest path between two others. High-betweenness pages are the bridges between clusters. They matter for two reasons. They are your most valuable pages, holding connections no single source contained. And they are the fragile points: if a bridge page is wrong or gets deleted in a merge, two areas of the vault silently stop informing each other. Graph databases Kuzu is embedded, no server, reads CSV directly, and Cypher queries over your own notes are genuinely fun for an evening. Neo4j is the full version and is overkill unless you are building something on top. Be clear about what this is: an analysis layer, not a replacement. The markdown stays canonical, the database is a rebuildable derivative. The moment you start writing knowledge that exists only in the database, you have lost the portability that made the whole approach worth choosing. Gephi For looking rather than computing. Load the GraphML, run ForceAtlas2, size nodes by degree, colour by type. It renders large graphs in a way Obsidian cannot, and it is what to use if you want a screenshot worth showing. Keep it in sync The export is a snapshot and it is stale immediately. Regenerate it rather than maintaining it, and never edit the exported graph expecting the vault to follow. Next Graph metrics worth tracking metrics.md", "links": [{"to": "05-graphs/metrics", "label": "Graph metrics worth tracking"}]}, {"id": "05-graphs/metrics", "path": "docs/05-graphs/metrics.md", "section": "05-graphs", "section_title": "Graphs", "title": "Graph metrics worth tracking", "html": "<p>Four numbers, checked monthly. Their direction over time tells you whether the\nsystem is working, which is not obvious from using it day to day.</p>\n<pre><code class=\"language-bash\">python3 scripts/vault_stats.py ~/brain\n</code></pre>\n<h2 id=\"orphan-rate\">Orphan rate</h2>\n<p>Pages with no inbound links, as a share of all pages.</p>\n<p>The single most diagnostic number in the vault. A rising orphan rate means\ningestion is writing pages without connecting them, which is the exact failure\nmode that turns a wiki back into a folder.</p>\n<p>Under five percent is healthy. Over fifteen and something is broken in the\ningest instructions, not in your habits.</p>\n<h2 id=\"average-degree\">Average degree</h2>\n<p>Links per page.</p>\n<p>Below two, the graph is barely connected and retrieval cannot do better than\nsearch. Between three and eight is the working range for a personal vault. Much\nabove ten, check whether links are being added decoratively, which inflates the\nnumber while making the graph less useful.</p>\n<p>Watch it alongside page count. Degree that stays flat while the vault doubles is\nfine; degree that falls means new pages are attaching to less than the existing\nones did.</p>\n<h2 id=\"component-count\">Component count</h2>\n<p>How many disconnected islands.</p>\n<p>Ideally one large component holding most pages, plus a few genuinely separate\ntopics. If the main component holds less than about eighty percent of pages, the\nvault is fragmented and answers will be systematically incomplete without\nanything appearing wrong.</p>\n<h2 id=\"stale-page-rate\">Stale page rate</h2>\n<p>Concept pages whose <code>updated</code> date is older than ninety days, as a share of\nconcept pages.</p>\n<p>Some staleness is correct: a well-written page on a settled idea does not need\ntouching. But a vault where most concept pages have not been touched in months\nwhile sources keep arriving means new material is landing in new pages instead\nof updating existing ones. That is how you end up with four pages about one\nthing.</p>\n<pre><code class=\"language-dataview\">TABLE updated FROM &quot;wiki/concepts&quot;\nWHERE updated &lt; date(today) - dur(90 days)\nSORT updated ASC\n</code></pre>\n<h2 id=\"what-not-to-track\">What not to track</h2>\n<p>Page count and word count. Both go up regardless of whether the vault is getting\nbetter, which makes them satisfying and useless. A vault that doubled its pages\nwhile doubling its orphan rate got worse.</p>\n<h2 id=\"recording-them\">Recording them</h2>\n<p>Append the four numbers to a note monthly. Trend is the information; a single\nreading tells you almost nothing, and you will not remember what last quarter's\norphan rate was.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../06-agents/README.md\">Agents</a>, for running all of this without you.</p>", "headings": ["Orphan rate", "Average degree", "Component count", "Stale page rate", "What not to track", "Recording them", "Next"], "words": 401, "text": "Four numbers, checked monthly. Their direction over time tells you whether the system is working, which is not obvious from using it day to day. bash python3 scripts/vault_stats.py ~/brain Orphan rate Pages with no inbound links, as a share of all pages. The single most diagnostic number in the vault. A rising orphan rate means ingestion is writing pages without connecting them, which is the exact failure mode that turns a wiki back into a folder. Under five percent is healthy. Over fifteen and something is broken in the ingest instructions, not in your habits. Average degree Links per page. Below two, the graph is barely connected and retrieval cannot do better than search. Between three and eight is the working range for a personal vault. Much above ten, check whether links are being added decoratively, which inflates the number while making the graph less useful. Watch it alongside page count. Degree that stays flat while the vault doubles is fine; degree that falls means new pages are attaching to less than the existing ones did. Component count How many disconnected islands. Ideally one large component holding most pages, plus a few genuinely separate topics. If the main component holds less than about eighty percent of pages, the vault is fragmented and answers will be systematically incomplete without anything appearing wrong. Stale page rate Concept pages whose updated date is older than ninety days, as a share of concept pages. Some staleness is correct: a well-written page on a settled idea does not need touching. But a vault where most concept pages have not been touched in months while sources keep arriving means new material is landing in new pages instead of updating existing ones. That is how you end up with four pages about one thing. dataview TABLE updated FROM \"wiki/concepts\" WHERE updated < date today - dur 90 days SORT updated ASC What not to track Page count and word count. Both go up regardless of whether the vault is getting better, which makes them satisfying and useless. A vault that doubled its pages while doubling its orphan rate got worse. Recording them Append the four numbers to a note monthly. Trend is the information; a single reading tells you almost nothing, and you will not remember what last quarter's orphan rate was. Next Agents ../06-agents/README.md , for running all of this without you.", "links": []}, {"id": "06-agents/agent-roles", "path": "docs/06-agents/agent-roles.md", "section": "06-agents", "section_title": "Agents", "title": "Agent roles", "html": "<p>One agent doing everything produces mediocre work at every job. The instructions\nthat make a good ingestor are not the ones that make a good reviewer, and stuffed\ninto one prompt they dilute each other.</p>\n<p>Six roles cover a vault, four of them read-only. The definitions are in\n<a href=\"../../agents/README.md\"><code>agents/</code></a>.</p>\n<h2 id=\"ingestor\">Ingestor</h2>\n<p>Reads <code>raw/</code>, writes wiki pages, links them, updates the index and log. Writes\nmore than any other role and is the one whose output quality determines\neverything downstream.</p>\n<p>Its instructions are narrow on purpose: it does not answer questions, does not\nrestructure existing pages beyond adding links, and does not delete. An ingestor\nthat reorganises while ingesting produces runs you cannot review, because content\nchanges and structural changes arrive mixed in the same diff.</p>\n<h2 id=\"linker\">Linker</h2>\n<p>Finds connections between existing pages that ingestion missed.</p>\n<p>Runs after imports and weekly. Adds links, creates nothing, rewrites nothing.\nSeparating it from the ingestor matters because linking well requires reading\nbroadly across the vault, which is a different job from reading one source\nclosely.</p>\n<p>Its one rule: a link it adds must be one you would agree with on reading both\npages side by side. A linker optimising for link count degrades the graph while\nappearing productive.</p>\n<h2 id=\"reviewer\">Reviewer</h2>\n<p>Read-only. Produces the periodic review: what changed, where attention went,\nwhat contradicts what, what to read next.</p>\n<p>Read-only is not caution, it is what makes the review trustworthy. A reviewer\nthat can edit will fix small things as it goes, and then its report describes a\nvault that no longer exists.</p>\n<h2 id=\"researcher\">Researcher</h2>\n<p>Read-only. Answers questions from the vault, cites pages, names what is missing.</p>\n<p>Also the role you talk to most, and the one that most needs the rule about not\nfalling back on general knowledge. See the\n<a href=\"../../skills/README.md\">query skill</a>.</p>\n<h2 id=\"graph-analyst\">Graph analyst</h2>\n<p>Read-only. Runs the metrics, finds hubs, bridges and clusters, and says what the\nnumbers mean for retrieval. Monthly.</p>\n<p>Separate from the linter because analysis and repair want opposite dispositions:\none should notice everything, the other should touch as little as possible.</p>\n<h2 id=\"curator\">Curator</h2>\n<p>Read-only. Proposes what to prune, archive or merge, quarterly.</p>\n<p>Proposals only, never actions. Deletion is the one operation you cannot recover\nfrom by reading a diff, so it stays a decision the owner makes.</p>\n<h2 id=\"roles-not-worth-creating\">Roles not worth creating</h2>\n<p><strong>A deleter.</strong> Deletion should be a decision you make, executed with a record.\nThe curator proposes; you dispose.</p>\n<p><strong>A summariser.</strong> Summaries of pages that are already summaries produce a layer\nthat is less true than what is under it and gets read instead of it.</p>\n<p><strong>A tagger.</strong> Tagging is a five-second judgement made during ingest with full\ncontext. A separate pass has less context and produces worse tags.</p>\n<h2 id=\"handoffs\">Handoffs</h2>\n<p>Roles communicate through the vault, not through each other. The ingestor writes\ngaps into <code>index.md</code>; the linker reads them. The ingestor logs its run; the\nreviewer reads the log.</p>\n<p>That is deliberate. Files as the interface means any run is inspectable\nafterwards, and a role can be replaced without touching the others.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"scheduled-maintenance.md\">Scheduling</a></p>", "headings": ["Ingestor", "Linker", "Reviewer", "Researcher", "Graph analyst", "Curator", "Roles not worth creating", "Handoffs", "Next"], "words": 507, "text": "One agent doing everything produces mediocre work at every job. The instructions that make a good ingestor are not the ones that make a good reviewer, and stuffed into one prompt they dilute each other. Six roles cover a vault, four of them read-only. The definitions are in agents/ ../../agents/README.md . Ingestor Reads raw/ , writes wiki pages, links them, updates the index and log. Writes more than any other role and is the one whose output quality determines everything downstream. Its instructions are narrow on purpose: it does not answer questions, does not restructure existing pages beyond adding links, and does not delete. An ingestor that reorganises while ingesting produces runs you cannot review, because content changes and structural changes arrive mixed in the same diff. Linker Finds connections between existing pages that ingestion missed. Runs after imports and weekly. Adds links, creates nothing, rewrites nothing. Separating it from the ingestor matters because linking well requires reading broadly across the vault, which is a
