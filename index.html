 a CLAUDE.md inside\nthat project folder describing what this project is, its one goal, and your\nspecific role in helping me hit it. Interview me if you need details.\n</code></pre>\n<p>Repeat per area: content, finances, clients. One goal per project, stated in\nthe project's own <code>CLAUDE.md</code>. Projects with three goals produce work that\nserves none of them.</p>\n<h2 id=\"rules-that-keep-it-working\">Rules that keep it working</h2>\n<ul>\n<li><strong>Never edit <code>raw/</code>.</strong> It is the archive. If a source is wrong, replace the\n  file and re-ingest, so it stays a faithful record of what you actually saved.</li>\n<li><strong>Do not nest deeply.</strong> Folders four levels down stop getting opened. The\n  graph is the navigation, not the tree.</li>\n<li><strong>Everything the agent generates for outside use goes to <code>output/</code> or the\n  project's <code>Outputs/</code>,</strong> never loose in the vault root.</li>\n</ul>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"project-scoping.md\">Project scoping</a></p>", "headings": ["Why the split", "Set the projects up by asking", "Rules that keep it working", "Next"], "words": 426, "text": "The vault does two different jobs, and they want different shapes. Keeping them in one folder tree while keeping the shapes separate is what makes the system hold up past the first month. The knowledge layer is what you have read and understood. It grows forever and it is organised by idea. The project layer is what you are working on now. It is organised by pipeline and most of it goes cold when the project ships. brain/ CLAUDE.md who you are, how the vault works raw/ source material, never edited after it lands assets/ wiki/ the knowledge layer sources/ one page per ingested item entities/ people, organisations, products, tools concepts/ ideas, methods, frameworks synthesis/ comparisons, themes, open questions index.md catalog of every page log.md what the agent did, chronologically projects/ the project layer youtube-channel/ CLAUDE.md this project only Inputs/ ideas, briefs, raw material Process/ work in progress Outputs/ finished work Feedback/ results, metrics, what happened output/ generated reports and drafts Why the split A project pipeline answers \"what am I doing this week\". A wiki answers \"what do I know about X\". Force one structure to do both and you get either a knowledge base full of dead task folders, or projects buried under conceptual pages nobody opens while working. They connect through links. A project page links to the concepts it depends on; concept pages accumulate references from the projects that used them. That is where the compounding shows up: the second time you start a project in a domain, the knowledge layer already has it. Set the projects up by asking Create a project folder in my vault called youtube-channel. Inside it, create four folders: Inputs, Process, Outputs, Feedback. Then write a CLAUDE.md inside that project folder describing what this project is, its one goal, and your specific role in helping me hit it. Interview me if you need details. Repeat per area: content, finances, clients. One goal per project, stated in the project's own CLAUDE.md . Projects with three goals produce work that serves none of them. Rules that keep it working - Never edit raw/ . It is the archive. If a source is wrong, replace the file and re-ingest, so it stays a faithful record of what you actually saved. - Do not nest deeply. Folders four levels down stop getting opened. The graph is the navigation, not the tree. - Everything the agent generates for outside use goes to output/ or the project's Outputs/ , never loose in the vault root. Next Project scoping project-scoping.md", "links": [{"to": "02-setup/project-scoping", "label": "Project scoping"}]}, {"id": "02-setup/project-scoping", "path": "docs/02-setup/project-scoping.md", "section": "02-setup", "section_title": "Setup", "title": "Project scoping", "html": "<p>This is the step that most setups skip and then wonder why output quality drops\nas the vault grows.</p>\n<p>When the agent is pointed at the whole vault, every task competes with\neverything you have ever saved. It reads a root <code>CLAUDE.md</code> covering your entire\nlife, plus whatever else it decides is relevant. Answers get broader and\nshallower.</p>\n<p>When it is pointed at one project, it reads that project's <code>CLAUDE.md</code>, sees\nthat project's files, and does the job in front of it.</p>\n<h2 id=\"how-to-scope\">How to scope</h2>\n<p>In Obsidian, click the vault name in the bottom left, then:</p>\n<p><strong>Manage vaults \u2192 Open folder as a vault \u2192 pick your project folder \u2192 Trust</strong></p>\n<p>From a terminal, the same thing is just:</p>\n<pre><code class=\"language-bash\">cd ~/brain/projects/youtube-channel\nclaude\n</code></pre>\n<p>The agent now reads only that project's instructions.</p>\n<h2 id=\"when-to-use-which\">When to use which</h2>\n<p><strong>The full vault</strong> for anything that spans domains: planning, review, asking\nwhat you know about a topic, weekly maintenance, ingestion. The knowledge layer\nis the whole point of a wide view.</p>\n<p><strong>A single project</strong> for producing anything: drafting, building, analysing this\nweek's numbers. Narrow context, one goal, no drift.</p>\n<p>The rough rule: the full vault plans, a single project ships.</p>\n<h2 id=\"passing-knowledge-into-a-project\">Passing knowledge into a project</h2>\n<p>Scoping down cuts the agent off from the wiki, which is usually what you want\nand occasionally not. Two ways to bridge it:</p>\n<ul>\n<li>Link the relevant concept pages from the project's <code>CLAUDE.md</code>, and copy the\n  handful that genuinely matter into the project's <code>Inputs/</code>.</li>\n<li>Or run the research question against the full vault first, save the answer\n  into the project's <code>Inputs/</code>, then scope down and work.</li>\n</ul>\n<p>The second is better. It keeps the decision about what matters with you, which\nis the part you should not be delegating.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"live-data.md\">Live data connectors</a></p>", "headings": ["How to scope", "When to use which", "Passing knowledge into a project", "Next"], "words": 298, "text": "This is the step that most setups skip and then wonder why output quality drops as the vault grows. When the agent is pointed at the whole vault, every task competes with everything you have ever saved. It reads a root CLAUDE.md covering your entire life, plus whatever else it decides is relevant. Answers get broader and shallower. When it is pointed at one project, it reads that project's CLAUDE.md , sees that project's files, and does the job in front of it. How to scope In Obsidian, click the vault name in the bottom left, then: Manage vaults \u2192 Open folder as a vault \u2192 pick your project folder \u2192 Trust From a terminal, the same thing is just: bash cd ~/brain/projects/youtube-channel claude The agent now reads only that project's instructions. When to use which The full vault for anything that spans domains: planning, review, asking what you know about a topic, weekly maintenance, ingestion. The knowledge layer is the whole point of a wide view. A single project for producing anything: drafting, building, analysing this week's numbers. Narrow context, one goal, no drift. The rough rule: the full vault plans, a single project ships. Passing knowledge into a project Scoping down cuts the agent off from the wiki, which is usually what you want and occasionally not. Two ways to bridge it: - Link the relevant concept pages from the project's CLAUDE.md , and copy the handful that genuinely matter into the project's Inputs/ . - Or run the research question against the full vault first, save the answer into the project's Inputs/ , then scope down and work. The second is better. It keeps the decision about what matters with you, which is the part you should not be delegating. Next Live data connectors live-data.md", "links": [{"to": "02-setup/live-data", "label": "Live data connectors"}]}, {"id": "02-setup/live-data", "path": "docs/02-setup/live-data.md", "section": "02-setup", "section_title": "Setup", "title": "Live data connectors", "html": "<p>Static notes are half a brain. The other half is what is changing: your\ncalendar, your inbox, the channels where decisions actually get made.</p>\n<p>MCP connects those the same way it connects Obsidian.</p>\n<h2 id=\"calendar\">Calendar</h2>\n<pre><code class=\"language-bash\">claude mcp add google-workspace uvx workspace-mcp --tools calendar\n</code></pre>\n<p>An OAuth sign-in opens in the browser. Grant read access.</p>\n<p>Then the vault can act on it:</p>\n<pre><code>Read my calendar for today, log what I committed to in each meeting into my\ntasks project, and flag anything without a clear next step.\n</code></pre>\n<p>Email, Slack and Notion connect through their own MCP servers, registered the\nsame way.</p>\n<h2 id=\"grant-read-not-write\">Grant read, not write</h2>\n<p>Give every connector the narrowest scope that does the job, and prefer read-only\nwherever the option exists. The brain should read your data, not delete it or\nsend things on your behalf.</p>\n<h2 id=\"the-rule-that-matters-most\">The rule that matters most</h2>\n<p><strong>Keys, not prompts.</strong></p>\n<p>Telling an agent \"do not delete this\" is a suggestion. It is not a safety\nsetting. If the agent technically can delete a file, empty a folder or send an\nemail, then one day, in some context you did not predict, it will.</p>\n<p>Control what is possible at the permission level: read-only tokens, scoped keys,\nseparate credentials per connector. Then the instruction in your <code>CLAUDE.md</code> is\na preference on top of a boundary, rather than the only thing standing between\nyour inbox and a bad run.</p>\n<p>This applies to your own vault too. See\n<a href=\"../06-agents/safety-and-guardrails.md\">guardrails</a>.</p>\n<h2 id=\"what-is-worth-connecting\">What is worth connecting</h2>\n<p>Connect the sources where decisions and commitments live: calendar first, then\nwhichever of email or chat you actually use for work.</p>\n<p>Skip the ones that produce volume without signal. A connector that floods the\nvault with notifications makes every future query worse, because the agent has\nto read past all of it.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"obsidian-plugins.md\">Plugins worth installing</a></p>", "headings": ["Calendar", "Grant read, not write", "The rule that matters most", "What is worth connecting", "Next"], "words": 306, "text": "Static notes are half a brain. The other half is what is changing: your calendar, your inbox, the channels where decisions actually get made. MCP connects those the same way it connects Obsidian. Calendar bash claude mcp add google-workspace uvx workspace-mcp --tools calendar An OAuth sign-in opens in the browser. Grant read access. Then the vault can act on it: Read my calendar for today, log what I committed to in each meeting into my tasks project, and flag anything without a clear next step. Email, Slack and Notion connect through their own MCP servers, registered the same way. Grant read, not write Give every connector the narrowest scope that does the job, and prefer read-only wherever the option exists. The brain should read your data, not delete it or send things on your behalf. The rule that matters most Keys, not prompts. Telling an agent \"do not delete this\" is a suggestion. It is not a safety setting. If the agent technically can delete a file, empty a folder or send an email, then one day, in some context you did not predict, it will. Control what is possible at the permission level: read-only tokens, scoped keys, separate credentials per connector. Then the instruction in your CLAUDE.md is a preference on top of a boundary, rather than the only thing standing between your inbox and a bad run. This applies to your own vault too. See guardrails ../06-agents/safety-and-guardrails.md . What is worth connecting Connect the sources where decisions and commitments live: calendar first, then whichever of email or chat you actually use for work. Skip the ones that produce volume without signal. A connector that floods the vault with notifications makes every future query worse, because the agent has to read past all of it. Next Plugins worth installing obsidian-plugins.md", "links": [{"to": "06-agents/safety-and-guardrails", "label": "guardrails"}, {"to": "02-setup/obsidian-plugins", "label": "Plugins worth installing"}]}, {"id": "02-setup/obsidian-plugins", "path": "docs/02-setup/obsidian-plugins.md", "section": "02-setup", "section_title": "Setup", "title": "Plugins worth installing", "html": "<p>Obsidian works fine with none of these. Add them when you hit the specific\nproblem each one solves.</p>\n<h2 id=\"local-rest-api\">Local REST API</h2>\n<p>Required only for the <a href=\"mcp-obsidian.md\">MCP path</a>. Serves your vault over a\nlocal HTTP API so the agent can reach it while Obsidian is open, from any\nsession.</p>\n<h2 id=\"dataview\">Dataview</h2>\n<p>Queries over frontmatter, rendered inside a note. Worth it once you have enough\npages to want dashboards:</p>\n<pre><code>```dataview\nTABLE updated, tags\nFROM &quot;wiki/concepts&quot;\nWHERE updated &lt; date(today) - dur(90 days)\nSORT updated ASC\n```\n</code></pre>\n<p>That one lists concept pages nobody has touched in three months, which is the\nmost useful review query in the vault.</p>\n<h2 id=\"templater\">Templater</h2>\n<p>Templates with variables and dates, for the page shapes in\n<a href=\"../../vault-template/templates/\"><code>vault-template/templates/</code></a>. Useful for the\nnotes you write by hand. The agent does not need it, it writes frontmatter\ndirectly.</p>\n<h2 id=\"worth-adding-later\">Worth adding later</h2>\n<ul>\n<li><strong><a href=\"https://github.com/Vinzent03/obsidian-git\">Git</a></strong>, the third most installed\n  plugin in the catalog. Commits from inside Obsidian, which pairs with\n  <a href=\"../09-maintenance/versioning-with-git.md\">versioning</a>.</li>\n<li><strong><a href=\"https://github.com/obsidianmd/obsidian-importer\">Importer</a></strong>, official,\n  pulls in Notion, Evernote, Roam, Bear and Apple Notes. The first step if you\n  are migrating an existing pile.</li>\n<li><strong><a href=\"https://github.com/Vinzent03/find-unlinked-files\">Find orphaned files and broken links</a></strong>,\n  the same checks as <a href=\"../09-maintenance/lint-and-health.md\">lint</a> without leaving\n  the app.</li>\n<li><strong><a href=\"https://github.com/scambier/obsidian-omnisearch\">Omnisearch</a></strong> for better\n  full-text search, including inside PDFs.</li>\n</ul>\n<p>Full ranked list with install counts:\n<a href=\"../../resources/plugins.md\">resources/plugins.md</a>.</p>\n<h2 id=\"what-to-avoid\">What to avoid</h2>\n<p>Plugins that rewrite files in the background. Anything that auto-formats,\nauto-sorts frontmatter, or renames on a schedule will fight the agent, and you\nwill spend an evening working out which of the two mangled a page.</p>\n<p>Also avoid heavy graph or dashboard plugins until you have material worth\nlooking at. An empty vault with fifteen plugins is a procrastination artifact,\nnot a system.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"git-and-sync.md\">Git, sync and backups</a></p>", "headings": ["Local REST API", "Dataview", "Templater", "Worth adding later", "What to avoid", "Next"], "words": 288, "text": "Obsidian works fine with none of these. Add them when you hit the specific problem each one solves. Local REST API Required only for the MCP path mcp-obsidian.md . Serves your vault over a local HTTP API so the agent can reach it while Obsidian is open, from any session. Dataview Queries over frontmatter, rendered inside a note. Worth it once you have enough pages to want dashboards: dataview TABLE updated, tags FROM \"wiki/concepts\" WHERE updated < date today - dur 90 days SORT updated ASC That one lists concept pages nobody has touched in three months, which is the most useful review query in the vault. Templater Templates with variables and dates, for the page shapes in vault-template/templates/ ../../vault-template/templates/ . Useful for the notes you write by hand. The agent does not need it, it writes frontmatter directly. Worth adding later - Git https://github.com/Vinzent03/obsidian-git , the third most installed plugin in the catalog. Commits from inside Obsidian, which pairs with versioning ../09-maintenance/versioning-with-git.md . - Importer https://github.com/obsidianmd/obsidian-importer , official, pulls in Notion, Evernote, Roam, Bear and Apple Notes. The first step if you are migrating an existing pile. - Find orphaned files and broken links https://github.com/Vinzent03/find-unlinked-files , the same checks as lint ../09-maintenance/lint-and-health.md without leaving the app. - Omnisearch https://github.com/scambier/obsidian-omnisearch for better full-text search, including inside PDFs. Full ranked list with install counts: resources/plugins.md ../../resources/plugins.md . What to avoid Plugins that rewrite files in the background. Anything that auto-formats, auto-sorts frontmatter, or renames on a schedule will fight the agent, and you will spend an evening working out which of the two mangled a page. Also avoid heavy graph or dashboard plugins until you have material worth looking at. An empty vault with fifteen plugins is a procrastination artifact, not a system. Next Git, sync and backups git-and-sync.md", "links": [{"to": "02-setup/mcp-obsidian", "label": "MCP path"}, {"to": "09-maintenance/versioning-with-git", "label": "versioning"}, {"to": "09-maintenance/lint-and-health", "label": "lint"}, {"to": "02-setup/git-and-sync", "label": "Git, sync and backups"}]}, {"id": "02-setup/git-and-sync", "path": "docs/02-setup/git-and-sync.md", "section": "02-setup", "section_title": "Setup", "title": "Git, sync and backups", "html": "<p>A vault is a folder of text files, which makes it close to an ideal git\nrepository, and git is what makes an agent safe to run unattended.</p>\n<p>Without version control, a bad run is a mystery. With it, every change the agent\nmade is a diff you can read and revert in one command.</p>\n<pre><code class=\"language-bash\">cd ~/brain\ngit init\ngit add .\ngit commit -m &quot;initial vault&quot;\n</code></pre>\n<h2 id=\"what-to-ignore\">What to ignore</h2>\n<pre><code>.obsidian/workspace*\n.obsidian/cache\n.DS_Store\n.trash/\n</code></pre>\n<p>Commit the rest of <code>.obsidian/</code>, so your plugin list and settings travel with\nthe vault. Never commit API keys; the Local REST API key lives in plugin data,\nso check what <code>.obsidian/plugins/</code> contains before the first push.</p>\n<p>If any part of the vault is private, keep the remote private. A second brain is\none of the highest-signal documents about a person that exists.</p>\n<h2 id=\"commit-around-agent-runs\">Commit around agent runs</h2>\n<p>Commit before a big ingest and after it. Then a bad batch is\n<code>git checkout .</code> rather than an afternoon of manual repair. Scheduled tasks\nshould commit their own work with a message naming the run, so the history stays\nreadable months later.</p>\n<h2 id=\"sync-across-machines\">Sync across machines</h2>\n<ul>\n<li><strong>Git remote:</strong> free, versioned, works everywhere, needs a pull and push\n  habit.</li>\n<li><strong>Obsidian Sync:</strong> paid, end-to-end encrypted, handles mobile properly.</li>\n<li><strong>Generic cloud drives:</strong> work, with a caveat. A sync client rewriting files\n  while an agent writes them produces conflict copies. If you go this route,\n  keep long-running agent work to one machine.</li>\n</ul>\n<h2 id=\"backups\">Backups</h2>\n<p>Sync is not backup. Sync propagates a bad delete to every device.</p>\n<p>Keep one copy that is not connected to the sync path: a periodic archive to\nexternal storage or a separate remote. Test a restore once, before you need it.\nThe failure mode you are protecting against is not disk death, it is an\nautomation that quietly rewrote two hundred pages three weeks ago.</p>\n<h2 id=\"next\">Next</h2>\n<p>The vault is set up. Go to <a href=\"../03-ingestion/README.md\">Ingestion</a> to start\nfeeding it, or <a href=\"../04-structuring/README.md\">Structuring</a> for the rules that\ndecide what the pages look like.</p>", "headings": ["What to ignore", "Commit around agent runs", "Sync across machines", "Backups", "Next"], "words": 342, "text": "A vault is a folder of text files, which makes it close to an ideal git repository, and git is what makes an agent safe to run unattended. Without version control, a bad run is a mystery. With it, every change the agent made is a diff you can read and revert in one command. bash cd ~/brain git init git add . git commit -m \"initial vault\" What to ignore .obsidian/workspace .obsidian/cache .DS_Store .trash/ Commit the rest of .obsidian/ , so your plugin list and settings travel with the vault. Never commit API keys; the Local REST API key lives in plugin data, so check what .obsidian/plugins/ contains before the first push. If any part of the vault is private, keep the remote private. A second brain is one of the highest-signal documents about a person that exists. Commit around agent runs Commit before a big ingest and after it. Then a bad batch is git checkout . rather than an afternoon of manual repair. Scheduled tasks should commit their own work with a message naming the run, so the history stays readable months later. Sync across machines - Git remote: free, versioned, works everywhere, needs a pull and push habit. - Obsidian Sync: paid, end-to-end encrypted, handles mobile properly. - Generic cloud drives: work, with a caveat. A sync client rewriting files while an agent writes them produces conflict copies. If you go this route, keep long-running agent work to one machine. Backups Sync is not backup. Sync propagates a bad delete to every device. Keep one copy that is not connected to the sync path: a periodic archive to external storage or a separate remote. Test a restore once, before you need it. The failure mode you are protecting against is not disk death, it is an automation that quietly rewrote two hundred pages three weeks ago. Next The vault is set up. Go to Ingestion ../03-ingestion/README.md to start feeding it, or Structuring ../04-structuring/README.md for the rules that decide what the pages look like.", "links": []}, {"id": "03-ingestion/web-clipper", "path": "docs/03-ingestion/web-clipper.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "Web articles", "html": "<p>Articles are the bulk of what most people save, and the browser is where the\ndecision to save happens. Anything that requires switching windows loses.</p>\n<h2 id=\"obsidian-web-clipper\">Obsidian Web Clipper</h2>\n<p>The <a href=\"https://obsidian.md/clipper\">official extension</a> from the Obsidian team.\nChrome, Firefox, Safari, Edge, Brave and Arc. It extracts the readable content\nof a page using Mozilla Readability, the same engine behind Firefox Reader View,\nand saves it as markdown straight into your vault.</p>\n<p>Install it, open the settings, and set the destination folder to <code>raw/</code>.</p>\n<h2 id=\"template\">Template</h2>\n<p>The default template saves the page body. Add frontmatter so the agent knows\nwhat it is holding without re-reading the whole file:</p>\n<pre><code>---\ntitle: {{title}}\nsource: {{url}}\nauthor: {{author}}\npublished: {{published}}\nclipped: {{date}}\ntype: article\n---\n\n{{content}}\n</code></pre>\n<p><code>{{author}}</code> and <code>{{published}}</code> come back empty on plenty of sites. That is\nfine, an empty field is better than a guessed one, and the agent handles the\ngap by saying the source is undated rather than inventing a date.</p>\n<h2 id=\"what-to-clip\">What to clip</h2>\n<p>Clip what you would want to find again in a year: primary sources, engineering\nposts, papers, documentation, arguments you disagree with and want to answer\nlater.</p>\n<p>Skip news that will be stale in a week, listicles, and anything you are saving\nout of guilt. Every low-value page you ingest costs twice: once at ingest, and\nagain every time the agent reads past it looking for something else.</p>\n<p>The honest test at clip time is whether you can name what you would ask this\nsource later. If you cannot, do not clip it.</p>\n<h2 id=\"awkward-pages\">Awkward pages</h2>\n<ul>\n<li><strong>Paywalls.</strong> The clipper saves what the browser rendered. If you can read it,\n  it can save it. If you cannot, it saves the paywall notice, so check before\n  moving on.</li>\n<li><strong>Documentation sites.</strong> Clipping page by page is a losing game. Save the\n  entry point and let the agent fetch the rest, or clone the docs repo into\n  <code>raw/</code> if it is open source.</li>\n<li><strong>Single-page apps and dynamic content.</strong> Readability sometimes returns a\n  fragment. Look at the file before ingest.</li>\n<li><strong>Threads and comment sections.</strong> The value is usually in the replies, which\n  the clipper drops. Copy the thread manually or screenshot it into\n  <code>raw/assets/</code>.</li>\n</ul>\n<h2 id=\"clip-now-ingest-later\">Clip now, ingest later</h2>\n<p>Clipping and ingesting are separate steps on purpose. Clip freely during the\nday, run <code>/ingest</code> in one batch later, because ingesting one source at a time\ngives the agent no chance to spot that three things you saved this week are\nabout the same idea.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"youtube-transcripts.md\">YouTube and podcasts</a></p>", "headings": ["Obsidian Web Clipper", "Template", "What to clip", "Awkward pages", "Clip now, ingest later", "Next"], "words": 423, "text": "Articles are the bulk of what most people save, and the browser is where the decision to save happens. Anything that requires switching windows loses. Obsidian Web Clipper The official extension https://obsidian.md/clipper from the Obsidian team. Chrome, Firefox, Safari, Edge, Brave and Arc. It extracts the readable content of a page using Mozilla Readability, the same engine behind Firefox Reader View, and saves it as markdown straight into your vault. Install it, open the settings, and set the destination folder to raw/ . Template The default template saves the page body. Add frontmatter so the agent knows what it is holding without re-reading the whole file: --- title: {{title}} source: {{url}} author: {{author}} published: {{published}} clipped: {{date}} type: article --- {{content}} {{author}} and {{published}} come back empty on plenty of sites. That is fine, an empty field is better than a guessed one, and the agent handles the gap by saying the source is undated rather than inventing a date. What to clip Clip what you would want to find again in a year: primary sources, engineering posts, papers, documentation, arguments you disagree with and want to answer later. Skip news that will be stale in a week, listicles, and anything you are saving out of guilt. Every low-value page you ingest costs twice: once at ingest, and again every time the agent reads past it looking for something else. The honest test at clip time is whether you can name what you would ask this source later. If you cannot, do not clip it. Awkward pages - Paywalls. The clipper saves what the browser rendered. If you can read it, it can save it. If you cannot, it saves the paywall notice, so check before moving on. - Documentation sites. Clipping page by page is a losing game. Save the entry point and let the agent fetch the rest, or clone the docs repo into raw/ if it is open source. - Single-page apps and dynamic content. Readability sometimes returns a fragment. Look at the file before ingest. - Threads and comment sections. The value is usually in the replies, which the clipper drops. Copy the thread manually or screenshot it into raw/assets/ . Clip now, ingest later Clipping and ingesting are separate steps on purpose. Clip freely during the day, run /ingest in one batch later, because ingesting one source at a time gives the agent no chance to spot that three things you saved this week are about the same idea. Next YouTube and podcasts youtube-transcripts.md", "links": [{"to": "03-ingestion/youtube-transcripts", "label": "YouTube and podcasts"}]}, {"id": "03-ingestion/youtube-transcripts", "path": "docs/03-ingestion/youtube-transcripts.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "YouTube and podcasts", "html": "<p>Video is the highest-volume, lowest-retention source most people have. An hour\nof a conference talk leaves almost nothing behind a week later. Transcripts fix\nthat, and a transcript is just text, which is exactly what the vault wants.</p>\n<h2 id=\"pulling-a-transcript\">Pulling a transcript</h2>\n<p>Most videos have captions, auto-generated or uploaded. Two dependable routes:</p>\n<pre><code class=\"language-bash\"># yt-dlp: subtitles only, no video download\nyt-dlp --write-auto-sub --skip-download --sub-format vtt --sub-lang en URL\n</code></pre>\n<pre><code class=\"language-python\"># youtube-transcript-api, if you want it in a script\nfrom youtube_transcript_api import YouTubeTranscriptApi\nlines = YouTubeTranscriptApi.get_transcript(&quot;VIDEO_ID&quot;)\n</code></pre>\n<p>Save the result into <code>raw/</code> with frontmatter naming the video, the channel and\nthe URL. Without the URL, a transcript is an anonymous wall of text and the\nagent cannot cite it properly.</p>\n<h2 id=\"keep-the-timestamps\">Keep the timestamps</h2>\n<p>Auto-generated transcripts arrive as timestamped fragments. Strip the\nformatting, keep coarse timestamps every few minutes.</p>\n<p>The reason is retrieval: when the wiki says a claim came from minute 34 of a\ntalk, you can verify it in ten seconds. Without that, checking means rewatching,\nwhich means you will not check.</p>\n<h2 id=\"clean-before-ingest\">Clean before ingest</h2>\n<p>Auto-captions have no punctuation, no speaker labels, and mangle technical\nterms. Have the agent do a pass first:</p>\n<pre><code>Read raw/talk-transcript.md. Add punctuation and paragraph breaks, label\nspeakers where they change, and fix obvious mistranscriptions of technical\nterms. Do not summarise, do not cut anything, and flag anything you could not\nmake sense of.\n</code></pre>\n<p>Do not skip to ingesting the raw caption dump. Concept pages built from\nunpunctuated text come out noticeably worse, because the model spends its\nattention reconstructing sentence boundaries instead of understanding claims.</p>\n<h2 id=\"long-videos\">Long videos</h2>\n<p>A three-hour podcast is not one source. Split it by topic before ingesting,\neither by chapter markers if the uploader added them, or by asking the agent to\npropose split points from the transcript.</p>\n<p>Ingested whole, a long interview produces one bloated source page and two or\nthree vague concepts. Split, it produces the four ideas that were actually in\nit.</p>\n<h2 id=\"podcasts-and-audio\">Podcasts and audio</h2>\n<p>Podcasts rarely ship transcripts. Options, in order of effort: check the show\nnotes, many now publish one; run local transcription with Whisper; or use a\ntranscription service.</p>\n<p>Local transcription is worth setting up if you listen daily. The audio never\nleaves your machine, which matters more for meeting recordings than for\npodcasts.</p>\n<h2 id=\"what-is-worth-transcribing\">What is worth transcribing</h2>\n<p>Talks, lectures, interviews with practitioners, anything with a specific claim\nyou might need later.</p>\n<p>Not tutorials you watched to do a task once, and not anything you would not\nreread as an article. Video feels valuable while watching because it takes an\nhour. That feeling is not a signal about the content.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"pdfs-and-books.md\">PDFs, papers and books</a></p>", "headings": ["Pulling a transcript", "Keep the timestamps", "Clean before ingest", "Long videos", "Podcasts and audio", "What is worth transcribing", "Next"], "words": 448, "text": "Video is the highest-volume, lowest-retention source most people have. An hour of a conference talk leaves almost nothing behind a week later. Transcripts fix that, and a transcript is just text, which is exactly what the vault wants. Pulling a transcript Most videos have captions, auto-generated or uploaded. Two dependable routes: bash yt-dlp: subtitles only, no video download yt-dlp --write-auto-sub --skip-download --sub-format vtt --sub-lang en URL python youtube-transcript-api, if you want it in a script from youtube_transcript_api import YouTubeTranscriptApi lines = YouTubeTranscriptApi.get_transcript \"VIDEO_ID\" Save the result into raw/ with frontmatter naming the video, the channel and the URL. Without the URL, a transcript is an anonymous wall of text and the agent cannot cite it properly. Keep the timestamps Auto-generated transcripts arrive as timestamped fragments. Strip the formatting, keep coarse timestamps every few minutes. The reason is retrieval: when the wiki says a claim came from minute 34 of a talk, you can verify it in ten seconds. Without that, checking means rewatching, which means you will not check. Clean before ingest Auto-captions have no punctuation, no speaker labels, and mangle technical terms. Have the agent do a pass first: Read raw/talk-transcript.md. Add punctuation and paragraph breaks, label speakers where they change, and fix obvious mistranscriptions of technical terms. Do not summarise, do not cut anything, and flag anything you could not make sense of. Do not skip to ingesting the raw caption dump. Concept pages built from unpunctuated text come out noticeably worse, because the model spends its attention reconstructing sentence boundaries instead of understanding claims. Long videos A three-hour podcast is not one source. Split it by topic before ingesting, either by chapter markers if the uploader added them, or by asking the agent to propose split points from the transcript. Ingested whole, a long interview produces one bloated source page and two or three vague concepts. Split, it produces the four ideas that were actually in it. Podcasts and audio Podcasts rarely ship transcripts. Options, in order of effort: check the show notes, many now publish one; run local transcription with Whisper; or use a transcription service. Local transcription is worth setting up if you listen daily. The audio never leaves your machine, which matters more for meeting recordings than for podcasts. What is worth transcribing Talks, lectures, interviews with practitioners, anything with a specific claim you might need later. Not tutorials you watched to do a task once, and not anything you would not reread as an article. Video feels valuable while watching because it takes an hour. That feeling is not a signal about the content. Next PDFs, papers and books pdfs-and-books.md", "links": [{"to": "03-ingestion/pdfs-and-books", "label": "PDFs, papers and books"}]}, {"id": "03-ingestion/pdfs-and-books", "path": "docs/03-ingestion/pdfs-and-books.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "PDFs, papers and books", "html": "<p>PDFs are the format most likely to arrive in your vault as garbage. Two columns\nbecome interleaved lines, tables collapse, footnotes land mid-sentence, and the\nagent quietly builds pages on top of the mess.</p>\n<p>Check extraction quality before ingesting. It takes ten seconds and saves\nrewriting pages later.</p>\n<h2 id=\"extraction\">Extraction</h2>\n<pre><code class=\"language-bash\"># text, layout preserved reasonably well\npdftotext -layout paper.pdf raw/paper.md\n</code></pre>\n<p>For anything structured, <code>pymupdf</code> gives better control and can pull images and\ntables separately. Whatever you use, open the output and read a paragraph from\nthe middle. If the sentences do not flow, fix extraction rather than hoping the\nagent copes.</p>\n<h2 id=\"scanned-documents\">Scanned documents</h2>\n<p>A scan is an image, and text extraction returns nothing or near-nothing. Run OCR\nfirst with <code>ocrmypdf</code>, which adds a text layer without changing the visible\ndocument. Expect errors in proper nouns and numbers, and treat any figure from\nan OCR'd source as needing verification before it goes into a wiki page as\nfact.</p>\n<h2 id=\"papers\">Papers</h2>\n<p>Papers deserve different handling than articles, because the parts you will\nwant later are not spread evenly. Abstract, method, results and limitations\ncarry almost everything.</p>\n<p>A useful ingest instruction:</p>\n<pre><code>This is an academic paper. Build the source page around: the question it asks,\nthe method, the result with its actual numbers, and the limitations the authors\nstate themselves. Record sample sizes. Do not report a finding without the\ncondition it holds under.\n</code></pre>\n<p>That last rule is what keeps a wiki honest. Findings stripped of their\nconditions become confident nonsense two years later.</p>\n<p>Zotero is worth using if you read papers regularly. It handles metadata and\nexports markdown, which lands in <code>raw/</code> cleanly.</p>\n<h2 id=\"books\">Books</h2>\n<p>A full book is too large to ingest as one source and mostly not worth it. What\nis worth it is your highlights.</p>\n<p>Kindle highlights export from the Kindle app or through Readwise, which syncs\ninto Obsidian directly. Highlights arrive as a list of quoted passages, so\ningest them as one source page per book, and let the agent build concept pages\nfrom the ideas rather than from the quotes.</p>\n<p>Keep the quotes short in the wiki and keep the citation. A page that reproduces\nhalf a chapter is a copyright problem and a retrieval problem at the same time.</p>\n<h2 id=\"figures-and-tables\">Figures and tables</h2>\n<p>Text extraction drops both. When a figure carries the argument, screenshot it\ninto <code>raw/assets/</code> and reference it from the source page, so the claim on the\npage has something behind it.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"chat-exports.md\">Chat exports</a></p>", "headings": ["Extraction", "Scanned documents", "Papers", "Books", "Figures and tables", "Next"], "words": 417, "text": "PDFs are the format most likely to arrive in your vault as garbage. Two columns become interleaved lines, tables collapse, footnotes land mid-sentence, and the agent quietly builds pages on top of the mess. Check extraction quality before ingesting. It takes ten seconds and saves rewriting pages later. Extraction bash text, layout preserved reasonably well pdftotext -layout paper.pdf raw/paper.md For anything structured, pymupdf gives better control and can pull images and tables separately. Whatever you use, open the output and read a paragraph from the middle. If the sentences do not flow, fix extraction rather than hoping the agent copes. Scanned documents A scan is an image, and text extraction returns nothing or near-nothing. Run OCR first with ocrmypdf , which adds a text layer without changing the visible document. Expect errors in proper nouns and numbers, and treat any figure from an OCR'd source as needing verification before it goes into a wiki page as fact. Papers Papers deserve different handling than articles, because the parts you will want later are not spread evenly. Abstract, method, results and limitations carry almost everything. A useful ingest instruction: This is an academic paper. Build the source page around: the question it asks, the method, the result with its actual numbers, and the limitations the authors state themselves. Record sample sizes. Do not report a finding without the condition it holds under. That last rule is what keeps a wiki honest. Findings stripped of their conditions become confident nonsense two years later. Zotero is worth using if you read papers regularly. It handles metadata and exports markdown, which lands in raw/ cleanly. Books A full book is too large to ingest as one source and mostly not worth it. What is worth it is your highlights. Kindle highlights export from the Kindle app or through Readwise, which syncs into Obsidian directly. Highlights arrive as a list of quoted passages, so ingest them as one source page per book, and let the agent build concept pages from the ideas rather than from the quotes. Keep the quotes short in the wiki and keep the citation. A page that reproduces half a chapter is a copyright problem and a retrieval problem at the same time. Figures and tables Text extraction drops both. When a figure carries the argument, screenshot it into raw/assets/ and reference it from the source page, so the claim on the page has something behind it. Next Chat exports chat-exports.md", "links": [{"to": "03-ingestion/chat-exports", "label": "Chat exports"}]}, {"id": "03-ingestion/chat-exports", "path": "docs/03-ingestion/chat-exports.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "Chat exports", "html": "<p>Your chat history is the most underrated source you own and the most sensitive.\nYears of problems you worked through, decisions you reasoned about, and\nexplanations tailored to what you did not understand at the time.</p>\n<p>It is also full of things you would not want in a file you might later share.\nRead the privacy section below before running anything here.</p>\n<h2 id=\"exporting\">Exporting</h2>\n<p>Both Claude and ChatGPT export the full history as JSON from account settings.\nThe export arrives by email as a download link, usually within minutes.</p>\n<h2 id=\"converting-to-markdown\">Converting to markdown</h2>\n<p>One JSON blob is not ingestible. Split it into one file per conversation:</p>\n<pre><code class=\"language-bash\">python3 scripts/chat_export_to_md.py conversations.json ./raw --min-words 150\n</code></pre>\n<p>The script is in <a href=\"../../scripts/README.md\"><code>scripts/</code></a>. It handles the common\nexport shapes, writes frontmatter with the title and date, and skips\nconversations shorter than the word threshold.</p>\n<p>Raise <code>--min-words</code> if the output is dominated by one-line exchanges. Most\npeople's history is roughly ninety percent short throwaway questions, and those\nadd nothing but volume.</p>\n<h2 id=\"filter-before-ingesting\">Filter before ingesting</h2>\n<p>Do not ingest the whole export. A thousand conversations produce a thousand\nsource pages and a wiki where everything is faintly connected to everything.</p>\n<p>Sort into three piles:</p>\n<ul>\n<li><strong>Worth ingesting.</strong> Conversations where you worked something out, decided\n  something, or got an explanation that landed. These carry your reasoning, not\n  just facts.</li>\n<li><strong>Worth keeping, not ingesting.</strong> Leave them in <code>raw/</code> as an archive. The\n  agent can search them on demand without every one having a wiki page.</li>\n<li><strong>Delete.</strong> Debugging sessions, one-off lookups, anything you would be\n  annoyed to find in a search result.</li>\n</ul>\n<p>Have the agent help with the sort rather than doing it by hand:</p>\n<pre><code>Read the titles and first exchange of every file in raw/chats/. Group them into\nworth-ingesting, archive, and delete, with one line of reasoning each. Do not\nmove or delete anything, just give me the lists.\n</code></pre>\n<h2 id=\"what-makes-these-sources-different\">What makes these sources different</h2>\n<p>A chat log is a record of you thinking, which means the useful extraction is\noften not the answer. It is the question you asked, the thing you had wrong at\nthe start, and what changed your mind.</p>\n<p>Tell the agent so:</p>\n<pre><code>These are my own past conversations. Build pages around what I was trying to\nwork out and what conclusion I reached, not around the assistant's explanations.\nNote where I changed position, and record the date, because my views may have\nmoved since.\n</code></pre>\n<h2 id=\"privacy\">Privacy</h2>\n<p>Chat history contains more about you than any other file in the vault: health,\nmoney, work you cannot discuss, other people's information you happened to\nmention.</p>\n<p>Before ingesting, decide what does not belong in the vault at all and delete\nthose files from <code>raw/</code>. Redaction after the fact is unreliable, because the\nmaterial will already have propagated into concept pages and links.</p>\n<p>If the vault lives in a git repo, keep the remote private. See\n<a href=\"../09-maintenance/privacy-and-secrets.md\">privacy</a>.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"voice-and-meetings.md\">Voice notes and meetings</a></p>", "headings": ["Exporting", "Converting to markdown", "Filter before ingesting", "What makes these sources different", "Privacy", "Next"], "words": 491, "text": "Your chat history is the most underrated source you own and the most sensitive. Years of problems you worked through, decisions you reasoned about, and explanations tailored to what you did not understand at the time. It is also full of things you would not want in a file you might later share. Read the privacy section below before running anything here. Exporting Both Claude and ChatGPT export the full history as JSON from account settings. The export arrives by email as a download link, usually within minutes. Converting to markdown One JSON blob is not ingestible. Split it into one file per conversation: bash python3 scripts/chat_export_to_md.py conversations.json ./raw --min-words 150 The script is in scripts/ ../../scripts/README.md . It handles the common export shapes, writes frontmatter with the title and date, and skips conversations shorter than the word threshold. Raise --min-words if the output is dominated by one-line exchanges. Most people's history is roughly ninety percent short throwaway questions, and those add nothing but volume. Filter before ingesting Do not ingest the whole export. A thousand conversations produce a thousand source pages and a wiki where everything is faintly connected to everything. Sort into three piles: - Worth ingesting. Conversations where you worked something out, decided something, or got an explanation that landed. These carry your reasoning, not just facts. - Worth keeping, not ingesting. Leave them in raw/ as an archive. The agent can search them on demand without every one having a wiki page. - Delete. Debugging sessions, one-off lookups, anything you would be annoyed to find in a search result. Have the agent help with the sort rather than doing it by hand: Read the titles and first exchange of every file in raw/chats/. Group them into worth-ingesting, archive, and delete, with one line of reasoning each. Do not move or delete anything, just give me the lists. What makes these sources different A chat log is a record of you thinking, which means the useful extraction is often not the answer. It is the question you asked, the thing you had wrong at the start, and what changed your mind. Tell the agent so: These are my own past conversations. Build pages around what I was trying to work out and what conclusion I reached, not around the assistant's explanations. Note where I changed position, and record the date, because my views may have moved since. Privacy Chat history contains more about you than any other file in the vault: health, money, work you cannot discuss, other people's information you happened to mention. Before ingesting, decide what does not belong in the vault at all and delete those files from raw/ . Redaction after the fact is unreliable, because the material will already have propagated into concept pages and links. If the vault lives in a git repo, keep the remote private. See privacy ../09-maintenance/privacy-and-secrets.md . Next Voice notes and meetings voice-and-meetings.md", "links": [{"to": "09-maintenance/privacy-and-secrets", "label": "privacy"}, {"to": "03-ingestion/voice-and-meetings", "label": "Voice notes and meetings"}]}, {"id": "03-ingestion/voice-and-meetings", "path": "docs/03-ingestion/voice-and-meetings.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "Voice notes and meetings", "html": "<p>The ideas worth capturing rarely arrive at your desk. Voice is the only capture\nmethod that works while walking, driving or standing in a queue, and it is the\none most vaults never wire up.</p>\n<h2 id=\"capture\">Capture</h2>\n<p>Any recorder app works, as long as the file ends up somewhere the vault can\nreach. The friction to eliminate is the transfer: if getting audio from phone to\nvault takes more than one action, you will stop.</p>\n<p>Simplest reliable setup: record in the phone's default app, share to a cloud\nfolder, and have a scheduled task transcribe anything new into <code>raw/</code>.</p>\n<p>Obsidian's mobile app can record directly into the vault, which removes the\ntransfer entirely if you already sync mobile.</p>\n<h2 id=\"transcription\">Transcription</h2>\n<p>Whisper runs locally and is good enough for a voice note recorded at arm's\nlength. Local matters more here than for other sources, because voice notes\ncarry half-formed thoughts and meeting audio carries other people's words.</p>\n<p>Expect names and technical terms to come out wrong. Correct them at ingest, not\nlater, while you still remember what you said.</p>\n<h2 id=\"voice-notes-are-drafts-not-sources\">Voice notes are drafts, not sources</h2>\n<p>A voice note is you thinking out loud, with false starts and abandoned\nsentences. Ingesting it verbatim produces an incoherent source page.</p>\n<p>Treat the transcript as raw input to a single idea:</p>\n<pre><code>This is a voice note, my own thinking out loud. Extract the actual idea, drop\nthe false starts and repetition, and write it as one short concept page in my\nwords. If there are two unrelated ideas, make two pages. Keep the recording date.\n</code></pre>\n<h2 id=\"meetings\">Meetings</h2>\n<p>Meetings produce three things worth keeping and a great deal that is not: the\ndecisions, the commitments with owners, and the open questions.</p>\n<pre><code>This is a meeting transcript. Extract decisions made, commitments with who owns\neach one, and open questions. Link every person mentioned to their entity page.\nSkip discussion that did not lead anywhere.\n</code></pre>\n<p>Route the commitments into the relevant project's <code>Inputs/</code> rather than the\nwiki. A commitment is work, not knowledge, and it goes stale in a week. The\n<a href=\"../01-concepts/two-layers.md\">two layers</a> page covers why that separation\nmatters.</p>\n<h2 id=\"consent-and-other-people\">Consent and other people</h2>\n<p>Recording other people has legal requirements that vary by jurisdiction, and\nthey are not a formality. Some places require every participant to consent.</p>\n<p>Separately from legality: a meeting transcript contains other people's\nunguarded words. Keep those out of any vault you might share, and think about\nwhether the meeting needs to be in the knowledge layer at all, or whether the\nthree extracted decisions are enough.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"newsletters-and-email.md\">Newsletters and email</a></p>", "headings": ["Capture", "Transcription", "Voice notes are drafts, not sources", "Meetings", "Consent and other people", "Next"], "words": 432, "text": "The ideas worth capturing rarely arrive at your desk. Voice is the only capture method that works while walking, driving or standing in a queue, and it is the one most vaults never wire up. Capture Any recorder app works, as long as the file ends up somewhere the vault can reach. The friction to eliminate is the transfer: if getting audio from phone to vault takes more than one action, you will stop. Simplest reliable setup: record in the phone's default app, share to a cloud folder, and have a scheduled task transcribe anything new into raw/ . Obsidian's mobile app can record directly into the vault, which removes the transfer entirely if you already sync mobile. Transcription Whisper runs locally and is good enough for a voice note recorded at arm's length. Local matters more here than for other sources, because voice notes carry half-formed thoughts and meeting audio carries other people's words. Expect names and technical terms to come out wrong. Correct them at ingest, not later, while you still remember what you said. Voice notes are drafts, not sources A voice note is you thinking out loud, with false starts and abandoned sentences. Ingesting it verbatim produces an incoherent source page. Treat the transcript as raw input to a single idea: This is a voice note, my own thinking out loud. Extract the actual idea, drop the false starts and repetition, and write it as one short concept page in my words. If there are two unrelated ideas, make two pages. Keep the recording date. Meetings Meetings produce three things worth keeping and a great deal that is not: the decisions, the commitments with owners, and the open questions. This is a meeting transcript. Extract decisions made, commitments with who owns each one, and open questions. Link every person mentioned to their entity page. Skip discussion that did not lead anywhere. Route the commitments into the relevant project's Inputs/ rather than the wiki. A commitment is work, not knowledge, and it goes stale in a week. The two layers ../01-concepts/two-layers.md page covers why that separation matters. Consent and other people Recording other people has legal requirements that vary by jurisdiction, and they are not a formality. Some places require every participant to consent. Separately from legality: a meeting transcript contains other people's unguarded words. Keep those out of any vault you might share, and think about whether the meeting needs to be in the knowledge layer at all, or whether the three extracted decisions are enough. Next Newsletters and email newsletters-and-email.md", "links": [{"to": "01-concepts/two-layers", "label": "two layers"}, {"to": "03-ingestion/newsletters-and-email", "label": "Newsletters and email"}]}, {"id": "03-ingestion/newsletters-and-email", "path": "docs/03-ingestion/newsletters-and-email.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "Newsletters and email", "html": "<p>Newsletters are the easiest source to automate and the easiest to over-ingest.\nAutomate the capture, then be strict about what gets a wiki page, because a feed\nthat files itself will happily fill your vault with a hundred pages a month that\nyou never asked for.</p>\n<h2 id=\"a-dedicated-address\">A dedicated address</h2>\n<p>Make an address that exists only for the vault, and resubscribe your newsletters\nto it. That single move separates the material you want to keep from everything\nelse in your inbox, and it means automation never touches your real mail.</p>\n<p>From there, forward that address into <code>raw/</code> with whatever automation you\nalready use. Any rule that can write a file works.</p>\n<h2 id=\"deduplicate\">Deduplicate</h2>\n<p>Newsletters repeat themselves. The same launch appears in four different digests\nin the same week, each with the same facts and a different opening line.</p>\n<p>Ingested straight, you get four source pages saying one thing and a concept page\nciting all four as if that were corroboration. Cross-references between\nnewsletters are not independent confirmation, and a wiki that treats them as\nsuch will overstate how well established something is.</p>\n<p>Instruct the ingest explicitly:</p>\n<pre><code>These are newsletters. Several will cover the same item. Group them by topic\nfirst, write one source page per actual item citing every newsletter that\nmentioned it, and note where they disagree. Do not treat repetition across\nnewsletters as confirmation.\n</code></pre>\n<h2 id=\"what-deserves-a-page\">What deserves a page</h2>\n<p>Newsletters are mostly links with commentary. The commentary is rarely worth a\nconcept page; the thing being linked sometimes is.</p>\n<p>The useful pattern is to let the agent read the digests and hand you a shortlist:</p>\n<pre><code>Read this week's newsletters in raw/newsletters/. List anything worth reading in\nfull, with one line on why. Ingest nothing yet.\n</code></pre>\n<p>Then clip the two or three primary sources properly and ingest those. The\nnewsletter did its job as a filter, and the vault ends up with the actual source\ninstead of a summary of it.</p>\n<h2 id=\"regular-email\">Regular email</h2>\n<p>Most email should not be in a second brain. Threads about scheduling, receipts,\nback and forth about logistics: none of it is knowledge, all of it is volume.</p>\n<p>Worth ingesting: threads where a real decision was made or something was\nexplained properly. Route those in by forwarding to the capture address, one\nthread at a time, deliberately.</p>\n<p>Never wire your whole inbox into <code>raw/</code> on a schedule. It ingests everything\nabout everyone you correspond with, most of it not yours to keep.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"bulk-backfill.md\">Backfilling years of material</a></p>", "headings": ["A dedicated address", "Deduplicate", "What deserves a page", "Regular email", "Next"], "words": 417, "text": "Newsletters are the easiest source to automate and the easiest to over-ingest. Automate the capture, then be strict about what gets a wiki page, because a feed that files itself will happily fill your vault with a hundred pages a month that you never asked for. A dedicated address Make an address that exists only for the vault, and resubscribe your newsletters to it. That single move separates the material you want to keep from everything else in your inbox, and it means automation never touches your real mail. From there, forward that address into raw/ with whatever automation you already use. Any rule that can write a file works. Deduplicate Newsletters repeat themselves. The same launch appears in four different digests in the same week, each with the same facts and a different opening line. Ingested straight, you get four source pages saying one thing and a concept page citing all four as if that were corroboration. Cross-references between newsletters are not independent confirmation, and a wiki that treats them as such will overstate how well established something is. Instruct the ingest explicitly: These are newsletters. Several will cover the same item. Group them by topic first, write one source page per actual item citing every newsletter that mentioned it, and note where they disagree. Do not treat repetition across newsletters as confirmation. What deserves a page Newsletters are mostly links with commentary. The commentary is rarely worth a concept page; the thing being linked sometimes is. The useful pattern is to let the agent read the digests and hand you a shortlist: Read this week's newsletters in raw/newsletters/. List anything worth reading in full, with one line on why. Ingest nothing yet. Then clip the two or three primary sources properly and ingest those. The newsletter did its job as a filter, and the vault ends up with the actual source instead of a summary of it. Regular email Most email should not be in a second brain. Threads about scheduling, receipts, back and forth about logistics: none of it is knowledge, all of it is volume. Worth ingesting: threads where a real decision was made or something was explained properly. Route those in by forwarding to the capture address, one thread at a time, deliberately. Never wire your whole inbox into raw/ on a schedule. It ingests everything about everyone you correspond with, most of it not yours to keep. Next Backfilling years of material bulk-backfill.md", "links": [{"to": "03-ingestion/bulk-backfill", "label": "Backfilling years of material"}]}, {"id": "03-ingestion/bulk-backfill", "path": "docs/03-ingestion/bulk-backfill.md", "section": "03-ingestion", "section_title": "Ingestion", "title": "Backfilling years of material", "html": "<p>At some point you will want to import everything: the bookmark folder, the\ndownloads directory, three years of chat history, the read-later queue with\neight hundred unread items.</p>\n<p>This is the run that goes wrong. It is expensive, it takes hours, and done in\nthe wrong order it produces a wiki that reads like a pile rather than a\nstructure. It is also the run that makes the vault genuinely useful in one\nsitting, so it is worth doing carefully.</p>\n<h2 id=\"order-matters\">Order matters</h2>\n<p>Process oldest first.</p>\n<p>The reason is that later sources should update pages that earlier sources\ncreated. Run it that way and the wiki records how your understanding developed:\nthe early page on a topic, then the correction, then the current position.</p>\n<p>Run it newest first and every old source arrives as a contradiction to be\nreconciled against a page that already has the final answer. The agent spends\nits work reconciling, the history comes out inverted, and you lose the one thing\nthis structure gives you over a search index.</p>\n<h2 id=\"batch-always\">Batch, always</h2>\n<p>Ten sources per batch. After each batch: update <code>index.md</code>, append to <code>log.md</code>,\ncommit, report.</p>\n<pre><code>/backfill raw/archive/2024\n</code></pre>\n<p>The <code>backfill</code> command in <a href=\"../../commands/README.md\"><code>commands/</code></a> works this\nway and stops between batches for a go-ahead.</p>\n<p>Batching exists for three reasons. Cost stays visible while you can still stop.\nQuality stays checkable, so you catch a bad page contract on page ten rather\nthan page four hundred. And a crash costs you one batch instead of the run.</p>\n<h2 id=\"check-the-first-batch-properly\">Check the first batch properly</h2>\n<p>Read every page the first batch produced. All of them.</p>\n<p>This is the moment to catch systematic problems: pages that are summaries rather\nthan explanations, concepts that are too granular, links that are decorative,\nfrontmatter that is wrong. Fix <code>CLAUDE.md</code> and re-run the batch before\ncontinuing.</p>\n<p>A flaw you let through in batch one is a flaw in four hundred pages by the end,\nand fixing it afterwards costs more than the original run.</p>\n<h2 id=\"cost-control\">Cost control</h2>\n<p>Backfilling a thousand sources is a real bill. Ways to keep it sane:</p>\n<ul>\n<li><strong>Filter first.</strong> Most archives are half dead links and things you saved and\n  never opened. Have the agent triage titles before ingesting anything.</li>\n<li><strong>Cap the batch size</strong> and watch what the first few cost before scaling.</li>\n<li><strong>Skip the archive tier.</strong> Not everything needs a wiki page; leaving material\n  in <code>raw/</code> still leaves it searchable.</li>\n</ul>\n<h2 id=\"dead-links\">Dead links</h2>\n<p>Old bookmark exports are full of pages that no longer exist. Check before\ningesting rather than discovering it halfway:</p>\n<pre><code class=\"language-bash\">python3 -c &quot;import sys,urllib.request as u;[print(l.strip()) for l in sys.stdin]&quot;\n</code></pre>\n<p>For anything valuable that is gone, the Internet Archive usually has a copy.\nClip from there and note in the frontmatter that the original is dead, because a\nsource page whose URL 404s is unverifiable a year later.</p>\n<h2 id=\"resuming\">Resuming</h2>\n<p>Record progress in <code>log.md</code> as you go, one line per batch with the folder and\nrange covered. When the run stops halfway, and it will, you resume from the log\ninstead of guessing which files were done.</p>\n<h2 id=\"after-the-backfill\">After the backfill</h2>\n<p>Run a full lint. A large import always leaves orphans, near-duplicates and\nbroken links.</p>\n<pre><code>/lint\n</code></pre>\n<p>Then run a review to see what the vault now contains, because after a backfill\nit knows things you have forgotten you saved. That moment is the payoff for the\nwhole exercise.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../04-structuring/README.md\">Structuring</a>, for the rules that decide what all\nthese pages actually look like.</p>", "headings": ["Order matters", "Batch, always", "Check the first batch properly", "Cost control", "Dead links", "Resuming", "After the backfill", "Next"], "words": 583, "text": "At some point you will want to import everything: the bookmark folder, the downloads directory, three years of chat history, the read-later queue with eight hundred unread items. This is the run that goes wrong. It is expensive, it takes hours, and done in the wrong order it produces a wiki that reads like a pile rather than a structure. It is also the run that makes the vault genuinely useful in one sitting, so it is worth doing carefully. Order matters Process oldest first. The reason is that later sources should update pages that earlier sources created. Run it that way and the wiki records how your understanding developed: the early page on a topic, then the correction, then the current position. Run it newest first and every old source arrives as a contradiction to be reconciled against a page that already has the final answer. The agent spends its work reconciling, the history comes out inverted, and you lose the one thing this structure gives you over a search index. Batch, always Ten sources per batch. After each batch: update index.md , append to log.md , commit, report. /backfill raw/archive/2024 The backfill command in commands/ ../../commands/README.md works this way and stops between batches for a go-ahead. Batching exists for three reasons. Cost stays visible while you can still stop. Quality stays checkable, so you catch a bad page contract on page ten rather than page four hundred. And a crash costs you one batch instead of the run. Check the first batch properly Read every page the first batch produced. All of them. This is the moment to catch systematic problems: pages that are summaries rather than explanations, concepts that are too granular, links that are decorative, frontmatter that is wrong. Fix CLAUDE.md and re-run the batch before continuing. A flaw you let through in batch one is a flaw in four hundred pages by the end, and fixing it afterwards costs more than the original run. Cost control Backfilling a thousand sources is a real bill. Ways to keep it sane: - Filter first. Most archives are half dead links and things you saved and never opened. Have the agent triage titles before ingesting anything. - Cap the batch size and watch what the first few cost before scaling. - Skip the archive tier. Not everything needs a wiki page; leaving material in raw/ still leaves it searchable. Dead links Old bookmark exports are full of pages that no longer exist. Check before ingesting rather than discovering it halfway: bash python3 -c \"import sys,urllib.request as u; print l.strip for l in sys.stdin \" For anything valuable that is gone, the Internet Archive usually has a copy. Clip from there and note in the frontmatter that the original is dead, because a source page whose URL 404s is unverifiable a year later. Resuming Record progress in log.md as you go, one line per batch with the folder and range covered. When the run stops halfway, and it will, you resume from the log instead of guessing which files were done. After the backfill Run a full lint. A large import always leaves orphans, near-duplicates and broken links. /lint Then run a review to see what the vault now contains, because after a backfill it knows things you have forgotten you saved. That moment is the payoff for the whole exercise. Next Structuring ../04-structuring/README.md , for the rules that decide what all these pages actually look like.", "links": []}, {"id": "04-structuring/atomic-pages", "path": "docs/04-structuring/atomic-pages.md", "section": "04-structuring", "section_title": "Structuring", "title": "One page, one idea", "html": "<p>A page holds one idea, explained well enough that someone who has never seen the\nsource understands it.</p>\n<p>The rule exists because of how retrieval works. When the agent answers a\nquestion, it pulls in whole pages. A page covering four topics drags three\nirrelevant ones into context every time it is touched. A page covering one gets\nlinked precisely, retrieved precisely, and updated without collateral damage.</p>\n<h2 id=\"what-atomic-means-here\">What atomic means here</h2>\n<p>Not short. A concept page can run several hundred words. Atomic means it has one\nsubject and you could give it an accurate title without using \"and\".</p>\n<p>If the title needs \"and\", or the page has section headings for unrelated\nsubjects, it is two pages.</p>\n<h2 id=\"splitting-a-source\">Splitting a source</h2>\n<p>One article usually yields one to three concepts worth their own page, plus the\nsource page recording what the article itself said.</p>\n<p>The test for whether something deserves a page: can it be explained without\nreferring back to this one source? An idea that only makes sense as \"what this\narticle argued\" belongs inside the source page. An idea that will recur across\nother sources needs its own page, because that is where the other sources will\nattach.</p>\n<h2 id=\"the-failure-in-both-directions\">The failure in both directions</h2>\n<p><strong>Over-splitting</strong> produces ten pages from one article, each a restated\nparagraph, each linking only back to the source. The graph looks dense and says\nnothing. This is the more common failure with agents, because splitting feels\nlike thoroughness.</p>\n<p><strong>Under-splitting</strong> produces source pages that are article summaries and a wiki\nwith no concepts at all. You end up with a searchable archive, which you already\nhad.</p>\n<p>If you are unsure, write fewer pages. Merging later is cheap; untangling a\nhundred fragments is not.</p>\n<h2 id=\"length\">Length</h2>\n<p>A concept page under about eighty words is usually a stub that failed, not a\npage that was efficient. Either the source did not really cover it, or the agent\ngave up. Both are worth catching in a lint pass.</p>\n<p>A page over roughly a thousand words is usually two ideas that grew together.\nRead it and look for the seam.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"page-types.md\">The four page types</a></p>", "headings": ["What atomic means here", "Splitting a source", "The failure in both directions", "Length", "Next"], "words": 356, "text": "A page holds one idea, explained well enough that someone who has never seen the source understands it. The rule exists because of how retrieval works. When the agent answers a question, it pulls in whole pages. A page covering four topics drags three irrelevant ones into context every time it is touched. A page covering one gets linked precisely, retrieved precisely, and updated without collateral damage. What atomic means here Not short. A concept page can run several hundred words. Atomic means it has one subject and you could give it an accurate title without using \"and\". If the title needs \"and\", or the page has section headings for unrelated subjects, it is two pages. Splitting a source One article usually yields one to three concepts worth their own page, plus the source page recording what the article itself said. The test for whether something deserves a page: can it be explained without referring back to this one source? An idea that only makes sense as \"what this article argued\" belongs inside the source page. An idea that will recur across other sources needs its own page, because that is where the other sources will attach. The failure in both directions Over-splitting produces ten pages from one article, each a restated paragraph, each linking only back to the source. The graph looks dense and says nothing. This is the more common failure with agents, because splitting feels like thoroughness. Under-splitting produces source pages that are article summaries and a wiki with no concepts at all. You end up with a searchable archive, which you already had. If you are unsure, write fewer pages. Merging later is cheap; untangling a hundred fragments is not. Length A concept page under about eighty words is usually a stub that failed, not a page that was efficient. Either the source did not really cover it, or the agent gave up. Both are worth catching in a lint pass. A page over roughly a thousand words is usually two ideas that grew together. Read it and look for the seam. Next The four page types page-types.md", "links": [{"to": "04-structuring/page-types", "label": "The four page types"}]}, {"id": "04-structuring/page-types", "path": "docs/04-structuring/page-types.md", "section": "04-structuring", "section_title": "Structuring", "title": "The four page types", "html": "<p>Four types, each with a job. Every page declares its type in frontmatter, which\nis what lets you query the vault by shape rather than reading everything.</p>\n<h2 id=\"sources\">Sources</h2>\n<p>One page per ingested item. What this article, video, paper or conversation\nsaid.</p>\n<p>Records claims as claims: this source says X, with the URL, author and date\nattached. It does not evaluate. It does not merge in what other sources think.</p>\n<p>Source pages are the audit trail. When a concept page says something surprising,\nthe source pages behind it are how you check whether it was ever true.</p>\n<h2 id=\"entities\">Entities</h2>\n<p>People, organisations, products, tools. What it is, why it appears in your\nvault, and everything that mentions it.</p>\n<p>Entity pages are cheap to create and pay off in a way that is not obvious until\nthe vault is large. They become the natural join points: three unrelated sources\nthat all mention the same company suddenly connect through it, and that\nconnection is often the thing worth noticing.</p>\n<p>Do not write biographies. An entity page holds what is relevant to your vault,\nnot what Wikipedia holds.</p>\n<h2 id=\"concepts\">Concepts</h2>\n<p>Ideas, methods, frameworks, arguments. These are the pages that compound.</p>\n<p>A concept page explains the idea in plain language, says where it came from,\nwhat supports it, what argues against it, and what is still unclear. Written\nwell, it is readable by someone who has seen none of your sources, including\nyou in a year.</p>\n<p>This is the only page type where the agent should be synthesising across\nsources rather than recording.</p>\n<h2 id=\"synthesis\">Synthesis</h2>\n<p>Comparisons, themes, open questions. A synthesis page exists only when it says\nsomething no single source did: two sources disagree, three describe the same\npattern, a question keeps recurring across unrelated material.</p>\n<p>The rule that keeps these honest: do not write a synthesis page to have one. An\nagent asked for synthesis will always produce something, and manufactured themes\nare the fastest way to fill a wiki with confident nonsense.</p>\n<h2 id=\"where-the-types-blur\">Where the types blur</h2>\n<p>Some things are legitimately two types. A methodology named after its author is\nboth an entity and a concept. Pick one, usually the concept, and give the other\nan alias pointing at it.</p>\n<p>Some things are neither. A recipe, a config snippet, a checklist. Those are\nreference material, not knowledge, and they belong in a project folder rather\nthan the wiki.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"linking-rules.md\">Linking rules</a></p>", "headings": ["Sources", "Entities", "Concepts", "Synthesis", "Where the types blur", "Next"], "words": 400, "text": "Four types, each with a job. Every page declares its type in frontmatter, which is what lets you query the vault by shape rather than reading everything. Sources One page per ingested item. What this article, video, paper or conversation said. Records claims as claims: this source says X, with the URL, author and date attached. It does not evaluate. It does not merge in what other sources think. Source pages are the audit trail. When a concept page says something surprising, the source pages behind it are how you check whether it was ever true. Entities People, organisations, products, tools. What it is, why it appears in your vault, and everything that mentions it. Entity pages are cheap to create and pay off in a way that is not obvious until the vault is large. They become the natural join points: three unrelated sources that all mention the same company suddenly connect through it, and that connection is often the thing worth noticing. Do not write biographies. An entity page holds what is relevant to your vault, not what Wikipedia holds. Concepts Ideas, methods, frameworks, arguments. These are the pages that compound. A concept page explains the idea in plain language, says where it came from, what supports it, what argues against it, and what is still unclear. Written well, it is readable by someone who has seen none of your sources, including you in a year. This is the only page type where the agent should be synthesising across sources rather than recording. Synthesis Comparisons, themes, open questions. A synthesis page exists only when it says something no single source did: two sources disagree, three describe the same pattern, a question keeps recurring across unrelated material. The rule that keeps these honest: do not write a synthesis page to have one. An agent asked for synthesis will always produce something, and manufactured themes are the fastest way to fill a wiki with confident nonsense. Where the types blur Some things are legitimately two types. A methodology named after its author is both an entity and a concept. Pick one, usually the concept, and give the other an alias pointing at it. Some things are neither. A recipe, a config snippet, a checklist. Those are reference material, not knowledge, and they belong in a project folder rather than the wiki. Next Linking rules linking-rules.md", "links": [{"to": "04-structuring/linking-rules", "label": "Linking rules"}]}, {"id": "04-structuring/linking-rules", "path": "docs/04-structuring/linking-rules.md", "section": "04-structuring", "section_title": "Structuring", "title": "Linking rules", "html": "<p>Links are the entire value of the structure. Without them you have a folder of\nfiles with good filenames, which is a search index, and search indexes already\nexist.</p>\n<h2 id=\"the-rule\">The rule</h2>\n<p>Link the first mention of any concept or entity, on every page.</p>\n<p>That is it. Applied consistently, it produces the graph on its own, with no\nseparate linking pass and no maintenance ritual.</p>\n<h2 id=\"link-do-not-restate\">Link, do not restate</h2>\n<p>If you are explaining something that already has a page, link it and move on.</p>\n<p>This is what keeps knowledge in one place. When the explanation of a concept\nlives on four pages in four slightly different versions, updating it means\nfinding all four, and you will not. Linked, it lives once and improves once.</p>\n<h2 id=\"both-directions\">Both directions</h2>\n<p>A new page links out to what it references. What it references links back.</p>\n<p>One-directional linking produces pages that reference the vault but that the\nvault never reaches. They exist, they are correct, and nothing finds them.\nObsidian shows unlinked backlinks, which helps you spot these, but the agent\nshould be closing the loop at ingest rather than leaving it to you.</p>\n<h2 id=\"links-that-do-not-exist-yet\">Links that do not exist yet</h2>\n<p>Write the link anyway, then either create the target page in the same run or\nrecord it under Gaps in <code>index.md</code>.</p>\n<p>Gaps are useful information. A page that three sources have linked to and that\ndoes not exist yet is exact
