 different job from reading one source closely. Its one rule: a link it adds must be one you would agree with on reading both pages side by side. A linker optimising for link count degrades the graph while appearing productive. Reviewer Read-only. Produces the periodic review: what changed, where attention went, what contradicts what, what to read next. Read-only is not caution, it is what makes the review trustworthy. A reviewer that can edit will fix small things as it goes, and then its report describes a vault that no longer exists. Researcher Read-only. Answers questions from the vault, cites pages, names what is missing. Also the role you talk to most, and the one that most needs the rule about not falling back on general knowledge. See the query skill ../../skills/README.md . Graph analyst Read-only. Runs the metrics, finds hubs, bridges and clusters, and says what the numbers mean for retrieval. Monthly. Separate from the linter because analysis and repair want opposite dispositions: one should notice everything, the other should touch as little as possible. Curator Read-only. Proposes what to prune, archive or merge, quarterly. Proposals only, never actions. Deletion is the one operation you cannot recover from by reading a diff, so it stays a decision the owner makes. Roles not worth creating A deleter. Deletion should be a decision you make, executed with a record. The curator proposes; you dispose. A summariser. Summaries of pages that are already summaries produce a layer that is less true than what is under it and gets read instead of it. A tagger. Tagging is a five-second judgement made during ingest with full context. A separate pass has less context and produces worse tags. Handoffs Roles communicate through the vault, not through each other. The ingestor writes gaps into index.md ; the linker reads them. The ingestor logs its run; the reviewer reads the log. That is deliberate. Files as the interface means any run is inspectable afterwards, and a role can be replaced without touching the others. Next Scheduling scheduled-maintenance.md", "links": [{"to": "06-agents/scheduled-maintenance", "label": "Scheduling"}]}, {"id": "06-agents/scheduled-maintenance", "path": "docs/06-agents/scheduled-maintenance.md", "section": "06-agents", "section_title": "Agents", "title": "Scheduling", "html": "<p>Scheduled runs are what make the vault feel alive. You wake up and it has filed\nwhat you clipped, noticed a contradiction, and left you three lines about what\nchanged.</p>\n<p>They are also unattended writes to your notes, so the order matters: get the\n<a href=\"safety-and-guardrails.md\">guardrails</a> right first, then schedule.</p>\n<h2 id=\"cadence-per-job\">Cadence per job</h2>\n<p><strong>Ingest, daily.</strong> Overnight, on whatever accumulated in <code>raw/</code> during the day.\nDaily is right because a batch gives the agent a chance to notice that three\nthings you saved are about the same idea. Hourly does not.</p>\n<p><strong>Link, weekly.</strong> Connections need material to connect. Run it after a week of\ningestion.</p>\n<p><strong>Lint, weekly.</strong> After the linker, so it catches what that pass broke.</p>\n<p><strong>Review, weekly.</strong> The one output you actually read. Put it on the morning you\nplan.</p>\n<p><strong>Metrics, monthly.</strong> Four numbers appended to a note. See\n<a href=\"../05-graphs/metrics.md\">metrics</a>.</p>\n<h2 id=\"setting-one-up\">Setting one up</h2>\n<p>In Claude Desktop, the Schedule tab, then a new task:</p>\n<pre><code>Frequency:  Daily, 7:00am\nFolder:     your vault\nPrompt:     File anything new in raw/ into the wiki following CLAUDE.md.\n            Link it to existing pages. Update index.md and log.md. Commit\n            with a message naming the run. Then write me three lines on\n            what changed.\n</code></pre>\n<p>Or ask for it in a session: \"set up a daily task at 7am that ingests raw/ and\nsummarises what changed\".</p>\n<p>From a terminal, <code>cron</code> or Task Scheduler calling Claude Code headless works the\nsame way, and is the better option if you want the run inside a git commit\nautomatically.</p>\n<h2 id=\"what-a-run-must-produce\">What a run must produce</h2>\n<p>Three things, every time.</p>\n<p><strong>A log entry.</strong> Otherwise you cannot audit what happened while you were asleep.</p>\n<p><strong>A commit.</strong> One per run, with the run named in the message. This is what makes\na bad run revertible in one command instead of an evening.</p>\n<p><strong>A report to you.</strong> Even one line. A scheduled task that produces nothing\nvisible is one you stop trusting and then stop reading.</p>\n<h2 id=\"detecting-silent-failure\">Detecting silent failure</h2>\n<p>The failure mode is not a crash. It is a run that completes and does nothing\nuseful: the source was empty, the API call failed halfway, the instructions\nmatched no files.</p>\n<p>Two cheap checks. Have the run report counts, not just completion, so \"ingested\n0 sources\" is visible. And look at commit frequency once a month: a week with no\ncommits from the daily task means it has been failing quietly since Tuesday.</p>\n<h2 id=\"start-manual\">Start manual</h2>\n<p>Run each job by hand for a week before scheduling it. You are checking that the\noutput is good enough to accept without reading it closely, because that is\nexactly what scheduling means.</p>\n<p>Schedule the ingest last. It is the one that writes most.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"subagents.md\">Subagents and parallel work</a></p>", "headings": ["Cadence per job", "Setting one up", "What a run must produce", "Detecting silent failure", "Start manual", "Next"], "words": 452, "text": "Scheduled runs are what make the vault feel alive. You wake up and it has filed what you clipped, noticed a contradiction, and left you three lines about what changed. They are also unattended writes to your notes, so the order matters: get the guardrails safety-and-guardrails.md right first, then schedule. Cadence per job Ingest, daily. Overnight, on whatever accumulated in raw/ during the day. Daily is right because a batch gives the agent a chance to notice that three things you saved are about the same idea. Hourly does not. Link, weekly. Connections need material to connect. Run it after a week of ingestion. Lint, weekly. After the linker, so it catches what that pass broke. Review, weekly. The one output you actually read. Put it on the morning you plan. Metrics, monthly. Four numbers appended to a note. See metrics ../05-graphs/metrics.md . Setting one up In Claude Desktop, the Schedule tab, then a new task: Frequency: Daily, 7:00am Folder: your vault Prompt: File anything new in raw/ into the wiki following CLAUDE.md. Link it to existing pages. Update index.md and log.md. Commit with a message naming the run. Then write me three lines on what changed. Or ask for it in a session: \"set up a daily task at 7am that ingests raw/ and summarises what changed\". From a terminal, cron or Task Scheduler calling Claude Code headless works the same way, and is the better option if you want the run inside a git commit automatically. What a run must produce Three things, every time. A log entry. Otherwise you cannot audit what happened while you were asleep. A commit. One per run, with the run named in the message. This is what makes a bad run revertible in one command instead of an evening. A report to you. Even one line. A scheduled task that produces nothing visible is one you stop trusting and then stop reading. Detecting silent failure The failure mode is not a crash. It is a run that completes and does nothing useful: the source was empty, the API call failed halfway, the instructions matched no files. Two cheap checks. Have the run report counts, not just completion, so \"ingested 0 sources\" is visible. And look at commit frequency once a month: a week with no commits from the daily task means it has been failing quietly since Tuesday. Start manual Run each job by hand for a week before scheduling it. You are checking that the output is good enough to accept without reading it closely, because that is exactly what scheduling means. Schedule the ingest last. It is the one that writes most. Next Subagents and parallel work subagents.md", "links": [{"to": "06-agents/safety-and-guardrails", "label": "guardrails"}, {"to": "05-graphs/metrics", "label": "metrics"}, {"to": "06-agents/subagents", "label": "Subagents and parallel work"}]}, {"id": "06-agents/subagents", "path": "docs/06-agents/subagents.md", "section": "06-agents", "section_title": "Agents", "title": "Subagents and parallel work", "html": "<p>Subagents run with their own context. That is the whole point: a subagent\nreading thirty pages to answer a question does not fill the main session's\ncontext with those thirty pages, only with the answer.</p>\n<h2 id=\"when-to-fan-out\">When to fan out</h2>\n<p><strong>Research across many pages.</strong> Send a subagent to read a cluster and come back\nwith a summary. The main session keeps its budget for the actual work.</p>\n<p><strong>Independent sources.</strong> Ingesting ten unrelated articles parallelises cleanly,\nbecause none of them touch the same wiki pages.</p>\n<p><strong>Verification.</strong> One agent writes, another checks the pages against the sources.\nSeparate context is what makes the check meaningful; the same agent rereading its\nown work mostly agrees with itself.</p>\n<h2 id=\"when-not-to\">When not to</h2>\n<p><strong>Related sources.</strong> Three articles about the same topic must be ingested\nsequentially. In parallel, each one creates the concept page independently and\nyou get three versions of it, or two of them are overwritten.</p>\n<p><strong>Anything touching the index.</strong> <code>index.md</code> and <code>log.md</code> are single files that\nevery run wants to append to. Parallel writes to them conflict or silently lose\nentries.</p>\n<p><strong>Small jobs.</strong> Spawning a subagent costs a full context setup. For two files it\nis slower than doing it directly.</p>\n<h2 id=\"merging-parallel-work\">Merging parallel work</h2>\n<p>The rule that avoids most conflicts: subagents write to disjoint paths, the\nparent merges.</p>\n<p>Have each subagent report what it would write rather than writing shared files\ndirectly. The parent applies the index and log updates in one pass, after all\nsubagents return. Page files themselves are safe to write in parallel as long as\ntwo subagents were never given overlapping material.</p>\n<p>Commit before any parallel run. When it goes wrong, it goes wrong across many\nfiles at once.</p>\n<h2 id=\"cost\">Cost</h2>\n<p>Parallelism does not reduce total token use, it reduces wall-clock time and\nprotects the main context. Four subagents cost roughly four times one.</p>\n<p>That trade is worth it for a large backfill and pointless for a daily ingest of\nfive clipped articles.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"hooks.md\">Hooks</a></p>", "headings": ["When to fan out", "When not to", "Merging parallel work", "Cost", "Next"], "words": 328, "text": "Subagents run with their own context. That is the whole point: a subagent reading thirty pages to answer a question does not fill the main session's context with those thirty pages, only with the answer. When to fan out Research across many pages. Send a subagent to read a cluster and come back with a summary. The main session keeps its budget for the actual work. Independent sources. Ingesting ten unrelated articles parallelises cleanly, because none of them touch the same wiki pages. Verification. One agent writes, another checks the pages against the sources. Separate context is what makes the check meaningful; the same agent rereading its own work mostly agrees with itself. When not to Related sources. Three articles about the same topic must be ingested sequentially. In parallel, each one creates the concept page independently and you get three versions of it, or two of them are overwritten. Anything touching the index. index.md and log.md are single files that every run wants to append to. Parallel writes to them conflict or silently lose entries. Small jobs. Spawning a subagent costs a full context setup. For two files it is slower than doing it directly. Merging parallel work The rule that avoids most conflicts: subagents write to disjoint paths, the parent merges. Have each subagent report what it would write rather than writing shared files directly. The parent applies the index and log updates in one pass, after all subagents return. Page files themselves are safe to write in parallel as long as two subagents were never given overlapping material. Commit before any parallel run. When it goes wrong, it goes wrong across many files at once. Cost Parallelism does not reduce total token use, it reduces wall-clock time and protects the main context. Four subagents cost roughly four times one. That trade is worth it for a large backfill and pointless for a daily ingest of five clipped articles. Next Hooks hooks.md", "links": [{"to": "06-agents/hooks", "label": "Hooks"}]}, {"id": "06-agents/hooks", "path": "docs/06-agents/hooks.md", "section": "06-agents", "section_title": "Agents", "title": "Hooks", "html": "<p>Hooks fire on events rather than on a schedule. They are the right tool for\nthings that must happen every time, which is exactly the set of things a prompt\ninstruction will eventually miss.</p>\n<h2 id=\"worth-hooking\">Worth hooking</h2>\n<p><strong>Validation before a write.</strong> Check frontmatter parses and required fields are\npresent. A malformed page caught at write time is a non-event; caught a month\nlater it is a page that has been invisible to every query since.</p>\n<p><strong>Lint after a run.</strong> Broken links appear at the moment they are created, which\nis the moment there is enough context to fix them properly.</p>\n<p><strong>Commit after a scheduled run.</strong> Removes the possibility of a run that changed\nforty files and left no commit.</p>\n<p><strong>Notify on deletion.</strong> Any delete, any time, surfaces. Deletions are rare enough\nthat a notification costs nothing and matters when it fires.</p>\n<h2 id=\"not-worth-hooking\">Not worth hooking</h2>\n<p>Anything slow. A hook that runs on every file write and takes two seconds turns a\nforty-page ingest into a ninety-second pause, and you will disable it.</p>\n<p>Anything that needs judgement. Hooks are mechanical checks. A hook trying to\ndecide whether a page is good enough will be wrong in both directions.</p>\n<h2 id=\"keep-them-fast-and-quiet\">Keep them fast and quiet</h2>\n<p>A hook should complete in well under a second and print nothing when it passes.\nHooks that log on success train you to ignore hook output, which is the same as\nhaving no hooks the day one fails.</p>\n<h2 id=\"failure-behaviour\">Failure behaviour</h2>\n<p>Decide explicitly whether a failing hook blocks the operation.</p>\n<p>Validation hooks should block: a page that fails schema validation should not be\nwritten. Notification hooks should not: a failed notification is not a reason to\nlose the work.</p>\n<p>The bad case is a blocking hook that fails for an unrelated reason and silently\nstops your scheduled ingest for a week. Whatever blocks must be simple enough\nthat it only fails for the reason it exists.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"skills-and-commands.md\">Skills and slash commands</a></p>", "headings": ["Worth hooking", "Not worth hooking", "Keep them fast and quiet", "Failure behaviour", "Next"], "words": 325, "text": "Hooks fire on events rather than on a schedule. They are the right tool for things that must happen every time, which is exactly the set of things a prompt instruction will eventually miss. Worth hooking Validation before a write. Check frontmatter parses and required fields are present. A malformed page caught at write time is a non-event; caught a month later it is a page that has been invisible to every query since. Lint after a run. Broken links appear at the moment they are created, which is the moment there is enough context to fix them properly. Commit after a scheduled run. Removes the possibility of a run that changed forty files and left no commit. Notify on deletion. Any delete, any time, surfaces. Deletions are rare enough that a notification costs nothing and matters when it fires. Not worth hooking Anything slow. A hook that runs on every file write and takes two seconds turns a forty-page ingest into a ninety-second pause, and you will disable it. Anything that needs judgement. Hooks are mechanical checks. A hook trying to decide whether a page is good enough will be wrong in both directions. Keep them fast and quiet A hook should complete in well under a second and print nothing when it passes. Hooks that log on success train you to ignore hook output, which is the same as having no hooks the day one fails. Failure behaviour Decide explicitly whether a failing hook blocks the operation. Validation hooks should block: a page that fails schema validation should not be written. Notification hooks should not: a failed notification is not a reason to lose the work. The bad case is a blocking hook that fails for an unrelated reason and silently stops your scheduled ingest for a week. Whatever blocks must be simple enough that it only fails for the reason it exists. Next Skills and slash commands skills-and-commands.md", "links": [{"to": "06-agents/skills-and-commands", "label": "Skills and slash commands"}]}, {"id": "06-agents/skills-and-commands", "path": "docs/06-agents/skills-and-commands.md", "section": "06-agents", "section_title": "Agents", "title": "Skills and slash commands", "html": "<p>Two mechanisms that look similar and do different jobs.</p>\n<p><strong>A skill</strong> teaches repeatable behaviour. It loads when relevant and shapes how\nthe agent does something, whether you invoked it explicitly or just described the\ntask.</p>\n<p><strong>A command</strong> is a shortcut for a task you run often. It points at a skill and\nsaves you typing the instructions.</p>\n<p>The behaviour belongs in the skill. That way ingestion works the same whether it\nwas triggered by <code>/ingest</code>, by a scheduled task, or by you saying \"add this to my\nvault\".</p>\n<h2 id=\"what-this-repo-ships\">What this repo ships</h2>\n<p>Eighteen skills in <a href=\"../../skills/README.md\"><code>skills/</code></a>, one per workflow in this\nguide. Seventy-two commands in <a href=\"../../commands/README.md\"><code>commands/</code></a>, each a\nfew lines pointing at a skill and setting its scope.</p>\n<p>The ratio is deliberate. Behaviour belongs in a small number of well-written\nskills; commands are cheap, so there is no reason to make you remember how to\nphrase a request you make every week.</p>\n<p>Install them inside the vault at <code>.claude/skills/</code> and <code>.claude/commands/</code> so\nthey are versioned alongside your notes and travel with the vault.</p>\n<h2 id=\"writing-your-own\">Writing your own</h2>\n<p>A skill worth writing has three properties: you do it repeatedly, you have\nopinions about how, and the opinions are not obvious enough for the model to\nguess.</p>\n<p>Structure that works:</p>\n<pre><code class=\"language-markdown\">---\nname: skill-name\ndescription: &gt;-\n  What it does. When to use it, written pushy, because agents under-trigger\n  skills. Do NOT use for the tempting near-misses.\n---\n\n# Name\n\n[Why this skill exists: what failure it prevents. This paragraph is the rubric\nfor every case the rules below do not cover.]\n\n## Core rule\n## Workflow\n## Output format\n## Calibration\n## Example\n</code></pre>\n<p>The opening paragraph does more work than the rules. Rules cover the cases you\nthought of; the reason covers the rest.</p>\n<h2 id=\"explain-the-why\">Explain the why</h2>\n<p>\"Never overwrite a contradiction\" gets applied literally and fails on the edge\ncases. \"Never overwrite a contradiction, because the history of what you believed\nis the thing this vault has that a search engine does not\" generalises to\nsituations you never described.</p>\n<p>All-caps NEVER without a reason is usually a missing explanation.</p>\n<h2 id=\"versioning\">Versioning</h2>\n<p>Skills live in the vault, so git tracks them. When output quality changes, the\nskill diff is the first place to look.</p>\n<p>Test a skill on three or four real cases before letting a scheduled task use it.\nA flaw in a skill that runs nightly is a flaw in three hundred pages by the end\nof the year.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"safety-and-guardrails.md\">Guardrails</a></p>", "headings": ["What this repo ships", "Writing your own", "Core rule", "Workflow", "Output format", "Calibration", "Example", "Explain the why", "Versioning", "Next"], "words": 414, "text": "Two mechanisms that look similar and do different jobs. A skill teaches repeatable behaviour. It loads when relevant and shapes how the agent does something, whether you invoked it explicitly or just described the task. A command is a shortcut for a task you run often. It points at a skill and saves you typing the instructions. The behaviour belongs in the skill. That way ingestion works the same whether it was triggered by /ingest , by a scheduled task, or by you saying \"add this to my vault\". What this repo ships Eighteen skills in skills/ ../../skills/README.md , one per workflow in this guide. Seventy-two commands in commands/ ../../commands/README.md , each a few lines pointing at a skill and setting its scope. The ratio is deliberate. Behaviour belongs in a small number of well-written skills; commands are cheap, so there is no reason to make you remember how to phrase a request you make every week. Install them inside the vault at .claude/skills/ and .claude/commands/ so they are versioned alongside your notes and travel with the vault. Writing your own A skill worth writing has three properties: you do it repeatedly, you have opinions about how, and the opinions are not obvious enough for the model to guess. Structure that works: markdown --- name: skill-name description: - What it does. When to use it, written pushy, because agents under-trigger skills. Do NOT use for the tempting near-misses. --- Name Why this skill exists: what failure it prevents. This paragraph is the rubric for every case the rules below do not cover. Core rule Workflow Output format Calibration Example The opening paragraph does more work than the rules. Rules cover the cases you thought of; the reason covers the rest. Explain the why \"Never overwrite a contradiction\" gets applied literally and fails on the edge cases. \"Never overwrite a contradiction, because the history of what you believed is the thing this vault has that a search engine does not\" generalises to situations you never described. All-caps NEVER without a reason is usually a missing explanation. Versioning Skills live in the vault, so git tracks them. When output quality changes, the skill diff is the first place to look. Test a skill on three or four real cases before letting a scheduled task use it. A flaw in a skill that runs nightly is a flaw in three hundred pages by the end of the year. Next Guardrails safety-and-guardrails.md", "links": [{"to": "06-agents/safety-and-guardrails", "label": "Guardrails"}]}, {"id": "06-agents/safety-and-guardrails", "path": "docs/06-agents/safety-and-guardrails.md", "section": "06-agents", "section_title": "Agents", "title": "Guardrails", "html": "<p>The rule this whole section rests on:</p>\n<p><strong>Keys, not prompts.</strong></p>\n<p>Telling an agent not to do something is a preference. It is not a boundary. If\nthe agent technically can delete a file, empty a folder or send an email, then\none day, in a context you did not anticipate, it will.</p>\n<p>Control what is possible at the permission level. Then the instruction in\n<code>CLAUDE.md</code> is a preference sitting on top of a boundary, rather than the only\nthing between your notes and a bad run.</p>\n<h2 id=\"scope-write-access\">Scope write access</h2>\n<p>The agent needs write access to the vault. It does not need write access to your\nhome directory, and a scheduled task running with broad filesystem permissions is\na large blast radius for a small convenience.</p>\n<p>Same principle for connectors: read-only wherever the option exists. A calendar\nconnector that can only read cannot cancel a meeting, no matter what a\nmisinterpreted instruction says.</p>\n<h2 id=\"never-delete-without-a-record\">Never delete without a record</h2>\n<p>Deletion is the one operation you cannot recover from by reading a diff, because\nthe content is gone and only the absence remains.</p>\n<p>Rule: no page is deleted without a line in <code>log.md</code> naming it and why. Merges\ncount as deletions. Applied consistently, a page that vanishes is always\ntraceable, and \"where did that page go\" stops being an unanswerable question.</p>\n<h2 id=\"git-is-the-real-safety-net\">Git is the real safety net</h2>\n<p>Every guardrail above is preventive. Git is what saves you when one fails.</p>\n<p>Commit before any run that writes at scale. Scheduled runs commit their own work.\nThen a bad ingest is <code>git checkout .</code>, and a bad merge is one revert.</p>\n<p>Read the diffs from scheduled runs occasionally, especially in the first weeks.\nThat is how you learn what your agent actually does at 7am, which is reliably\ndifferent from what you assumed.</p>\n<h2 id=\"dry-runs\">Dry runs</h2>\n<p>For anything that touches many files, run it once in report-only mode.</p>\n<pre><code>Do a dry run: list every page you would create, update or delete, and the links\nyou would add. Write nothing.\n</code></pre>\n<p>The output takes a minute to read and catches misread instructions before they\nbecome four hundred edits.</p>\n<h2 id=\"watch-for-scope-creep\">Watch for scope creep</h2>\n<p>Agents extend the job. Asked to ingest, an agent may also tidy an unrelated page,\nfix formatting, rename something for consistency. Each is defensible; together\nthey mean you cannot tell what a run did without reading everything.</p>\n<p>Instruct explicitly: do the job asked, list anything else you noticed, change\nnothing else.</p>\n<h2 id=\"what-not-to-put-in-the-vault\">What not to put in the vault</h2>\n<p>Credentials, API keys, anything you are under obligation to keep confidential,\nother people's private information.</p>\n<p>Not because the agent will leak it, but because the vault is a single file tree\nthat gets synced, committed, backed up and occasionally shared. Every copy is\nanother place that content exists. See\n<a href=\"../09-maintenance/privacy-and-secrets.md\">privacy</a>.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../07-retrieval/README.md\">Retrieval</a>, for getting answers out of what all this\nbuilt.</p>", "headings": ["Scope write access", "Never delete without a record", "Git is the real safety net", "Dry runs", "Watch for scope creep", "What not to put in the vault", "Next"], "words": 482, "text": "The rule this whole section rests on: Keys, not prompts. Telling an agent not to do something is a preference. It is not a boundary. If the agent technically can delete a file, empty a folder or send an email, then one day, in a context you did not anticipate, it will. Control what is possible at the permission level. Then the instruction in CLAUDE.md is a preference sitting on top of a boundary, rather than the only thing between your notes and a bad run. Scope write access The agent needs write access to the vault. It does not need write access to your home directory, and a scheduled task running with broad filesystem permissions is a large blast radius for a small convenience. Same principle for connectors: read-only wherever the option exists. A calendar connector that can only read cannot cancel a meeting, no matter what a misinterpreted instruction says. Never delete without a record Deletion is the one operation you cannot recover from by reading a diff, because the content is gone and only the absence remains. Rule: no page is deleted without a line in log.md naming it and why. Merges count as deletions. Applied consistently, a page that vanishes is always traceable, and \"where did that page go\" stops being an unanswerable question. Git is the real safety net Every guardrail above is preventive. Git is what saves you when one fails. Commit before any run that writes at scale. Scheduled runs commit their own work. Then a bad ingest is git checkout . , and a bad merge is one revert. Read the diffs from scheduled runs occasionally, especially in the first weeks. That is how you learn what your agent actually does at 7am, which is reliably different from what you assumed. Dry runs For anything that touches many files, run it once in report-only mode. Do a dry run: list every page you would create, update or delete, and the links you would add. Write nothing. The output takes a minute to read and catches misread instructions before they become four hundred edits. Watch for scope creep Agents extend the job. Asked to ingest, an agent may also tidy an unrelated page, fix formatting, rename something for consistency. Each is defensible; together they mean you cannot tell what a run did without reading everything. Instruct explicitly: do the job asked, list anything else you noticed, change nothing else. What not to put in the vault Credentials, API keys, anything you are under obligation to keep confidential, other people's private information. Not because the agent will leak it, but because the vault is a single file tree that gets synced, committed, backed up and occasionally shared. Every copy is another place that content exists. See privacy ../09-maintenance/privacy-and-secrets.md . Next Retrieval ../07-retrieval/README.md , for getting answers out of what all this built.", "links": [{"to": "09-maintenance/privacy-and-secrets", "label": "privacy"}]}, {"id": "07-retrieval/asking-questions", "path": "docs/07-retrieval/asking-questions.md", "section": "07-retrieval", "section_title": "Retrieval", "title": "Asking the vault", "html": "<p>You built the vault so answers would come from what you actually read. An agent\nthat quietly falls back on its own knowledge destroys that, and it does so\ninvisibly: the answer is fluent, plausible, and unverifiable.</p>\n<h2 id=\"the-rule\">The rule</h2>\n<p>Every claim in an answer comes from a page, and names the page.</p>\n<pre><code>Answer from my vault only. Cite the page for each claim. If the vault does not\ncover part of the question, say which part rather than filling it in.\n</code></pre>\n<p>That instruction belongs in <code>CLAUDE.md</code>, not typed each time. A rule you have to\nremember is a rule that lapses on the day it matters.</p>\n<h2 id=\"start-from-the-index\">Start from the index</h2>\n<p>The agent should read <code>index.md</code> first, then open the pages that look relevant,\nthen follow links outward from those.</p>\n<p>The alternative, a full-text sweep, is slower, spends context on near-misses, and\nmisses pages whose wording differs from your question. The index exists to make\nthis cheap; see <a href=\"../04-structuring/index-and-log.md\">index.md and log.md</a>.</p>\n<h2 id=\"outside-knowledge-labelled\">Outside knowledge, labelled</h2>\n<p>Sometimes the model knows something useful that the vault does not contain. That\nis fine as long as it is marked:</p>\n<pre><code>Cite vault pages for anything from my notes. Anything you know that my vault\ndoes not contain, put under a separate heading marked outside the vault.\n</code></pre>\n<p>Separated, it is useful context. Blended, it makes the whole answer unreliable,\nbecause you no longer know which parts you can trace.</p>\n<h2 id=\"empty-is-a-valid-answer\">Empty is a valid answer</h2>\n<p>If the vault has nothing on a topic, the right response is one sentence saying\nso.</p>\n<p>An agent padding an empty result with general knowledge is the failure mode to\nwatch for, because it feels like a good answer. Notice when an answer contains no\npage references at all; that is the signal.</p>\n<h2 id=\"answers-should-end-with-what-is-missing\">Answers should end with what is missing</h2>\n<pre><code>Read: [[page]], [[page]], [[page]]\nNot covered: whether this holds for the streaming case\n</code></pre>\n<p>Two lines, and they do more than they look. They tell you how much of the vault\nthe answer rests on, and the gap line is often the more useful half, because it\nis a precise statement of what to go read next.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"query-patterns.md\">Query patterns</a></p>", "headings": ["The rule", "Start from the index", "Outside knowledge, labelled", "Empty is a valid answer", "Answers should end with what is missing", "Next"], "words": 368, "text": "You built the vault so answers would come from what you actually read. An agent that quietly falls back on its own knowledge destroys that, and it does so invisibly: the answer is fluent, plausible, and unverifiable. The rule Every claim in an answer comes from a page, and names the page. Answer from my vault only. Cite the page for each claim. If the vault does not cover part of the question, say which part rather than filling it in. That instruction belongs in CLAUDE.md , not typed each time. A rule you have to remember is a rule that lapses on the day it matters. Start from the index The agent should read index.md first, then open the pages that look relevant, then follow links outward from those. The alternative, a full-text sweep, is slower, spends context on near-misses, and misses pages whose wording differs from your question. The index exists to make this cheap; see index.md and log.md ../04-structuring/index-and-log.md . Outside knowledge, labelled Sometimes the model knows something useful that the vault does not contain. That is fine as long as it is marked: Cite vault pages for anything from my notes. Anything you know that my vault does not contain, put under a separate heading marked outside the vault. Separated, it is useful context. Blended, it makes the whole answer unreliable, because you no longer know which parts you can trace. Empty is a valid answer If the vault has nothing on a topic, the right response is one sentence saying so. An agent padding an empty result with general knowledge is the failure mode to watch for, because it feels like a good answer. Notice when an answer contains no page references at all; that is the signal. Answers should end with what is missing Read: page , page , page Not covered: whether this holds for the streaming case Two lines, and they do more than they look. They tell you how much of the vault the answer rests on, and the gap line is often the more useful half, because it is a precise statement of what to go read next. Next Query patterns query-patterns.md", "links": [{"to": "04-structuring/index-and-log", "label": "index.md and log.md"}, {"to": "07-retrieval/query-patterns", "label": "Query patterns"}]}, {"id": "07-retrieval/query-patterns", "path": "docs/07-retrieval/query-patterns.md", "section": "07-retrieval", "section_title": "Retrieval", "title": "Query patterns", "html": "<p>Some questions a vault answers far better than a search engine or a general\nmodel. These are the ones worth building the habit around.</p>\n<h2 id=\"what-do-i-know-about-x\">What do I know about X</h2>\n<p>The basic one, and the reason most people build a vault.</p>\n<pre><code>What do I know about agent harnesses? Read the concept pages and the sources\nbehind them. Say where my sources disagree.\n</code></pre>\n<p>The second sentence is what makes it better than reading a page yourself. A\nconsolidated view across everything you read, with the disagreements surfaced,\nis not something any single page contains.</p>\n<h2 id=\"what-connects-x-and-y\">What connects X and Y</h2>\n<p>The question a search index cannot answer at all.</p>\n<pre><code>What connects retrieval quality and context length in my vault? Show the path\nthrough pages, not just the endpoints.\n</code></pre>\n<p>Asking for the path matters. The intermediate pages are the reasoning, and they\nare checkable in a way a bare conclusion is not.</p>\n<h2 id=\"what-have-i-changed-my-mind-about\">What have I changed my mind about</h2>\n<p>Only possible because of the <a href=\"../04-structuring/contradictions-and-supersession.md\">supersession\nrules</a>.</p>\n<pre><code>Find pages where a later source superseded an earlier claim. What did I believe,\nwhat changed it, and when?\n</code></pre>\n<p>Run this quarterly. It is the closest thing to watching your own thinking from\noutside, and it usually surfaces at least one belief you updated without\nnoticing.</p>\n<h2 id=\"what-is-missing\">What is missing</h2>\n<pre><code>Look at my concept pages on prediction markets. What questions do they raise\nthat no source in my vault answers?\n</code></pre>\n<p>This turns the vault into a reading list generated from your own gaps rather\nthan from what an algorithm thinks you would click.</p>\n<h2 id=\"what-did-i-say-about-this-before\">What did I say about this before</h2>\n<p>Especially useful with <a href=\"../03-ingestion/chat-exports.md\">chat exports</a> ingested.</p>\n<pre><code>Have I worked on this problem before? What did I conclude and what did I get\nwrong?\n</code></pre>\n<h2 id=\"what-contradicts-this\">What contradicts this</h2>\n<pre><code>I am about to argue that X. What in my vault argues against it?\n</code></pre>\n<p>The most valuable query in the set and the least used, because nobody\nvolunteers to be contradicted. A vault that only confirms you is a vault you\nbuilt badly.</p>\n<h2 id=\"questions-to-ask-elsewhere\">Questions to ask elsewhere</h2>\n<p>Anything about the present state of the world. Your vault knows what your\nsources said on the day you saved them, and nothing since.</p>\n<p>Anything general the model already knows. Asking your vault to explain a\nwell-documented concept from scratch gets you a worse version of what a plain\nanswer would give.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"search-tools.md\">Search tools</a></p>", "headings": ["What do I know about X", "What connects X and Y", "What have I changed my mind about", "What is missing", "What did I say about this before", "What contradicts this", "Questions to ask elsewhere", "Next"], "words": 410, "text": "Some questions a vault answers far better than a search engine or a general model. These are the ones worth building the habit around. What do I know about X The basic one, and the reason most people build a vault. What do I know about agent harnesses? Read the concept pages and the sources behind them. Say where my sources disagree. The second sentence is what makes it better than reading a page yourself. A consolidated view across everything you read, with the disagreements surfaced, is not something any single page contains. What connects X and Y The question a search index cannot answer at all. What connects retrieval quality and context length in my vault? Show the path through pages, not just the endpoints. Asking for the path matters. The intermediate pages are the reasoning, and they are checkable in a way a bare conclusion is not. What have I changed my mind about Only possible because of the supersession rules ../04-structuring/contradictions-and-supersession.md . Find pages where a later source superseded an earlier claim. What did I believe, what changed it, and when? Run this quarterly. It is the closest thing to watching your own thinking from outside, and it usually surfaces at least one belief you updated without noticing. What is missing Look at my concept pages on prediction markets. What questions do they raise that no source in my vault answers? This turns the vault into a reading list generated from your own gaps rather than from what an algorithm thinks you would click. What did I say about this before Especially useful with chat exports ../03-ingestion/chat-exports.md ingested. Have I worked on this problem before? What did I conclude and what did I get wrong? What contradicts this I am about to argue that X. What in my vault argues against it? The most valuable query in the set and the least used, because nobody volunteers to be contradicted. A vault that only confirms you is a vault you built badly. Questions to ask elsewhere Anything about the present state of the world. Your vault knows what your sources said on the day you saved them, and nothing since. Anything general the model already knows. Asking your vault to explain a well-documented concept from scratch gets you a worse version of what a plain answer would give. Next Search tools search-tools.md", "links": [{"to": "04-structuring/contradictions-and-supersession", "label": "supersession\nrules"}, {"to": "03-ingestion/chat-exports", "label": "chat exports"}, {"to": "07-retrieval/search-tools", "label": "Search tools"}]}, {"id": "07-retrieval/search-tools", "path": "docs/07-retrieval/search-tools.md", "section": "07-retrieval", "section_title": "Retrieval", "title": "Search tools", "html": "<p>Retrieval in a plain-text vault is mostly grep. That sounds primitive and is\nalmost always enough.</p>\n<h2 id=\"ripgrep\">ripgrep</h2>\n<pre><code class=\"language-bash\">rg -i &quot;graph rag&quot; ~/brain --type md -l\nrg -i &quot;supersed&quot; ~/brain -C 2\n</code></pre>\n<p>Instant on tens of thousands of files. The agent uses it by default when working\non the filesystem, and for \"where did I mention this\" it beats every fancier\noption on both speed and predictability.</p>\n<p>Its limit is exact wording. It cannot find the page about a concept you\ndescribed differently, which is what the graph and the index are for.</p>\n<h2 id=\"obsidian-search\">Obsidian search</h2>\n<p>Fine for interactive use. Operators worth knowing: <code>path:</code>, <code>file:</code>, <code>tag:</code> and\n<code>line:</code> for terms co-occurring on the same line, which cuts most false positives.</p>\n<h2 id=\"dataview\">Dataview</h2>\n<p>Queries over frontmatter, which is where structural questions get answered:</p>\n<pre><code>```dataview\nTABLE updated, tags FROM &quot;wiki/concepts&quot;\nWHERE contains(tags, &quot;unverified&quot;)\nSORT updated ASC\n```\n</code></pre>\n<p>Anything phrased as \"which pages have property P\" is a Dataview query, and\nanswering those by asking the agent to read files is slower and less reliable.</p>\n<h2 id=\"combining-them\">Combining them</h2>\n<p>The pattern that works: Dataview or ripgrep to get a candidate set, the graph to\nexpand from it, the agent to read and synthesise.</p>\n<pre><code>Find every page tagged unverified, follow their links, and tell me which claims\ndepend on unverified sources.\n</code></pre>\n<p>Mechanical filtering first, judgement second. Asking the agent to do the\nfiltering by reading everything wastes context on pages a query would have\nexcluded in milliseconds.</p>\n<h2 id=\"when-search-gets-slow\">When search gets slow</h2>\n<p>It will not, at personal scale. Ripgrep over ten thousand markdown files is\nstill instant, and if search feels slow the cause is usually the agent reading\ntoo many files, not the search itself.</p>\n<p>That is a context problem, not a search problem. See <a href=\"context-budget.md\">context\nbudget</a>.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"rag-on-top.md\">Adding RAG when you need it</a></p>", "headings": ["ripgrep", "Obsidian search", "Dataview", "Combining them", "When search gets slow", "Next"], "words": 307, "text": "Retrieval in a plain-text vault is mostly grep. That sounds primitive and is almost always enough. ripgrep bash rg -i \"graph rag\" ~/brain --type md -l rg -i \"supersed\" ~/brain -C 2 Instant on tens of thousands of files. The agent uses it by default when working on the filesystem, and for \"where did I mention this\" it beats every fancier option on both speed and predictability. Its limit is exact wording. It cannot find the page about a concept you described differently, which is what the graph and the index are for. Obsidian search Fine for interactive use. Operators worth knowing: path: , file: , tag: and line: for terms co-occurring on the same line, which cuts most false positives. Dataview Queries over frontmatter, which is where structural questions get answered: dataview TABLE updated, tags FROM \"wiki/concepts\" WHERE contains tags, \"unverified\" SORT updated ASC Anything phrased as \"which pages have property P\" is a Dataview query, and answering those by asking the agent to read files is slower and less reliable. Combining them The pattern that works: Dataview or ripgrep to get a candidate set, the graph to expand from it, the agent to read and synthesise. Find every page tagged unverified, follow their links, and tell me which claims depend on unverified sources. Mechanical filtering first, judgement second. Asking the agent to do the filtering by reading everything wastes context on pages a query would have excluded in milliseconds. When search gets slow It will not, at personal scale. Ripgrep over ten thousand markdown files is still instant, and if search feels slow the cause is usually the agent reading too many files, not the search itself. That is a context problem, not a search problem. See context budget context-budget.md . Next Adding RAG when you need it rag-on-top.md", "links": [{"to": "07-retrieval/context-budget", "label": "context\nbudget"}, {"to": "07-retrieval/rag-on-top", "label": "Adding RAG when you need it"}]}, {"id": "07-retrieval/rag-on-top", "path": "docs/07-retrieval/rag-on-top.md", "section": "07-retrieval", "section_title": "Retrieval", "title": "Adding RAG when you need it", "html": "<p>This guide argues against a vector database for a personal vault. That argument\nhas a threshold, and it is worth naming rather than treating as doctrine.</p>\n<h2 id=\"when-it-starts-to-pay\">When it starts to pay</h2>\n<p>Three conditions, roughly together:</p>\n<p><strong>Scale past a few thousand pages,</strong> where reading the index plus following\nlinks stops fitting the context budget.</p>\n<p><strong>Questions phrased in wording your pages do not use.</strong> If you regularly fail to\nfind things you know are there, that is a recall problem, which is what\nembeddings solve.</p>\n<p><strong>A corpus you did not curate.</strong> A vault that absorbed ten thousand documents\nwithout a human deciding what mattered has no reliable structure to navigate,\nso similarity is what is left.</p>\n<p>Most personal vaults never hit all three. Mine has not, and I would not add the\nmaintenance for two out of three.</p>\n<h2 id=\"what-to-embed\">What to embed</h2>\n<p>Not raw sources. Embed the wiki pages.</p>\n<p>They are already semantic units, written by something that understood them, one\nidea each. That is what chunking tries to approximate and rarely achieves.\nRe-chunking them into fixed-size windows destroys the structure you paid for.</p>\n<p>Embed the page title, aliases and body together. Titles carry a lot of signal\nin a curated vault, because you chose them.</p>\n<h2 id=\"hybrid-not-replacement\">Hybrid, not replacement</h2>\n<p>The useful arrangement keeps the graph in charge:</p>\n<ol>\n<li>Embeddings find entry-point pages, including ones whose wording differs.</li>\n<li>The graph expands from those entry points through links.</li>\n<li>The agent reads the expanded set and answers with citations.</li>\n</ol>\n<p>Embeddings supply recall, the graph supplies structure and the reason two pages\nare related. Using similarity for the whole pipeline throws away the links,\nwhich is the part of your vault that took work.</p>\n<h2 id=\"keeping-the-index-fresh\">Keeping the index fresh</h2>\n<p>This is the maintenance nobody accounts for. Every ingest changes pages, and a\nstale embedding index returns pages whose content has moved on.</p>\n<p>Re-embed changed pages as part of the ingest run, not on a separate schedule. An\nindex that lags by a week is quietly wrong in a way that produces plausible bad\nanswers.</p>\n<p>If that sounds like more upkeep than it is worth, that is the correct reading for\nmost vaults, and it is the honest reason this section is short.</p>\n<h2 id=\"simpler-things-to-try-first\">Simpler things to try first</h2>\n<p>Before adding infrastructure, check whether the problem is actually recall.</p>\n<p>Missing aliases are the most common cause of \"I cannot find it\". So is a bad\nindex. So is an ingest that stopped linking properly two months ago and left a\ngrowing pile of orphans, which no retrieval method can reach.</p>\n<p>Run <code>scripts/link_check.py</code> and read your index before concluding you need\nvectors.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"context-budget.md\">Context budget</a></p>", "headings": ["When it starts to pay", "What to embed", "Hybrid, not replacement", "Keeping the index fresh", "Simpler things to try first", "Next"], "words": 442, "text": "This guide argues against a vector database for a personal vault. That argument has a threshold, and it is worth naming rather than treating as doctrine. When it starts to pay Three conditions, roughly together: Scale past a few thousand pages, where reading the index plus following links stops fitting the context budget. Questions phrased in wording your pages do not use. If you regularly fail to find things you know are there, that is a recall problem, which is what embeddings solve. A corpus you did not curate. A vault that absorbed ten thousand documents without a human deciding what mattered has no reliable structure to navigate, so similarity is what is left. Most personal vaults never hit all three. Mine has not, and I would not add the maintenance for two out of three. What to embed Not raw sources. Embed the wiki pages. They are already semantic units, written by something that understood them, one idea each. That is what chunking tries to approximate and rarely achieves. Re-chunking them into fixed-size windows destroys the structure you paid for. Embed the page title, aliases and body together. Titles carry a lot of signal in a curated vault, because you chose them. Hybrid, not replacement The useful arrangement keeps the graph in charge: 1. Embeddings find entry-point pages, including ones whose wording differs. 2. The graph expands from those entry points through links. 3. The agent reads the expanded set and answers with citations. Embeddings supply recall, the graph supplies structure and the reason two pages are related. Using similarity for the whole pipeline throws away the links, which is the part of your vault that took work. Keeping the index fresh This is the maintenance nobody accounts for. Every ingest changes pages, and a stale embedding index returns pages whose content has moved on. Re-embed changed pages as part of the ingest run, not on a separate schedule. An index that lags by a week is quietly wrong in a way that produces plausible bad answers. If that sounds like more upkeep than it is worth, that is the correct reading for most vaults, and it is the honest reason this section is short. Simpler things to try first Before adding infrastructure, check whether the problem is actually recall. Missing aliases are the most common cause of \"I cannot find it\". So is a bad index. So is an ingest that stopped linking properly two months ago and left a growing pile of orphans, which no retrieval method can reach. Run scripts/link_check.py and read your index before concluding you need vectors. Next Context budget context-budget.md", "links": [{"to": "07-retrieval/context-budget", "label": "Context budget"}]}, {"id": "07-retrieval/context-budget", "path": "docs/07-retrieval/context-budget.md", "section": "07-retrieval", "section_title": "Retrieval", "title": "Context budget", "html": "<p>Every page the agent reads costs context, and quality degrades well before the\nwindow is full. Reading more is not reading better.</p>\n<h2 id=\"progressive-disclosure\">Progressive disclosure</h2>\n<p>The pattern that works:</p>\n<ol>\n<li><strong>Index first.</strong> What exists, one line each.</li>\n<li><strong>Open the pages that matter.</strong> Usually three to eight.</li>\n<li><strong>Follow links one hop at a time,</strong> stopping when new pages stop adding.</li>\n</ol>\n<p>Each step is cheap and informs the next. The alternative, loading everything\nplausibly related up front, spends most of the budget on pages that turn out\nirrelevant, and pushes the useful ones into the middle of a long context where\nattention is weakest.</p>\n<h2 id=\"why-not-paste-the-whole-vault\">Why not paste the whole vault</h2>\n<p>Long-context models can hold a lot, and it is tempting to skip retrieval\nentirely.</p>\n<p>Two reasons not to. Attention is uneven across a long context, and material in\nthe middle is used less reliably than material at the edges, which is the finding\nin \"Lost in the Middle\" and the reason position matters at all. And an answer\nbuilt from everything cannot be checked: you have no idea which pages it actually\nused.</p>\n<p>An answer citing five pages you can open beats a fluent answer built from four\nhundred you cannot.</p>\n<h2 id=\"summary-layers\">Summary layers</h2>\n<p>Past a few hundred pages, add one level of index between the master index and\nthe pages: a short page per topic area, listing what is in that area and what\neach page covers.</p>\n<p>The agent reads the master index, opens the one topic index that matters, then\nopens pages. Three cheap reads instead of one expensive one.</p>\n<p>Do not let summary layers accumulate. Two levels is enough; three means you are\nbuilding a hierarchy nobody maintains, and summaries of summaries drift from\nwhat is underneath them.</p>\n<h2 id=\"measuring-what-was-read\">Measuring what was read</h2>\n<pre><code>List the pages you read to answer that, in the order you opened them.\n</code></pre>\n<p>Worth running occasionally. It exposes two problems: an agent reading thirty\npages when six would do, and an agent answering from three when the vault has\ntwenty relevant ones. Both are fixable by adjusting the instructions, and neither\nis visible from the answer alone.</p>\n<h2 id=\"subagents-for-wide-reads\">Subagents for wide reads</h2>\n<p>When a question genuinely needs a lot of material, send a\n<a href=\"../06-agents/subagents.md\">subagent</a>. It reads in its own context and returns a\nsummary, so the main session pays for the answer rather than for the sources.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../08-outputs/README.md\">Outputs</a>, where the vault starts producing rather than\nanswering.</p>", "headings": ["Progressive disclosure", "Why not paste the whole vault", "Summary layers", "Measuring what was read", "Subagents for wide reads", "Next"], "words": 408, "text": "Every page the agent reads costs context, and quality degrades well before the window is full. Reading more is not reading better. Progressive disclosure The pattern that works: 1. Index first. What exists, one line each. 2. Open the pages that matter. Usually three to eight. 3. Follow links one hop at a time, stopping when new pages stop adding. Each step is cheap and informs the next. The alternative, loading everything plausibly related up front, spends most of the budget on pages that turn out irrelevant, and pushes the useful ones into the middle of a long context where attention is weakest. Why not paste the whole vault Long-context models can hold a lot, and it is tempting to skip retrieval entirely. Two reasons not to. Attention is uneven across a long context, and material in the middle is used less reliably than material at the edges, which is the finding in \"Lost in the Middle\" and the reason position matters at all. And an answer built from everything cannot be checked: you have no idea which pages it actually used. An answer citing five pages you can open beats a fluent answer built from four hundred you cannot. Summary layers Past a few hundred pages, add one level of index between the master index and the pages: a short page per topic area, listing what is in that area and what each page covers. The agent reads the master index, opens the one topic index that matters, then opens pages. Three cheap reads instead of one expensive one. Do not let summary layers accumulate. Two levels is enough; three means you are building a hierarchy nobody maintains, and summaries of summaries drift from what is underneath them. Measuring what was read List the pages you read to answer that, in the order you opened them. Worth running occasionally. It exposes two problems: an agent reading thirty pages when six would do, and an agent answering from three when the vault has twenty relevant ones. Both are fixable by adjusting the instructions, and neither is visible from the answer alone. Subagents for wide reads When a question genuinely needs a lot of material, send a subagent ../06-agents/subagents.md . It reads in its own context and returns a summary, so the main session pays for the answer rather than for the sources. Next Outputs ../08-outputs/README.md , where the vault starts producing rather than answering.", "links": [{"to": "06-agents/subagents", "label": "subagent"}]}, {"id": "08-outputs/writing-from-the-vault", "path": "docs/08-outputs/writing-from-the-vault.md", "section": "08-outputs", "section_title": "Outputs", "title": "Writing from the vault", "html": "<p>Writing is where the vault stops being an input and starts being leverage. The\nresearch is already done, cited, and connected. What is left is the argument.</p>\n<h2 id=\"outline-from-concept-pages-not-from-a-prompt\">Outline from concept pages, not from a prompt</h2>\n<pre><code>I want to write about why context length does not replace retrieval. Which of my\nconcept pages are relevant, what do they collectively argue, and where do my\nsources disagree?\n</code></pre>\n<p>That gives you an outline grounded in things you read, with the weak points\nmarked. Asking a model to outline the topic from scratch gives you the consensus\nview of the internet, which is what everyone else is also writing.</p>\n<p>The disagreements are the most useful part. They are where you have something to\nsay that is not the consensus.</p>\n<h2 id=\"cite-your-own-sources\">Cite your own sources</h2>\n<p>Every claim in a draft traces back through a concept page to a source page to a\nURL. That chain is what makes fact-checking a five-minute job instead of an\nafternoon.</p>\n<p>It also protects you from the specific failure of writing with a model: fluent\nsentences containing invented specifics. If a number in the draft has no source\npage behind it, it did not come from your research.</p>\n<h2 id=\"keep-your-voice\">Keep your voice</h2>\n<p>Drafting from the vault produces the model's phrasing over your material. That is\nfine as a first pass and bad as a final one.</p>\n<p>The practical split: let the agent assemble structure and evidence, write the\nsentences yourself. Or draft with it and rewrite every paragraph. What does not\nwork is publishing the assembly, which reads exactly like what it is.</p>\n<h2 id=\"close-the-loop\">Close the loop</h2>\n<p>Ingest your own finished work back into the vault.</p>\n<p>Your published pieces are sources like any other: they contain your positions,\nstated clearly, at a date. Six months later the vault can tell you what you\nargued and whether you still believe it.</p>\n<p>This is the step almost everyone skips, and it is what makes the second piece in\na domain meaningfully faster than the first.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"research-reports.md\">Research reports</a></p>", "headings": ["Outline from concept pages, not from a prompt", "Cite your own sources", "Keep your voice", "Close the loop", "Next"], "words": 340, "text": "Writing is where the vault stops being an input and starts being leverage. The research is already done, cited, and connected. What is left is the argument. Outline from concept pages, not from a prompt I want to write about why context length does not replace retrieval. Which of my concept pages are relevant, what do they collectively argue, and where do my sources disagree? That gives you an outline grounded in things you read, with the weak points marked. Asking a model to outline the topic from scratch gives you the consensus view of the internet, which is what everyone else is also writing. The disagreements are the most useful part. They are where you have something to say that is not the consensus. Cite your own sources Every claim in a draft traces back through a concept page to a source page to a URL. That chain is what makes fact-checking a five-minute job instead of an afternoon. It also protects you from the specific failure of writing with a model: fluent sentences containing invented specifics. If a number in the draft has no source page behind it, it did not come from your research. Keep your voice Drafting from the vault produces the model's phrasing over your material. That is fine as a first pass and bad as a final one. The practical split: let the agent assemble structure and evidence, write the sentences yourself. Or draft with it and rewrite every paragraph. What does not work is publishing the assembly, which reads exactly like what it is. Close the loop Ingest your own finished work back into the vault. Your published pieces are sources like any other: they contain your positions, stated clearly, at a date. Six months later the vault can tell you what you argued and whether you still believe it. This is the step almost everyone skips, and it is what makes the second piece in a domain meaningfully faster than the first. Next Research reports research-reports.md", "links": [{"to": "08-outputs/research-reports", "label": "Research reports"}]}, {"id": "08-outputs/research-reports", "path": "docs/08-outputs/research-reports.md", "section": "08-outputs", "section_title": "Outputs", "title": "Research reports", "html": "<p>A research report is what you produce when a question needs more than the vault\ncurrently holds. The vault is the starting point, not the whole answer.</p>\n<h2 id=\"scope-against-what-exists-first\">Scope against what exists first</h2>\n<pre><code>I need to understand how companies are deploying agent harnesses in production.\nWhat does my vault already cover, what is thin, and what is missing entirely?\n</code></pre>\n<p>That answer is your research plan. Most of the work in a good report is knowing\nwhat you do not need to look up, and starting from the vault means you are not\nre-reading things you read last year.</p>\n<h2 id=\"fill-the-gaps-deliberately\">Fill the gaps deliberately</h2>\n<p>Go find sources for the gaps, ingest them properly through <code>raw/</code>, and let them\nbuild pages the same way everything else does.</p>\n<p>Resisting the shortcut matters. Pasting a fresh article straight into the report\ndraft gets the report written and leaves the vault no better, which means the\nnext report on an adjacent topic starts from the same place.</p>\n<h2 id=\"structure\">Structure</h2>\n<pre><code>Question\nWhat I found          (with page citations)\nWhere sources disagree\nWhat I could not establish\nWhat would change the conclusion\n</code></pre>\n<p>The last two sections are what make a report worth rereading. A report that\npresents only findings looks stronger and is less useful, because the reader\ncannot tell where it is load-bearing and where it is thin.</p>\n<h2 id=\"store-it-as-a-source\">Store it as a source</h2>\n<p>Reports go in <code>output/</code>, then get ingested back as sources.</p>\n<p>A report is a dated snapshot of your understanding, and having it in the vault as\na source means later material can contradict it explicitly rather than quietly\nsuperseding it. See\n<a href=\"../04-structuring/contradictions-and-supersession.md\">supersession</a>.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"publishing-and-export.md\">Publishing and export</a></p>", "headings": ["Scope against what exists first", "Fill the gaps deliberately", "Structure", "Store it as a source", "Next"], "words": 278, "text": "A research report is what you produce when a question needs more than the vault currently holds. The vault is the starting point, not the whole answer. Scope against what exists first I need to understand how companies are deploying agent harnesses in production. What does my vault already cover, what is thin, and what is missing entirely? That answer is your research plan. Most of the work in a good report is knowing what you do not need to look up, and starting from the vault means you are not re-reading things you read last year. Fill the gaps deliberately Go find sources for the gaps, ingest them properly through raw/ , and let them build pages the same way everything else does. Resisting the shortcut matters. Pasting a fresh article straight into the report draft gets the report written and leaves the vault no better, which means the next report on an adjacent topic starts from the same place. Structure Question What I found with page citations Where sources disagree What I could not establish What would change the conclusion The last two sections are what make a report worth rereading. A report that presents only findings looks stronger and is less useful, because the reader cannot tell where it is load-bearing and where it is thin. Store it as a source Reports go in output/ , then get ingested back as sources. A report is a dated snapshot of your understanding, and having it in the vault as a source means later material can contradict it explicitly rather than quietly superseding it. See supersession ../04-structuring/contradictions-and-supersession.md . Next Publishing and export publishing-and-export.md", "links": [{"to": "04-structuring/contradictions-and-supersession", "label": "supersession"}, {"to": "08-outputs/publishing-and-export", "label": "Publishing and export"}]}, {"id": "08-outputs/publishing-and-export", "path": "docs/08-outputs/publishing-and-export.md", "section": "08-outputs", "section_title": "Outputs", "title": "Publishing and export", "html": "<p>Some of your vault is worth showing to other people. Most of it is not, and the\nmechanics of that split are worth setting up before you publish anything.</p>\n<h2 id=\"deciding-what-is-public\">Deciding what is public</h2>\n<p>The simplest reliable approach is an explicit opt-in: a <code>publish: true</code> field in\nfrontmatter, and nothing without it ever leaves.</p>\n<p>Opt-out is the alternative and it is a mistake. Under opt-out, one forgotten flag\npublishes something private, and the failure is silent and permanent because it\nis already indexed.</p>\n<h2 id=\"static-site-options\">Static site options</h2>\n<p>Obsidian Publish is the official route and the least work. Quartz and Obsidian\nDigital Garden are the common open-source ones, both build a static site from a\nvault and both understand wikilinks and backlinks, which matters because a\npublished wiki with broken links is worse than a blog.</p>\n<p>Whatever you use, check what happens to a link pointing at an unpublished page.\nIt should degrade to plain text rather than to a 404.</p>\n<h2 id=\"publishing-a-subset-safely\">Publishing a subset safely</h2>\n<p>The pattern that works: a build step copies only <code>publish: true</code> pages into a\nseparate folder, rewrites links to unpublished pages as plain text, and builds\nfrom that copy.</p>\n<p>Never point a publishing tool at your live vault directly. One misconfigured\ninclude pattern publishes everything, and there is no way to unpublish something\nthat was crawled.</p>\n<h2 id=\"what-publishing-does-to-your-writing\">What publishing does to your writing</h2>\n<p>A public wiki changes how you write pages, and not entirely for the better. You\nstart writing for an audience: hedging more, explaining more, keeping tentative\nthoughts out.</p>\n<p>Tentative thoughts are exactly what a personal vault is for. If you publish,\nconsider keeping the private vault primary and publishing a deliberately selected\nsubset, rather than making the whole thing public and unconsciously sanitising\nit.</p>\n<h2 id=\"other-exports\">Other exports</h2>\n<p>PDF and HTML for a single report, straight from markdown with pandoc. Fine for\nsharing one document.</p>\n<p>Do not export the vault as a whole to any format you cannot regenerate. The\nmarkdown is the artifact.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"teaching-yourself.md\">Learning from your own vault</a></p>", "headings": ["Deciding what is public", "Static site options", "Publishing a subset safely", "What publishing does to your writing", "Other exports", "Next"], "words": 338, "text": "Some of your vault is worth showing to other people. Most of it is not, and the mechanics of that split are worth setting up before you publish anything. Deciding what is public The simplest reliable approach is an explicit opt-in: a publish: true field in frontmatter, and nothing without it ever leaves. Opt-out is the alternative and it is a mistake. Under opt-out, one forgotten flag publishes something private, and the failure is silent and permanent because it is already indexed. Static site options Obsidian Publish is the official route and the least work. Quartz and Obsidian Digital Garden are the common open-source ones, both build a static site from a vault and both understand wikilinks and backlinks, which matters because a published wiki with broken links is worse than a blog. Whatever you use, check what happens to a link pointing at an unpublished page. It should degrade to plain text rather than to a 404. Publishing a subset safely The pattern that works: a build step copies only publish: true pages into a separate folder, rewrites links to unpublished pages as plain text, and builds from that copy. Never point a publishing tool at your live vault directly. One misconfigured include pattern publishes everything, and there is no way to unpublish something that was crawled. What publishing does to your writing A public wiki changes how you write pages, and not entirely for the better. You start writing for an audience: hedging more, explaining more, keeping tentative thoughts out. Tentative thoughts are exactly what a personal vault is for. If you publish, consider keeping the private vault primary and publishing a deliberately selected subset, rather than making the whole thing public and unconsciously sanitising it. Other exports PDF and HTML for a single report, straight from markdown with pandoc. Fine for sharing one document. Do not export the vault as a whole to any format you cannot regenerate. The markdown is the artifact. Next Learning from your own vault teaching-yourself.md", "links": [{"to": "08-outputs/teaching-yourself", "label": "Learning from your own vault"}]}, {"id": "08-outputs/teaching-yourself", "path": "docs/08-outputs/teaching-yourself.md", "section": "08-outputs", "section_title": "Outputs", "title": "Learning from your own vault", "html": "<p>Reading something is not learning it. A vault full of well-written pages you\nnever revisit is a library, and libraries do not make anyone knowledgeable.</p>\n<h2 id=\"questions-from-your-own-pages\">Questions from your own pages</h2>\n<pre><code>Generate ten questions from my concept pages on prediction markets. Mix recall\nand application. Do not include the answers.\n</code></pre>\n<p>Answer them without looking. The ones you cannot answer are things you saved and\nnever actually learned, which is most of what anyone saves.</p>\n<p>This is more useful than generic quizzing because the questions come from\nmaterial you chose, at the depth you recorded it.</p>\n<h2 id=\"spaced-repetition-without-the-card-writing\">Spaced repetition, without the card-writing</h2>\n<p>The reason spaced repetition has low adoption is that writing cards is tedious.\nThe vault removes that step: concept pages are the source material, and the agent\ncan generate cards from them.</p>\n<p>The <a href=\"https://github.com/st3v3nmw/obsidian-spaced-repetition\">Spaced Repetition</a>\nplugin reads cards written inside your notes, so they live alongside the concept\nrather than in a separate app that drifts out of sync.</p>\n<p>Keep it to a small number of pages that actually matter. Reviewing everything you\never saved is a job, not a habit.</p>\n<h2 id=\"find-what-you-saved-and-did-not-understand\">Find what you saved and did not understand</h2>\n<pre><code>Which of my concept pages are written in language copied from the source rather\nthan explained in my own words? Those are the ones I probably did not understand.\n</code></pre>\n<p>A page that reproduces the source's phrasing is a page nobody digested. That is a\nreal signal, and it is invisible until you ask.</p>\n<h2 id=\"explain-it-back\">Explain it back</h2>\n<p>The oldest test there is:</p>\n<pre><code>Ask me to explain [[GraphRAG]] as if to someone who has not read about it. Then\ncompare what I said to my page and tell me what I left out.\n</code></pre>\n<p>Gaps between what you can say and what your page contains are precise, and they\nare exactly the thing rereading never reveals.</p>\n<h2 id=\"measure-learning-not-collection\">Measure learning, not collection</h2>\n<p>Page count goes up whether or not you know more. What is worth tracking is\nwhether you can answer questions from your own material without opening it.</p>\n<p>Once a quarter is enough. The result reliably surprises people, in both\ndirections.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../09-maintenance/README.md\">Maintenance</a>, for keeping all of it alive.</p>", "headings": ["Questions from your own pages", "Spaced repetition, without the card-writing", "Find what you saved and did not understand", "Explain it back", "Measure learning, not collection", "Next"], "words": 365, "text": "Reading something is not learning it. A vault full of well-written pages you never revisit is a library, and libraries do not make anyone knowledgeable. Questions from your own pages Generate ten questions from my concept pages on prediction markets. Mix recall and application. Do not include the answers. Answer them without looking. The ones you cannot answer are things you saved and never actually learned, which is most of what anyone saves. This is more useful than generic quizzing because the questions come from material you chose, at the depth you recorded it. Spaced repetition, without the card-writing The reason spaced repetition has low adoption is that writing cards is tedious. The vault removes that step: concept pages are the source material, and the agent can generate cards from them. The Spaced Repetition https://github.com/st3v3nmw/obsidian-spaced-repetition plugin reads cards written inside your notes, so they live alongside the concept rather than in a separate app that drifts out of sync. Keep it to a small number of pages that actually matter. Reviewing everything you ever saved is a job, not a habit. Find what you saved and did not understand Which of my concept pages are written in language copied from the source rather than explained in my own words? Those are the ones I probably did not understand. A page that reproduces the source's phrasing is a page nobody digested. That is a real signal, and it is invisible until you ask. Explain it back The oldest test there is: Ask me to explain GraphRAG as if to someone who has not read about it. Then compare what I said to my page and tell me what I left out. Gaps between what you can say and what your page contains are precise, and they are exactly the thing rereading never reveals. Measure learning, not collection Page count goes up whether or not you know more. What is worth tracking is whether you can answer questions from your own material without opening it. Once a quarter is enough. The result reliably surprises people, in both directions. Next Maintenance ../09-maintenance/README.md , for keeping all of it alive.", "links": []}, {"id": "09-maintenance/lint-and-health", "path": "docs/09-maintenance/lint-and-health.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Linting the vault", "html": "<p>Structural rot is silent. Nothing errors. The vault just slowly stops answering\nwell because a third of its pages are unreachable and nobody noticed.</p>\n<h2 id=\"what-a-lint-checks\">What a lint checks</h2>\n<p><strong>Broken links.</strong> Two distinct cases: a typo or rename, which gets fixed, and a\ngenuine gap, which goes into <code>index.md</code> under Gaps.</p>\n<p><strong>Orphans.</strong> Pages nothing links to. Either find where they belong and link\nthem, or delete them.</p>\n<p><strong>Stubs.</strong> Pages under about forty words with no links, usually a failed ingest.\nFlag for re-ingest from the original in <code>raw/</code>.</p>\n<p><strong>Schema violations.</strong> Missing frontmatter, wrong type, tags outside the\nvocabulary.</p>\n<p><strong>Near-duplicates.</strong> Similar titles, overlapping aliases, shared inbound links.</p>\n<p><strong>Index drift.</strong> Pages missing from <code>index.md</code>, entries pointing nowhere.</p>\n<h2 id=\"report-before-repairing\">Report before repairing</h2>\n<p>Mechanical fixes happen automatically. Anything requiring judgement gets\nproposed and waits for you.</p>\n<p>That line matters because a linter that merges pages on its own judgement\ndestroys work, and one that only reports produces a list nobody acts on. Broken\nlinks and schema errors are mechanical. Merges and deletions are not.</p>\n<h2 id=\"running-it\">Running it</h2>\n<pre><code>/lint\n</code></pre>\n<p>Weekly, or after any import of more than about twenty sources. Not after every\ningest, where it costs more than it catches.</p>\n<p>Run it on a clean git state, so a wrong repair is one <code>git checkout</code> away.</p>\n<p>Inside Obsidian, <a href=\"https://github.com/Vinzent03/find-unlinked-files\">Find orphaned files and broken\nlinks</a> covers the same two\nchecks visually.</p>\n<p>For a fast read without invoking the agent:</p>\n<pre><code class=\"language-bash\">python3 scripts/link_check.py ~/brain\n</code></pre>\n<h2 id=\"reading-the-output\">Reading the output</h2>\n<p>The counts matter more than the individual items. Three broken links after a\nweek is normal. Forty means something in the ingest instructions changed and is\nproducing links to pages it never creates.</p>\n<p>Track the rates over time rather than the raw numbers, since both grow with the\nvault. See <a href=\"../05-graphs/metrics.md\">metrics</a>.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"review-cadence.md\">Review cadence</a></p>", "headings": ["What a lint checks", "Report before repairing", "Running it", "Reading the output", "Next"], "words": 300, "text": "Structural rot is silent. Nothing errors. The vault just slowly stops answering well because a third of its pages are unreachable and nobody noticed. What a lint checks Broken links. Two distinct cases: a typo or rename, which gets fixed, and a genuine gap, which goes into index.md under Gaps. Orphans. Pages nothing links to. Either find where they belong and link them, or delete them. Stubs. Pages under about forty words with no links, usually a failed ingest. Flag for re-ingest from the original in raw/ . Schema violations. Missing frontmatter, wrong type, tags outside the vocabulary. Near-duplicates. Similar titles, overlapping aliases, shared inbound links. Index drift. Pages missing from index.md , entries pointing nowhere. Report before repairing Mechanical fixes happen automatically. Anythin
