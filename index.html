g requiring judgement gets proposed and waits for you. That line matters because a linter that merges pages on its own judgement destroys work, and one that only reports produces a list nobody acts on. Broken links and schema errors are mechanical. Merges and deletions are not. Running it /lint Weekly, or after any import of more than about twenty sources. Not after every ingest, where it costs more than it catches. Run it on a clean git state, so a wrong repair is one git checkout away. Inside Obsidian, Find orphaned files and broken links https://github.com/Vinzent03/find-unlinked-files covers the same two checks visually. For a fast read without invoking the agent: bash python3 scripts/link_check.py ~/brain Reading the output The counts matter more than the individual items. Three broken links after a week is normal. Forty means something in the ingest instructions changed and is producing links to pages it never creates. Track the rates over time rather than the raw numbers, since both grow with the vault. See metrics ../05-graphs/metrics.md . Next Review cadence review-cadence.md", "links": [{"to": "05-graphs/metrics", "label": "metrics"}, {"to": "09-maintenance/review-cadence", "label": "Review cadence"}]}, {"id": "09-maintenance/review-cadence", "path": "docs/09-maintenance/review-cadence.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Review cadence", "html": "<p>Lint keeps the structure sound. Review is what keeps you in the loop, and it is\nthe only maintenance task that produces something you read rather than something\nthat happens.</p>\n<h2 id=\"weekly-ten-minutes\">Weekly, ten minutes</h2>\n<p>The agent prepares it; you read it.</p>\n<pre><code>/review\n</code></pre>\n<p>What comes back: what was added, which concepts gained the most links,\ncontradictions recorded and still unresolved, open questions, and three specific\nthings to read or write next.</p>\n<p>The clusters are the part worth attention. Where your links went last week is\nwhere your attention actually was, which is reliably different from where you\nthink it was.</p>\n<h2 id=\"monthly-structurally\">Monthly, structurally</h2>\n<p>Once a month, look at the vault rather than the week:</p>\n<ul>\n<li>The four <a href=\"../05-graphs/metrics.md\">metrics</a>, appended to a note so you have a\n  trend</li>\n<li>Concept pages untouched in ninety days while their topic kept getting sources</li>\n<li>The Gaps list in <code>index.md</code>, which is a reading list you generated without\n  trying</li>\n<li>One local graph of a page you wrote recently, as a spot check on linking\n  quality</li>\n</ul>\n<h2 id=\"quarterly-honestly\">Quarterly, honestly</h2>\n<p>Two questions.</p>\n<p><strong>What have I changed my mind about?</strong> Only answerable because of the\n<a href=\"../04-structuring/contradictions-and-supersession.md\">supersession rules</a>, and\nworth the whole system on its own.</p>\n<p><strong>What am I keeping that I will never use?</strong> Archive it. A vault carrying dead\nmaterial makes every query slightly worse, forever.</p>\n<h2 id=\"what-to-prune\">What to prune</h2>\n<p>Sources for topics you no longer care about: archive rather than delete, they\ncost nothing in <code>raw/</code> and the wiki pages can go.</p>\n<p>Concept pages that never got a second source: usually means the idea was not\nactually important to you.</p>\n<p>Nothing that is linked. A page five others depend on is load-bearing regardless\nof how it reads.</p>\n<h2 id=\"keep-the-review-short\">Keep the review short</h2>\n<p>A review that lists everything gets skimmed and then ignored. Three\nrecommendations, not ten. If a week produced nothing worth reporting, one line\nsaying so is the correct output.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"versioning-with-git.md\">Versioning</a></p>", "headings": ["Weekly, ten minutes", "Monthly, structurally", "Quarterly, honestly", "What to prune", "Keep the review short", "Next"], "words": 321, "text": "Lint keeps the structure sound. Review is what keeps you in the loop, and it is the only maintenance task that produces something you read rather than something that happens. Weekly, ten minutes The agent prepares it; you read it. /review What comes back: what was added, which concepts gained the most links, contradictions recorded and still unresolved, open questions, and three specific things to read or write next. The clusters are the part worth attention. Where your links went last week is where your attention actually was, which is reliably different from where you think it was. Monthly, structurally Once a month, look at the vault rather than the week: - The four metrics ../05-graphs/metrics.md , appended to a note so you have a trend - Concept pages untouched in ninety days while their topic kept getting sources - The Gaps list in index.md , which is a reading list you generated without trying - One local graph of a page you wrote recently, as a spot check on linking quality Quarterly, honestly Two questions. What have I changed my mind about? Only answerable because of the supersession rules ../04-structuring/contradictions-and-supersession.md , and worth the whole system on its own. What am I keeping that I will never use? Archive it. A vault carrying dead material makes every query slightly worse, forever. What to prune Sources for topics you no longer care about: archive rather than delete, they cost nothing in raw/ and the wiki pages can go. Concept pages that never got a second source: usually means the idea was not actually important to you. Nothing that is linked. A page five others depend on is load-bearing regardless of how it reads. Keep the review short A review that lists everything gets skimmed and then ignored. Three recommendations, not ten. If a week produced nothing worth reporting, one line saying so is the correct output. Next Versioning versioning-with-git.md", "links": [{"to": "05-graphs/metrics", "label": "metrics"}, {"to": "04-structuring/contradictions-and-supersession", "label": "supersession rules"}, {"to": "09-maintenance/versioning-with-git", "label": "Versioning"}]}, {"id": "09-maintenance/versioning-with-git", "path": "docs/09-maintenance/versioning-with-git.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Versioning", "html": "<p>Git is what makes an agent safe to run unattended. Without it, a bad run is a\nmystery; with it, every change is a diff you can read and revert in one command.</p>\n<h2 id=\"commit-granularity\">Commit granularity</h2>\n<p>One commit per run, with the run named:</p>\n<pre><code>ingest 2026-09-07: 4 sources, 9 pages\nlint 2026-09-07: 3 broken links, 1 merge\n</code></pre>\n<p>Not one commit per file, which buries the history, and not one commit per week,\nwhich makes reverting a single bad run impossible without losing the good ones.</p>\n<p>Scheduled tasks commit their own work as part of the run. See\n<a href=\"../06-agents/scheduled-maintenance.md\">scheduling</a>.</p>\n<h2 id=\"reading-diffs-of-generated-pages\">Reading diffs of generated pages</h2>\n<p>Worth doing in the first weeks, and occasionally after.</p>\n<p>You are looking for two things: pages that changed when they should not have,\nand rewrites where an update was expected. An agent quietly rewriting a page it\nwas asked to append to is the kind of behaviour that only shows up in a diff.</p>\n<p><code>git log --stat</code> after a week tells you which pages your automation touches most,\nwhich is usually informative.</p>\n<h2 id=\"reverting\">Reverting</h2>\n<pre><code class=\"language-bash\">git revert HEAD          # undo one run, keep the history\ngit checkout .           # discard uncommitted work\ngit checkout HEAD~3 -- wiki/concepts/some-page.md   # one page back\n</code></pre>\n<p>The middle one is the reason to commit before any large operation. A backfill\nthat went wrong halfway costs you the run rather than the vault.</p>\n<h2 id=\"branches\">Branches</h2>\n<p>Worth it for experiments that touch structure: a new page contract, a schema\nchange, a bulk re-ingest under different instructions.</p>\n<pre><code class=\"language-bash\">git checkout -b new-schema\n</code></pre>\n<p>Run it, read the result, merge or delete the branch. Doing this on <code>main</code> and\ndeciding afterwards is how vaults end up in a half-migrated state that nobody\nwants to finish.</p>\n<h2 id=\"what-not-to-commit\">What not to commit</h2>\n<p><code>.obsidian/workspace*</code>, caches, and anything containing a key. The Local REST API\nkey lives in plugin data, so check <code>.obsidian/plugins/</code> before the first push.</p>\n<p>Keep the remote private unless you have deliberately made the vault public.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"backups-and-portability.md\">Backups and portability</a></p>", "headings": ["Commit granularity", "Reading diffs of generated pages", "Reverting", "Branches", "What not to commit", "Next"], "words": 338, "text": "Git is what makes an agent safe to run unattended. Without it, a bad run is a mystery; with it, every change is a diff you can read and revert in one command. Commit granularity One commit per run, with the run named: ingest 2026-09-07: 4 sources, 9 pages lint 2026-09-07: 3 broken links, 1 merge Not one commit per file, which buries the history, and not one commit per week, which makes reverting a single bad run impossible without losing the good ones. Scheduled tasks commit their own work as part of the run. See scheduling ../06-agents/scheduled-maintenance.md . Reading diffs of generated pages Worth doing in the first weeks, and occasionally after. You are looking for two things: pages that changed when they should not have, and rewrites where an update was expected. An agent quietly rewriting a page it was asked to append to is the kind of behaviour that only shows up in a diff. git log --stat after a week tells you which pages your automation touches most, which is usually informative. Reverting bash git revert HEAD undo one run, keep the history git checkout . discard uncommitted work git checkout HEAD~3 -- wiki/concepts/some-page.md one page back The middle one is the reason to commit before any large operation. A backfill that went wrong halfway costs you the run rather than the vault. Branches Worth it for experiments that touch structure: a new page contract, a schema change, a bulk re-ingest under different instructions. bash git checkout -b new-schema Run it, read the result, merge or delete the branch. Doing this on main and deciding afterwards is how vaults end up in a half-migrated state that nobody wants to finish. What not to commit .obsidian/workspace , caches, and anything containing a key. The Local REST API key lives in plugin data, so check .obsidian/plugins/ before the first push. Keep the remote private unless you have deliberately made the vault public. Next Backups and portability backups-and-portability.md", "links": [{"to": "06-agents/scheduled-maintenance", "label": "scheduling"}, {"to": "09-maintenance/backups-and-portability", "label": "Backups and portability"}]}, {"id": "09-maintenance/backups-and-portability", "path": "docs/09-maintenance/backups-and-portability.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Backups and portability", "html": "<h2 id=\"sync-is-not-backup\">Sync is not backup</h2>\n<p>This is the whole page, and it is the mistake almost everyone makes.</p>\n<p>Sync propagates. If an automation rewrites two hundred pages badly, sync\nfaithfully copies the damage to every device within seconds. If a file is\ndeleted, it is deleted everywhere.</p>\n<p>Backup means a copy that does not follow. At least one, disconnected from the\nsync path.</p>\n<h2 id=\"a-workable-arrangement\">A workable arrangement</h2>\n<p><strong>Git remote,</strong> private, pushed after every run. Versioned, so it covers the\n\"what did it look like three weeks ago\" case that a file backup does not.</p>\n<p><strong>Sync</strong> for working across machines, whichever kind you already use.</p>\n<p><strong>A periodic archive</strong> to external or separate cloud storage, not connected to\neither of the above. Monthly is enough.</p>\n<p>Three copies, one of which is dumb and slow, is the arrangement that survives the\nfailure modes that actually happen.</p>\n<h2 id=\"test-a-restore\">Test a restore</h2>\n<p>Once. Take the archive, restore it somewhere else, open it in Obsidian, and check\nthe links work.</p>\n<p>Untested backups fail at a reliably bad moment, and the common failure is not\ncorruption. It is discovering that the archive excluded a folder, or captured the\nvault mid-sync in a half-written state.</p>\n<h2 id=\"what-you-are-protecting-against\">What you are protecting against</h2>\n<p>Not disk failure, which is rare and which sync handles.</p>\n<p>The real risk is an automation that quietly did something wrong three weeks ago,\nwhich you notice now. That needs history, which is why git carries more of the\nload here than file backups.</p>\n<h2 id=\"portability\">Portability</h2>\n<p>The vault is markdown and wikilinks, so leaving any particular tool costs\nnothing structural. What is worth checking occasionally:</p>\n<p><strong>Nothing important lives outside the files.</strong> Plugin-specific metadata, canvas\nfiles, database exports. All fine as extras, none of it should carry knowledge\nthat exists nowhere else.</p>\n<p><strong>Links resolve without Obsidian.</strong> <code>scripts/link_check.py</code> verifies this, since\nit parses wikilinks itself.</p>\n<p><strong>The agent instructions are in the vault,</strong> not in a chat history or an app\nsetting. <code>CLAUDE.md</code>, skills and commands travel with the folder.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"privacy-and-secrets.md\">Privacy</a></p>", "headings": ["Sync is not backup", "A workable arrangement", "Test a restore", "What you are protecting against", "Portability", "Next"], "words": 333, "text": "Sync is not backup This is the whole page, and it is the mistake almost everyone makes. Sync propagates. If an automation rewrites two hundred pages badly, sync faithfully copies the damage to every device within seconds. If a file is deleted, it is deleted everywhere. Backup means a copy that does not follow. At least one, disconnected from the sync path. A workable arrangement Git remote, private, pushed after every run. Versioned, so it covers the \"what did it look like three weeks ago\" case that a file backup does not. Sync for working across machines, whichever kind you already use. A periodic archive to external or separate cloud storage, not connected to either of the above. Monthly is enough. Three copies, one of which is dumb and slow, is the arrangement that survives the failure modes that actually happen. Test a restore Once. Take the archive, restore it somewhere else, open it in Obsidian, and check the links work. Untested backups fail at a reliably bad moment, and the common failure is not corruption. It is discovering that the archive excluded a folder, or captured the vault mid-sync in a half-written state. What you are protecting against Not disk failure, which is rare and which sync handles. The real risk is an automation that quietly did something wrong three weeks ago, which you notice now. That needs history, which is why git carries more of the load here than file backups. Portability The vault is markdown and wikilinks, so leaving any particular tool costs nothing structural. What is worth checking occasionally: Nothing important lives outside the files. Plugin-specific metadata, canvas files, database exports. All fine as extras, none of it should carry knowledge that exists nowhere else. Links resolve without Obsidian. scripts/link_check.py verifies this, since it parses wikilinks itself. The agent instructions are in the vault, not in a chat history or an app setting. CLAUDE.md , skills and commands travel with the folder. Next Privacy privacy-and-secrets.md", "links": [{"to": "09-maintenance/privacy-and-secrets", "label": "Privacy"}]}, {"id": "09-maintenance/privacy-and-secrets", "path": "docs/09-maintenance/privacy-and-secrets.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Privacy", "html": "<p>A mature second brain is one of the highest-signal documents about a person that\nexists. Everything you read, worked on, worried about and asked, connected and\nindexed.</p>\n<p>That is the point, and it is the reason to be deliberate about what goes in and\nwhere it lives.</p>\n<h2 id=\"decide-at-capture-not-later\">Decide at capture, not later</h2>\n<p>Redaction after ingest does not work. By the time you decide something should not\nbe there, it has propagated into concept pages, links and synthesis pages, and\nremoving it means finding all of them.</p>\n<p>Decide before the file lands in <code>raw/</code>. See <a href=\"../03-ingestion/chat-exports.md\">chat\nexports</a>, which is where this bites hardest,\nbecause chat history contains more than any other source and is imported in bulk.</p>\n<h2 id=\"what-does-not-belong\">What does not belong</h2>\n<p><strong>Credentials of any kind.</strong> Not because the agent leaks them, but because the\nvault gets synced, committed, backed up and occasionally shared. Every copy is\nanother place the key exists.</p>\n<p><strong>Other people's private information.</strong> Meeting transcripts, personal messages,\nanything told to you in confidence. Your notes are not the right home for\nsomeone else's confidences, and they did not consent to being ingested.</p>\n<p><strong>Material you are contractually bound to keep confidential.</strong> Client work under\nNDA in a vault that syncs to a personal cloud account is a real exposure.</p>\n<h2 id=\"separate-vaults-over-careful-filtering\">Separate vaults over careful filtering</h2>\n<p>If you have material that must not mix, use a separate vault rather than tags or\nfolders inside one.</p>\n<p>A single vault with a private section relies on every query, every export and\nevery publish step respecting the boundary. Two vaults cannot leak into each\nother, and the cost is having to pick which one to open.</p>\n<h2 id=\"local-models-for-sensitive-material\">Local models for sensitive material</h2>\n<p>If a category of material should not leave your machine at all, a local model\nhandles ingestion for that vault. Quality is lower than a frontier model, which\nis the trade.</p>\n<p>Worth it for medical, legal or financial material. Usually not worth it for\narticles about software.</p>\n<h2 id=\"publishing\">Publishing</h2>\n<p>Explicit opt-in only. See <a href=\"../08-outputs/publishing-and-export.md\">publishing and\nexport</a>.</p>\n<h2 id=\"before-sharing-a-vault\">Before sharing a vault</h2>\n<p>Search it for keys, run through the frontmatter for personal identifiers, and\nread the log for what was ingested from where. Once shared, it is out, and the\ngraph makes it easy for a reader to assemble a picture you did not intend to\ngive.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"scaling.md\">Scaling past a thousand pages</a></p>", "headings": ["Decide at capture, not later", "What does not belong", "Separate vaults over careful filtering", "Local models for sensitive material", "Publishing", "Before sharing a vault", "Next"], "words": 393, "text": "A mature second brain is one of the highest-signal documents about a person that exists. Everything you read, worked on, worried about and asked, connected and indexed. That is the point, and it is the reason to be deliberate about what goes in and where it lives. Decide at capture, not later Redaction after ingest does not work. By the time you decide something should not be there, it has propagated into concept pages, links and synthesis pages, and removing it means finding all of them. Decide before the file lands in raw/ . See chat exports ../03-ingestion/chat-exports.md , which is where this bites hardest, because chat history contains more than any other source and is imported in bulk. What does not belong Credentials of any kind. Not because the agent leaks them, but because the vault gets synced, committed, backed up and occasionally shared. Every copy is another place the key exists. Other people's private information. Meeting transcripts, personal messages, anything told to you in confidence. Your notes are not the right home for someone else's confidences, and they did not consent to being ingested. Material you are contractually bound to keep confidential. Client work under NDA in a vault that syncs to a personal cloud account is a real exposure. Separate vaults over careful filtering If you have material that must not mix, use a separate vault rather than tags or folders inside one. A single vault with a private section relies on every query, every export and every publish step respecting the boundary. Two vaults cannot leak into each other, and the cost is having to pick which one to open. Local models for sensitive material If a category of material should not leave your machine at all, a local model handles ingestion for that vault. Quality is lower than a frontier model, which is the trade. Worth it for medical, legal or financial material. Usually not worth it for articles about software. Publishing Explicit opt-in only. See publishing and export ../08-outputs/publishing-and-export.md . Before sharing a vault Search it for keys, run through the frontmatter for personal identifiers, and read the log for what was ingested from where. Once shared, it is out, and the graph makes it easy for a reader to assemble a picture you did not intend to give. Next Scaling past a thousand pages scaling.md", "links": [{"to": "03-ingestion/chat-exports", "label": "chat\nexports"}, {"to": "08-outputs/publishing-and-export", "label": "publishing and\nexport"}, {"to": "09-maintenance/scaling", "label": "Scaling past a thousand pages"}]}, {"id": "09-maintenance/scaling", "path": "docs/09-maintenance/scaling.md", "section": "09-maintenance", "section_title": "Maintenance", "title": "Scaling past a thousand pages", "html": "<p>Most of this guide assumes a vault of a few hundred to a few thousand pages,\nwhich is where personal vaults live for years. Past that, some things strain.</p>\n<h2 id=\"what-actually-breaks\">What actually breaks</h2>\n<p><strong>Not search.</strong> Ripgrep over ten thousand markdown files is still instant.</p>\n<p><strong>Not Obsidian,</strong> although the global graph view stops being usable somewhere\naround a thousand nodes.</p>\n<p><strong>Retrieval economy.</strong> The index gets long enough that reading it costs real\ncontext, which is the first genuine constraint.</p>\n<p><strong>Your attention.</strong> A thousand pages is more than you can hold a mental map of,\nwhich is precisely when the vault becomes more useful and also when you stop\nnoticing that parts of it have rotted.</p>\n<h2 id=\"summary-layers\">Summary layers</h2>\n<p>The fix for the index problem: one level between the master index and the pages.</p>\n<p>A short page per topic area, listing what is in it and what each page covers. The\nagent reads the master index, opens the one topic index that matters, then opens\npages. Three cheap reads instead of one expensive one.</p>\n<p>Two levels is enough. Three means summaries of summaries, which drift from what\nthey describe and get read instead of it.</p>\n<h2 id=\"splitting-vaults\">Splitting vaults</h2>\n<p>Split by domain when two areas genuinely do not inform each other: work and a\nhobby, two unrelated fields.</p>\n<p>Do not split by date or by size. The whole value is that old material connects to\nnew, and a vault split chronologically severs exactly the connections worth\nhaving.</p>\n<p>The cost of splitting is that cross-domain connections stop happening, and those\nare often the interesting ones. Split late and reluctantly.</p>\n<h2 id=\"archiving\">Archiving</h2>\n<p>Move cold material to an <code>archive/</code> folder outside <code>wiki/</code>: still on disk, still\nsearchable with ripgrep, no longer in the index or the graph.</p>\n<p>Reversible, which matters, because \"cold\" is a guess. A topic you archived can be\nbrought back if it turns out to matter again.</p>\n<h2 id=\"pruning-what-never-mattered\">Pruning what never mattered</h2>\n<p>Concept pages with one source and no inbound links after a year were never\nconcepts, they were paragraphs. Deleting them improves everything else by\nreducing what queries have to read past.</p>\n<p>Run this once a year, not continuously.</p>\n<h2 id=\"the-honest-ceiling\">The honest ceiling</h2>\n<p>Somewhere past ten thousand pages, a curated wiki stops being the right structure\nfor a single person, because nobody can curate at that rate and the curation is\nwhat made it work.</p>\n<p>If you are there, either the vault has stopped being personal, or ingestion has\nbeen running without judgement for a long time. The second is far more common,\nand the fix is upstream, in what you feed it.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../10-troubleshooting/README.md\">Troubleshooting</a>.</p>", "headings": ["What actually breaks", "Summary layers", "Splitting vaults", "Archiving", "Pruning what never mattered", "The honest ceiling", "Next"], "words": 434, "text": "Most of this guide assumes a vault of a few hundred to a few thousand pages, which is where personal vaults live for years. Past that, some things strain. What actually breaks Not search. Ripgrep over ten thousand markdown files is still instant. Not Obsidian, although the global graph view stops being usable somewhere around a thousand nodes. Retrieval economy. The index gets long enough that reading it costs real context, which is the first genuine constraint. Your attention. A thousand pages is more than you can hold a mental map of, which is precisely when the vault becomes more useful and also when you stop noticing that parts of it have rotted. Summary layers The fix for the index problem: one level between the master index and the pages. A short page per topic area, listing what is in it and what each page covers. The agent reads the master index, opens the one topic index that matters, then opens pages. Three cheap reads instead of one expensive one. Two levels is enough. Three means summaries of summaries, which drift from what they describe and get read instead of it. Splitting vaults Split by domain when two areas genuinely do not inform each other: work and a hobby, two unrelated fields. Do not split by date or by size. The whole value is that old material connects to new, and a vault split chronologically severs exactly the connections worth having. The cost of splitting is that cross-domain connections stop happening, and those are often the interesting ones. Split late and reluctantly. Archiving Move cold material to an archive/ folder outside wiki/ : still on disk, still searchable with ripgrep, no longer in the index or the graph. Reversible, which matters, because \"cold\" is a guess. A topic you archived can be brought back if it turns out to matter again. Pruning what never mattered Concept pages with one source and no inbound links after a year were never concepts, they were paragraphs. Deleting them improves everything else by reducing what queries have to read past. Run this once a year, not continuously. The honest ceiling Somewhere past ten thousand pages, a curated wiki stops being the right structure for a single person, because nobody can curate at that rate and the curation is what made it work. If you are there, either the vault has stopped being personal, or ingestion has been running without judgement for a long time. The second is far more common, and the fix is upstream, in what you feed it. Next Troubleshooting ../10-troubleshooting/README.md .", "links": []}, {"id": "10-troubleshooting/common-failures", "path": "docs/10-troubleshooting/common-failures.md", "section": "10-troubleshooting", "section_title": "Troubleshooting", "title": "The failures everyone hits", "html": "<h2 id=\"the-vault-stalls-after-two-weeks\">The vault stalls after two weeks</h2>\n<p>Almost always capture, not the system. Clipping takes three clicks instead of\none, or the phone has no path into the vault, so material stops arriving and\nthere is nothing to process.</p>\n<p>Fix the capture path, not the vault. See\n<a href=\"../03-ingestion/README.md\">Ingestion</a>.</p>\n<p>The other cause is expecting the payoff too early. At thirty pages there is\nnothing to connect. See <a href=\"../01-concepts/what-good-looks-like.md\">what good looks\nlike</a> for the real timeline.</p>\n<h2 id=\"pages-are-summaries-of-summaries\">Pages are summaries of summaries</h2>\n<p>Source pages that summarise the article, concept pages that summarise the source\npages. Each layer loses information and the bottom layer is what gets read.</p>\n<p>The cause is a page contract that says \"summarise\" anywhere in it. Concept pages\nexplain an idea in plain language, in your words, standing on their own. Rewrite\nthe contract in <code>CLAUDE.md</code> and re-ingest a few sources to check.</p>\n<h2 id=\"the-agent-rewrites-work-you-did-by-hand\">The agent rewrites work you did by hand</h2>\n<p>Infuriating and preventable. Mark hand-written pages in frontmatter:</p>\n<pre><code class=\"language-yaml\">maintained_by: human\n</code></pre>\n<p>And in <code>CLAUDE.md</code>: never rewrite a page marked <code>maintained_by: human</code>, only\nappend links and flag issues for the owner.</p>\n<h2 id=\"ingest-quality-drops-as-the-vault-grows\">Ingest quality drops as the vault grows</h2>\n<p>Real, and the cause is usually context. Ingesting into a vault of three hundred\npages means the agent should be checking what exists first, and if it is not, it\ncreates new pages instead of updating.</p>\n<p>Check that ingestion reads <code>index.md</code> before writing. That one step is what keeps\nquality flat as the vault grows.</p>\n<h2 id=\"everything-connects-to-everything\">Everything connects to everything</h2>\n<p>A few hub pages have accumulated every link, so the graph says nothing. Split\nthe hubs into the specific ideas people are actually linking to. See <a href=\"../04-structuring/linking-rules.md\">linking\nrules</a>.</p>\n<h2 id=\"you-stopped-opening-it\">You stopped opening it</h2>\n<p>The honest failure. Usually capture broke months ago and the vault has been\nstatic, or the review is too long to read.</p>\n<p>Both are fixable. Neither is a reason to start over with a different tool, which\nis the instinct and always costs another month.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"agent-writes-garbage.md\">The agent writes garbage</a></p>", "headings": ["The vault stalls after two weeks", "Pages are summaries of summaries", "The agent rewrites work you did by hand", "Ingest quality drops as the vault grows", "Everything connects to everything", "You stopped opening it", "Next"], "words": 336, "text": "The vault stalls after two weeks Almost always capture, not the system. Clipping takes three clicks instead of one, or the phone has no path into the vault, so material stops arriving and there is nothing to process. Fix the capture path, not the vault. See Ingestion ../03-ingestion/README.md . The other cause is expecting the payoff too early. At thirty pages there is nothing to connect. See what good looks like ../01-concepts/what-good-looks-like.md for the real timeline. Pages are summaries of summaries Source pages that summarise the article, concept pages that summarise the source pages. Each layer loses information and the bottom layer is what gets read. The cause is a page contract that says \"summarise\" anywhere in it. Concept pages explain an idea in plain language, in your words, standing on their own. Rewrite the contract in CLAUDE.md and re-ingest a few sources to check. The agent rewrites work you did by hand Infuriating and preventable. Mark hand-written pages in frontmatter: yaml maintained_by: human And in CLAUDE.md : never rewrite a page marked maintained_by: human , only append links and flag issues for the owner. Ingest quality drops as the vault grows Real, and the cause is usually context. Ingesting into a vault of three hundred pages means the agent should be checking what exists first, and if it is not, it creates new pages instead of updating. Check that ingestion reads index.md before writing. That one step is what keeps quality flat as the vault grows. Everything connects to everything A few hub pages have accumulated every link, so the graph says nothing. Split the hubs into the specific ideas people are actually linking to. See linking rules ../04-structuring/linking-rules.md . You stopped opening it The honest failure. Usually capture broke months ago and the vault has been static, or the review is too long to read. Both are fixable. Neither is a reason to start over with a different tool, which is the instinct and always costs another month. Next The agent writes garbage agent-writes-garbage.md", "links": [{"to": "01-concepts/what-good-looks-like", "label": "what good looks\nlike"}, {"to": "04-structuring/linking-rules", "label": "linking\nrules"}, {"to": "10-troubleshooting/agent-writes-garbage", "label": "The agent writes garbage"}]}, {"id": "10-troubleshooting/agent-writes-garbage", "path": "docs/10-troubleshooting/agent-writes-garbage.md", "section": "10-troubleshooting", "section_title": "Troubleshooting", "title": "The agent writes garbage", "html": "<p>Pages that are technically about the right thing and useless to read.</p>\n<h2 id=\"diagnose-the-source-first\">Diagnose the source first</h2>\n<p>Before touching instructions, check the input. Open the file in <code>raw/</code> and read\nit.</p>\n<p>Half of the bad pages people blame on the agent come from a bad extraction: a PDF\nwhose columns interleaved, an auto-caption transcript with no punctuation, a\nclipped page that captured the cookie banner instead of the article.</p>\n<p>The agent cannot write a good page from mangled text, and it will not tell you it\nis struggling. See <a href=\"../03-ingestion/pdfs-and-books.md\">PDFs</a> and\n<a href=\"../03-ingestion/youtube-transcripts.md\">transcripts</a>.</p>\n<h2 id=\"then-check-claudemd\">Then check CLAUDE.md</h2>\n<p>If the source is clean, the page contract is the problem.</p>\n<p>The specific things that produce vague pages: no definition of what each page\ntype contains, the word \"summarise\" anywhere, no instruction to write for a\nreader who has not seen the source, no requirement to link.</p>\n<p>Rewrite the contract with the shape spelled out. See <a href=\"../04-structuring/page-types.md\">page\ntypes</a>.</p>\n<h2 id=\"add-an-example-not-another-rule\">Add an example, not another rule</h2>\n<p>The highest-leverage fix and the least used. Put one good concept page in\n<code>CLAUDE.md</code>, in full, as the target.</p>\n<p>Rules describe the output abstractly and each new rule interacts with the others.\nOne example communicates the target directly, and it is what a person would ask\nfor if you told them to match a style.</p>\n<h2 id=\"ask-what-it-was-working-from\">Ask what it was working from</h2>\n<pre><code>You wrote [[page]]. Which parts of the source did you use, and what did you leave\nout?\n</code></pre>\n<p>The answer usually identifies the problem immediately: it read a fragment, it\ncould not tell what the source claimed versus reported, or the instructions\npulled it toward summarising.</p>\n<h2 id=\"roll-back-and-re-run\">Roll back and re-run</h2>\n<p>Fix the contract, revert the bad pages, re-ingest.</p>\n<pre><code class=\"language-bash\">git checkout HEAD~1 -- wiki/\n</code></pre>\n<p>Do not patch the bad pages by hand. If the contract was wrong, every page from\nthat run has the same flaw, and hand-fixing the three you noticed leaves the rest.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"broken-links.md\">Broken links and orphans</a></p>", "headings": ["Diagnose the source first", "Then check CLAUDE.md", "Add an example, not another rule", "Ask what it was working from", "Roll back and re-run", "Next"], "words": 327, "text": "Pages that are technically about the right thing and useless to read. Diagnose the source first Before touching instructions, check the input. Open the file in raw/ and read it. Half of the bad pages people blame on the agent come from a bad extraction: a PDF whose columns interleaved, an auto-caption transcript with no punctuation, a clipped page that captured the cookie banner instead of the article. The agent cannot write a good page from mangled text, and it will not tell you it is struggling. See PDFs ../03-ingestion/pdfs-and-books.md and transcripts ../03-ingestion/youtube-transcripts.md . Then check CLAUDE.md If the source is clean, the page contract is the problem. The specific things that produce vague pages: no definition of what each page type contains, the word \"summarise\" anywhere, no instruction to write for a reader who has not seen the source, no requirement to link. Rewrite the contract with the shape spelled out. See page types ../04-structuring/page-types.md . Add an example, not another rule The highest-leverage fix and the least used. Put one good concept page in CLAUDE.md , in full, as the target. Rules describe the output abstractly and each new rule interacts with the others. One example communicates the target directly, and it is what a person would ask for if you told them to match a style. Ask what it was working from You wrote page . Which parts of the source did you use, and what did you leave out? The answer usually identifies the problem immediately: it read a fragment, it could not tell what the source claimed versus reported, or the instructions pulled it toward summarising. Roll back and re-run Fix the contract, revert the bad pages, re-ingest. bash git checkout HEAD~1 -- wiki/ Do not patch the bad pages by hand. If the contract was wrong, every page from that run has the same flaw, and hand-fixing the three you noticed leaves the rest. Next Broken links and orphans broken-links.md", "links": [{"to": "03-ingestion/pdfs-and-books", "label": "PDFs"}, {"to": "03-ingestion/youtube-transcripts", "label": "transcripts"}, {"to": "04-structuring/page-types", "label": "page\ntypes"}, {"to": "10-troubleshooting/broken-links", "label": "Broken links and orphans"}]}, {"id": "10-troubleshooting/broken-links", "path": "docs/10-troubleshooting/broken-links.md", "section": "10-troubleshooting", "section_title": "Troubleshooting", "title": "Broken links and orphans", "html": "<pre><code class=\"language-bash\">python3 scripts/link_check.py ~/brain\n</code></pre>\n<h2 id=\"why-renames-break-links\">Why renames break links</h2>\n<p>Obsidian updates links when you rename inside the app. An agent renaming a file\ndirectly does not, and that is the most common cause of broken links in an\nagent-maintained vault.</p>\n<p>Prevent it with a rule in <code>CLAUDE.md</code>: renames update every inbound link, add the\nold name as an alias, and get recorded in <code>log.md</code>. See <a href=\"../04-structuring/naming-and-aliases.md\">naming and\naliases</a>.</p>\n<h2 id=\"fixing-in-bulk\">Fixing in bulk</h2>\n<p>Two categories, handled differently.</p>\n<p><strong>Typos and renames</strong> get fixed: point the link at the right page. Safe to\nautomate.</p>\n<p><strong>Genuine gaps</strong>, where the target never existed, go into <code>index.md</code> under Gaps.\nDo not create empty pages to satisfy them; an empty page is worse than a\nrecorded gap because it looks like coverage.</p>\n<p>Always on a clean git state, so a bad bulk fix is one command to undo.</p>\n<h2 id=\"orphans\">Orphans</h2>\n<p>Pages nothing links to. Three cases.</p>\n<p><strong>Should be linked and is not.</strong> Find the pages that ought to reference it and\nadd the links. This is the common case after a bulk import.</p>\n<p><strong>Genuinely standalone.</strong> Rare and usually a sign the material does not belong in\nthe wiki. Reference material and checklists belong in a project folder.</p>\n<p><strong>Failed ingest.</strong> A stub that never got connected. Re-ingest from the original\nin <code>raw/</code>.</p>\n<h2 id=\"preventing-both-at-ingest\">Preventing both at ingest</h2>\n<p>The rule that removes most of this work: nothing is ingested until it is linked,\nin both directions, in the same run.</p>\n<p>An ingest that ends with unlinked pages is an ingest that did not finish. Enforce\nit in the skill rather than cleaning up weekly.</p>\n<h2 id=\"after-a-big-import\">After a big import</h2>\n<p>Always lint. A large backfill reliably produces orphans and near-duplicates,\nbecause the agent was moving fast through material that overlapped.</p>\n<p>Budget for it: a thousand-source import is followed by a lint pass and a merge\nreview, and skipping that step is what leaves a vault permanently messy.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"vault-too-big.md\">The vault got too big</a></p>", "headings": ["Why renames break links", "Fixing in bulk", "Orphans", "Preventing both at ingest", "After a big import", "Next"], "words": 325, "text": "bash python3 scripts/link_check.py ~/brain Why renames break links Obsidian updates links when you rename inside the app. An agent renaming a file directly does not, and that is the most common cause of broken links in an agent-maintained vault. Prevent it with a rule in CLAUDE.md : renames update every inbound link, add the old name as an alias, and get recorded in log.md . See naming and aliases ../04-structuring/naming-and-aliases.md . Fixing in bulk Two categories, handled differently. Typos and renames get fixed: point the link at the right page. Safe to automate. Genuine gaps , where the target never existed, go into index.md under Gaps. Do not create empty pages to satisfy them; an empty page is worse than a recorded gap because it looks like coverage. Always on a clean git state, so a bad bulk fix is one command to undo. Orphans Pages nothing links to. Three cases. Should be linked and is not. Find the pages that ought to reference it and add the links. This is the common case after a bulk import. Genuinely standalone. Rare and usually a sign the material does not belong in the wiki. Reference material and checklists belong in a project folder. Failed ingest. A stub that never got connected. Re-ingest from the original in raw/ . Preventing both at ingest The rule that removes most of this work: nothing is ingested until it is linked, in both directions, in the same run. An ingest that ends with unlinked pages is an ingest that did not finish. Enforce it in the skill rather than cleaning up weekly. After a big import Always lint. A large backfill reliably produces orphans and near-duplicates, because the agent was moving fast through material that overlapped. Budget for it: a thousand-source import is followed by a lint pass and a merge review, and skipping that step is what leaves a vault permanently messy. Next The vault got too big vault-too-big.md", "links": [{"to": "04-structuring/naming-and-aliases", "label": "naming and\naliases"}, {"to": "10-troubleshooting/vault-too-big", "label": "The vault got too big"}]}, {"id": "10-troubleshooting/vault-too-big", "path": "docs/10-troubleshooting/vault-too-big.md", "section": "10-troubleshooting", "section_title": "Troubleshooting", "title": "The vault got too big", "html": "<h2 id=\"symptoms\">Symptoms</h2>\n<p>Answers get slower and vaguer. The agent reads twenty pages and returns something\ngeneral. The graph view is a hairball. You cannot remember whether a topic is\ncovered, and checking takes longer than searching the web.</p>\n<h2 id=\"what-it-usually-is-not\">What it usually is not</h2>\n<p>Disk, search speed, or Obsidian. Those all scale fine.</p>\n<p>What it actually is: retrieval economy. The index is long enough that reading it\ncosts real context, so the agent either skips it or spends its budget there\ninstead of on pages.</p>\n<h2 id=\"first-check-it-is-size-and-not-rot\">First, check it is size and not rot</h2>\n<p>Run the <a href=\"../05-graphs/metrics.md\">metrics</a>. A vault with a twenty percent orphan\nrate does not have a size problem, it has a linking problem, and splitting it\nwill not help.</p>\n<p>Genuinely large and healthy looks like: low orphan rate, one dominant component,\naverage degree in range, and an index over a few hundred entries.</p>\n<h2 id=\"summary-layers\">Summary layers</h2>\n<p>The first fix and usually enough. One index per topic area between the master\nindex and the pages, so the agent makes three cheap reads instead of one\nexpensive one. See <a href=\"../09-maintenance/scaling.md\">scaling</a>.</p>\n<h2 id=\"splitting\">Splitting</h2>\n<p>By domain, never by date. Two vaults that genuinely do not inform each other.</p>\n<p>Accept that cross-domain connections stop happening. Those are often the\ninteresting ones, which is why splitting is a late move rather than a first\nresponse.</p>\n<h2 id=\"archiving\">Archiving</h2>\n<p>Cold material to <code>archive/</code>, outside <code>wiki/</code>. Still searchable, out of the index\nand the graph, reversible.</p>\n<p>Better than deleting, because \"cold\" is a guess and archived material can come\nback.</p>\n<h2 id=\"rebuild-the-index\">Rebuild the index</h2>\n<p>Sometimes the index has simply drifted: entries for pages that moved, missing\nentries for pages added by runs that failed halfway.</p>\n<pre><code>Rebuild index.md from the actual contents of wiki/. Group by type and theme, one\nline of description per entry, and list gaps at the bottom.\n</code></pre>\n<p>Cheap, and it fixes a surprising share of \"the vault feels broken\" complaints.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"faq.md\">FAQ</a></p>", "headings": ["Symptoms", "What it usually is not", "First, check it is size and not rot", "Summary layers", "Splitting", "Archiving", "Rebuild the index", "Next"], "words": 322, "text": "Symptoms Answers get slower and vaguer. The agent reads twenty pages and returns something general. The graph view is a hairball. You cannot remember whether a topic is covered, and checking takes longer than searching the web. What it usually is not Disk, search speed, or Obsidian. Those all scale fine. What it actually is: retrieval economy. The index is long enough that reading it costs real context, so the agent either skips it or spends its budget there instead of on pages. First, check it is size and not rot Run the metrics ../05-graphs/metrics.md . A vault with a twenty percent orphan rate does not have a size problem, it has a linking problem, and splitting it will not help. Genuinely large and healthy looks like: low orphan rate, one dominant component, average degree in range, and an index over a few hundred entries. Summary layers The first fix and usually enough. One index per topic area between the master index and the pages, so the agent makes three cheap reads instead of one expensive one. See scaling ../09-maintenance/scaling.md . Splitting By domain, never by date. Two vaults that genuinely do not inform each other. Accept that cross-domain connections stop happening. Those are often the interesting ones, which is why splitting is a late move rather than a first response. Archiving Cold material to archive/ , outside wiki/ . Still searchable, out of the index and the graph, reversible. Better than deleting, because \"cold\" is a guess and archived material can come back. Rebuild the index Sometimes the index has simply drifted: entries for pages that moved, missing entries for pages added by runs that failed halfway. Rebuild index.md from the actual contents of wiki/. Group by type and theme, one line of description per entry, and list gaps at the bottom. Cheap, and it fixes a surprising share of \"the vault feels broken\" complaints. Next FAQ faq.md", "links": [{"to": "05-graphs/metrics", "label": "metrics"}, {"to": "09-maintenance/scaling", "label": "scaling"}, {"to": "10-troubleshooting/faq", "label": "FAQ"}]}, {"id": "10-troubleshooting/faq", "path": "docs/10-troubleshooting/faq.md", "section": "10-troubleshooting", "section_title": "Troubleshooting", "title": "FAQ", "html": "<p><strong>Do I need MCP?</strong></p>\n<p>No. Claude Code started inside the vault folder reads and writes it directly.\nMCP adds the ability to reach the vault from sessions not running in it, which\nmatters mainly for scheduled tasks. See <a href=\"../02-setup/mcp-obsidian.md\">MCP for\nObsidian</a>.</p>\n<p><strong>Does this work with agents other than Claude Code?</strong></p>\n<p>Yes. The vault is markdown and the skills are <code>SKILL.md</code> files, a format several\nagents read. Anything that can read and write files in a folder can maintain the\nvault; the instructions in <code>CLAUDE.md</code> may need renaming for other tools.</p>\n<p><strong>How much does it cost to run?</strong></p>\n<p>Depends entirely on volume. A daily ingest of a handful of articles is small. A\none-time backfill of a thousand sources is not, which is why the\n<a href=\"../03-ingestion/bulk-backfill.md\">backfill</a> page insists on batches with visible\ncosts.</p>\n<p><strong>Can I use a local model?</strong></p>\n<p>For ingestion of sensitive material, yes, with lower quality. Local models are\nweaker at the judgement calls that matter here: what deserves its own page, when\ntwo sources genuinely disagree. A workable split is a local model for private\nmaterial and a frontier model for everything else.</p>\n<p><strong>Do I need Obsidian?</strong></p>\n<p>No. The vault is a folder of markdown files. Obsidian is a good viewer for the\ngraph and has the Web Clipper, which is the strongest practical reason to use it.\nLogseq, Foam, or a plain editor all work.</p>\n<p><strong>What if I already have a Notion or Evernote full of notes?</strong></p>\n<p>Use the official <a href=\"https://github.com/obsidianmd/obsidian-importer\">Importer</a>\nplugin, which handles Notion, Evernote, Roam, Bear and Apple Notes. Then treat\nthe result as raw material: backfill oldest first. Expect the\nexport to be messy. Fix extraction before ingesting rather than hoping the agent\ncopes.</p>\n<p><strong>How is this different from a memory feature?</strong></p>\n<p>Memory features remember facts about you across sessions and belong to the tool.\nThis is a body of knowledge you own as files, that outlives the tool, and that\nyou can read, edit and publish yourself.</p>\n<p><strong>Will the agent make things up?</strong></p>\n<p>It can, which is why every rule in <a href=\"../04-structuring/README.md\">structuring</a> is\nabout attribution: claims recorded as claims, sources attached, gaps stated\nrather than filled. A page with no source behind a specific number is the thing\nto watch for.</p>\n<p><strong>Is the graph view actually useful or is it just pretty?</strong></p>\n<p>The global view is mostly pretty. The local graph is genuinely useful as a\nfive-second quality check on any page. See <a href=\"../05-graphs/obsidian-graph-view.md\">reading the graph\nview</a>.</p>\n<p><strong>How long before it is worth it?</strong></p>\n<p>Weeks two to four for the first real payoff, month six for the state people\ndescribe as the whole point.</p>\n<hr />\n<p>Something missing here? Open an issue.</p>", "headings": [], "words": 438, "text": "Do I need MCP? No. Claude Code started inside the vault folder reads and writes it directly. MCP adds the ability to reach the vault from sessions not running in it, which matters mainly for scheduled tasks. See MCP for Obsidian ../02-setup/mcp-obsidian.md . Does this work with agents other than Claude Code? Yes. The vault is markdown and the skills are SKILL.md files, a format several agents read. Anything that can read and write files in a folder can maintain the vault; the instructions in CLAUDE.md may need renaming for other tools. How much does it cost to run? Depends entirely on volume. A daily ingest of a handful of articles is small. A one-time backfill of a thousand sources is not, which is why the backfill ../03-ingestion/bulk-backfill.md page insists on batches with visible costs. Can I use a local model? For ingestion of sensitive material, yes, with lower quality. Local models are weaker at the judgement calls that matter here: what deserves its own page, when two sources genuinely disagree. A workable split is a local model for private material and a frontier model for everything else. Do I need Obsidian? No. The vault is a folder of markdown files. Obsidian is a good viewer for the graph and has the Web Clipper, which is the strongest practical reason to use it. Logseq, Foam, or a plain editor all work. What if I already have a Notion or Evernote full of notes? Use the official Importer https://github.com/obsidianmd/obsidian-importer plugin, which handles Notion, Evernote, Roam, Bear and Apple Notes. Then treat the result as raw material: backfill oldest first. Expect the export to be messy. Fix extraction before ingesting rather than hoping the agent copes. How is this different from a memory feature? Memory features remember facts about you across sessions and belong to the tool. This is a body of knowledge you own as files, that outlives the tool, and that you can read, edit and publish yourself. Will the agent make things up? It can, which is why every rule in structuring ../04-structuring/README.md is about attribution: claims recorded as claims, sources attached, gaps stated rather than filled. A page with no source behind a specific number is the thing to watch for. Is the graph view actually useful or is it just pretty? The global view is mostly pretty. The local graph is genuinely useful as a five-second quality check on any page. See reading the graph view ../05-graphs/obsidian-graph-view.md . How long before it is worth it? Weeks two to four for the first real payoff, month six for the state people describe as the whole point. --- Something missing here? Open an issue.", "links": [{"to": "02-setup/mcp-obsidian", "label": "MCP for\nObsidian"}, {"to": "03-ingestion/bulk-backfill", "label": "backfill"}, {"to": "05-graphs/obsidian-graph-view", "label": "reading the graph\nview"}]}], "sections": {"01-concepts": {"title": "Concepts", "blurb": "Why an LLM-maintained knowledge base beats the note system you abandoned, and what the pattern actually is."}, "02-setup": {"title": "Setup", "blurb": "From zero to a vault your agent maintains, in one evening. Follow the pages in order the first time. Nine steps, roughly twenty minutes of typing and however long the interview in step four takes you."}, "03-ingestion": {"title": "Ingestion", "blurb": "Getting everything you read, watch and write into `raw/` with as little friction as possible, then into the wiki without flooding it."}, "04-structuring": {"title": "Structuring", "blurb": "The rules that decide whether your vault becomes a graph or a landfill."}, "05-graphs": {"title": "Graphs", "blurb": "The part most second-brain guides skip. They tell you to open the graph view, say it looks like a brain, and move on."}, "06-agents": {"title": "Agents", "blurb": "Turning a one-off setup into a system that maintains itself."}, "07-retrieval": {"title": "Retrieval", "blurb": "How to actually ask your vault things and get answers worth trusting."}, "08-outputs": {"title": "Outputs", "blurb": "The vault earns its keep when things come out of it."}, "09-maintenance": {"title": "Maintenance", "blurb": "What keeps the thing alive after the novelty wears off."}, "10-troubleshooting": {"title": "Troubleshooting", "blurb": "Concrete failures, with fixes."}}, "order": {"01-concepts": ["01-concepts/what-is-a-second-brain", "01-concepts/the-save-for-later-paradox", "01-concepts/llm-wiki-pattern", "01-concepts/two-layers", "01-concepts/why-markdown-and-plain-text", "01-concepts/pkm-lineage", "01-concepts/wiki-vs-rag", "01-concepts/what-good-looks-like"], "02-setup": ["02-setup/obsidian-install-and-vault", "02-setup/claude-code-setup", "02-setup/mcp-obsidian", "02-setup/claude-md", "02-setup/vault-structure", "02-setup/project-scoping", "02-setup/live-data", "02-setup/obsidian-plugins", "02-setup/git-and-sync"], "03-ingestion": ["03-ingestion/web-clipper", "03-ingestion/youtube-transcripts", "03-ingestion/pdfs-and-books", "03-ingestion/chat-exports", "03-ingestion/voice-and-meetings", "03-ingestion/newsletters-and-email", "03-ingestion/bulk-backfill"], "04-structuring": ["04-structuring/atomic-pages", "04-structuring/page-types", "04-structuring/linking-rules", "04-structuring/frontmatter-schema", "04-structuring/naming-and-aliases", "04-structuring/dedupe-and-merge", "04-structuring/contradictions-and-supersession", "04-structuring/index-and-log"], "05-graphs": ["05-graphs/graph-basics", "05-graphs/obsidian-graph-view", "05-graphs/typed-links", "05-graphs/graph-vs-vectors", "05-graphs/graphrag", "05-graphs/exporting-your-graph", "05-graphs/metrics"], "06-agents": ["06-agents/agent-roles", "06-agents/scheduled-maintenance", "06-agents/subagents", "06-agents/hooks", "06-agents/skills-and-commands", "06-agents/safety-and-guardrails"], "07-retrieval": ["07-retrieval/asking-questions", "07-retrieval/query-patterns", "07-retrieval/search-tools", "07-retrieval/rag-on-top", "07-retrieval/context-budget"], "08-outputs": ["08-outputs/writing-from-the-vault", "08-outputs/research-reports", "08-outputs/publishing-and-export", "08-outputs/teaching-yourself"], "09-maintenance": ["09-maintenance/lint-and-health", "09-maintenance/review-cadence", "09-maintenance/versioning-with-git", "09-maintenance/backups-and-portability", "09-maintenance/privacy-and-secrets", "09-maintenance/scaling"], "10-troubleshooting": ["10-troubleshooting/common-failures", "10-troubleshooting/agent-writes-garbage", "10-troubleshooting/broken-links", "10-troubleshoot <script>
const D=JSON.parse(document.getElementById('data').textContent);
const P={}; D.pages.forEach(p=>P[p.id]=p);
const FLAT=[]; Object.keys(D.order).forEach(s=>D.order[s].forEach(id=>FLAT.push(id)));
const HERO=document.getElementById('hero').innerHTML;

function side(cur){
  const s=document.getElementById('side'); let h='';
  Object.keys(D.order).forEach((sec,i)=>{
    const open = cur && cur.startsWith(sec);
    h+=`<div class="sec ${open?'open':''}" data-sec="${sec}">
      <button aria-expanded="${!!open}"><span class="k">${String(i+1).padStart(2,'0')}</span>
      ${D.sections[sec].title}<span class="n">${D.order[sec].length}</span></button><ol>`;
    D.order[sec].forEach(id=>{
      h+=`<li><a href="#${id}" class="${id===cur?'cur':''}">${P[id].title}</a></li>`;
    });
    h+='</ol></div>';
  });
  s.innerHTML=h;
  s.querySelectorAll('.sec>button').forEach(b=>b.onclick=()=>{
    const d=b.parentElement; d.classList.toggle('open');
    b.setAttribute('aria-expanded', d.classList.contains('open'));
  });
}

function render(){
  const id=decodeURIComponent(location.hash.slice(1));
  const main=document.getElementById('main'), rail=document.getElementById('rail');
  if(!P[id]){
    main.innerHTML=HERO; rail.innerHTML=''; side(null);
    main.querySelectorAll('svg .node').forEach(n=>n.onclick=()=>{
      location.hash=D.order[n.dataset.sec][0];
    });
    document.title='Second Brain OS - the guide';
    window.scrollTo(0,0); return;
  }
  const p=P[id], i=FLAT.indexOf(id), prev=FLAT[i-1], next=FLAT[i+1];
  main.innerHTML=`<article class="page">
    <div class="crumb">${p.section_title} / page ${D.order[p.section].indexOf(id)+1} of ${D.order[p.section].length}</div>
    <h1>${p.title}</h1>${p.html}
    <div class="pager">
      ${prev?`<a href="#${prev}"><span class="lbl">previous</span>${P[prev].title}</a>`:'<span></span>'}
      ${next?`<a href="#${next}" style="text-align:right"><span class="lbl">next</span>${P[next].title}</a>`:'<span></span>'}
    </div>
    <div class="src">source: <a href="https://github.com/undefined-ui/second-brain-os/blob/main/${p.path}">${p.path}</a></div>
  </article>`;
  // rewrite internal links to hash routes, style them as wikilinks
  main.querySelectorAll('a[href$=".md"]').forEach(a=>{
    if(/^https?:/.test(a.getAttribute('href'))) return;
    const parts=a.getAttribute('href').replace(/^\.\//,'').split('/');
    let target=null;
    const file=parts[parts.length-1].replace('.md','');
    if(file==='README'){
      const sec=parts[parts.length-2]; if(D.order[sec]) target=D.order[sec][0];
    } else {
      const sec = parts.length>1 ? parts[parts.length-2] : p.section;
      const cand = sec+'/'+file;
      target = P[cand] ? cand : (P[p.section+'/'+file] ? p.section+'/'+file : null);
    }
    if(target){ a.setAttribute('href','#'+target); a.className='wiki'; }
    else if(a.getAttribute('href').indexOf('..')===0 || !/^https?:/.test(a.getAttribute('href'))){
      a.setAttribute('href','https://github.com/undefined-ui/second-brain-os/blob/main/'+a.getAttribute('href').replace(/^(\.\.\/)+/,''));
    }
  });
  const heads=[...main.querySelectorAll('h2')];
  const outs=[...main.querySelectorAll('a.wiki')].slice(0,8);
  rail.innerHTML=(heads.length?`<div class="grp"><h4>on this page</h4>`+
      heads.map((h,n)=>{h.id='h'+n;return `<a href="#${id}" onclick="document.getElementById('h${n}').scrollIntoView();return false">${h.textContent}</a>`}).join('')+`</div>`:'')
    +(outs.length?`<div class="grp"><h4>links out</h4>`+
      outs.map(a=>`<a href="${a.getAttribute('href')}">${a.textContent}</a>`).join('')+`</div>`:'');
  side(id); document.title=p.title+' - Second Brain OS'; window.scrollTo(0,0);
}

// search
const q=document.getElementById('q'), hits=document.getElementById('hits');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(v.length<2){hits.classList.remove('open');return;}
  const r=D.pages.map(p=>{
    let sc=0; const t=p.title.toLowerCase();
    if(t.includes(v)) sc+=10; if(t.startsWith(v)) sc+=6;
    const n=(p.text.toLowerCase().split(v).length-1); sc+=Math.min(n,6);
    return {p,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,9);
  hits.innerHTML=r.length?r.map(x=>`<a class="hit" href="#${x.p.id}"><b>${x.p.title}</b><i>${x.p.section_title}</i></a>`).join('')
    :'<div class="hit"><i>nothing in the guide matches that</i></div>';
  hits.classList.add('open');
});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';hits.classList.remove('open');q.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hits.classList.remove('open');});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(!P[decodeURIComponent(location.hash.slice(1))])return;
  const i=FLAT.indexOf(decodeURIComponent(location.hash.slice(1)));
  if(e.key==='ArrowRight'&&FLAT[i+1])location.hash=FLAT[i+1];
  if(e.key==='ArrowLeft'&&FLAT[i-1])location.hash=FLAT[i-1];
});
hits.addEventListener('click',()=>{hits.classList.remove('open');q.value='';});
const toc=document.getElementById('toc');
if(toc){toc.onclick=()=>document.getElementById('side').classList.toggle('show');}
document.getElementById('side').addEventListener('click',e=>{
  if(e.target.tagName==='A'&&innerWidth<=860) document.getElementById('side').classList.remove('show');
});
addEventListener('hashchange',render); render();
</script></body></html>
