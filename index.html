<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);

a{color:var(--accent);text-decoration:none}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

header{position:sticky;top:0;z-index:40;background:rgba(234,238,233,.94);

nav{display:flex;gap:18px;font-size:14.5px}

.search{margin-left:auto;position:relative}
.search input{font:14px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:8px 11px;width:210px}
.search input::placeholder{color:var(--faint)}
.hits{position:absolute;right:0;top:40px;width:430px;max-height:62vh;overflow:auto;
  background:var(--card);border:1px solid var(--rule);border-radius:3px;display:none}
.hits.open{display:block}
.hit{display:block;padding:10px 13px;border-bottom:1px solid var(--rule);color:var(--ink)}
.hit:last-child{border:0}
.hit:hover{background:var(--accent-bg);text-decoration:none}
.hit b{font-weight:600;font-size:15px}
.hit i{display:block;font-style:normal;font-size:12.5px;color:var(--faint);
  font-family:ui-monospace,Menlo,monospace;margin-top:2px}

.wrap{max-width:1500px;margin:0 auto;padding:0 22px;display:grid;
  grid-template-columns:266px minmax(0,1fr) 210px;gap:44px;align-items:start}
@media(max-width:1180px){.wrap{grid-template-columns:240px minmax(0,1fr);gap:34px}.rail{display:none}}
.toc-btn{display:none;font:13px/1 ui-monospace,Menlo,monospace;background:var(--card);
  color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;cursor:pointer}
@media(max-width:860px){
  .bar{flex-wrap:wrap;gap:12px;padding:11px 16px}

  nav{gap:14px;font-size:14px}
  .toc-btn{display:block;margin-left:auto}
  nav a[href^="http"]{display:none}
  .search{margin-left:0;order:9;width:100%}
  .search input{width:100%}
  .hits{width:100%;left:0;right:auto}
  .wrap{grid-template-columns:1fr;gap:0;padding:0 16px}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);
    padding:14px 0 18px;display:none}
  aside.show{display:block}
  main{padding:24px 0 70px}
  body{font-size:16.5px}
}

aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;
  padding:26px 18px 60px 0;border-right:1px solid var(--rule)}
.sec{margin-bottom:3px}
.sec>button{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font:600 14px/1.4 Charter,Georgia,serif;color:var(--ink);padding:6px 6px 6px 0;

.sec>button .n{font:11px/1 ui-monospace,Menlo,monospace;color:var(--faint);margin-left:auto}
.sec>button .k{font:11px/1 ui-monospace,Menlo,monospace;color:var(--accent);width:20px}
.sec ol{list-style:none;padding:0 0 6px 28px;display:none}
.sec.open ol{display:block}
.sec ol a{display:block;padding:4px 6px 4px 10px;font-size:14px;color:var(--soft);
  border-left:1px solid var(--rule);line-height:1.35}
.sec ol a:hover{color:var(--ink);border-color:var(--accent);text-decoration:none}
.sec ol a.cur{color:var(--ink);font-weight:600;border-left:2px solid var(--accent);
  background:var(--accent-bg)}

main{padding:34px 0 90px;min-width:0}
.rail{position:sticky;top:80px;padding:38px 0;font-size:13px;color:var(--faint)}
.rail h4{font:11px/1 ui-monospace,Menlo,monospace;color:var(--faint);
  letter-spacing:.08em;margin-bottom:9px;font-weight:600}
.rail a{display:block;color:var(--soft);padding:3px 0;font-size:13px;line-height:1.35}
.rail .grp{margin-bottom:24px}

/* hero */
.hero{max-width:var(--w)}
.hero h1{font:600 clamp(34px,4.6vw,52px)/1.05 Charter,Georgia,serif;letter-spacing:-.025em;margin-bottom:14px}
.hero p{font-size:19px;color:var(--soft);margin-bottom:8px}

svg .node text{font:12px ui-monospace,Menlo,monospace;fill:var(--ink);cursor:pointer}

.stats{display:flex;flex-wrap:wrap;gap:26px;margin:26px 0 34px;padding-top:20px;border-top:1px solid var(--rule)}

.seclist p{font-size:15px;color:var(--soft)}
.seclist .pg{font:12px ui-monospace,Menlo,monospace;color:var(--faint);margin-top:5px}

/* article */
article.page{max-width:var(--w)}
.crumb{font:12px ui-monospace,Menlo,monospace;color:var(--faint);margin-bottom:10px}
article.page h1{font:600 clamp(28px,3.4vw,38px)/1.12 Charter,Georgia,serif;
  letter-spacing:-.02em;margin-bottom:22px}
article.page h2{font:600 21px/1.3 Charter,Georgia,serif;margin:34px 0 11px;
  padding-top:16px;border-top:1px solid var(--rule)}
article.page h3{font:600 17px/1.3 Charter,Georgia,serif;margin:22px 0 7px}
article.page p{margin-bottom:15px}
article.page ul,article.page ol{margin:0 0 16px 22px}
article.page li{margin-bottom:7px}
article.page blockquote{border-left:2px solid var(--accent);padding-left:16px;
  color:var(--soft);margin-bottom:16px}
article.page code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;
  background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:1px 5px}
article.page pre{background:var(--card);border:1px solid var(--rule);border-radius:4px;
  padding:14px 16px;overflow:auto;margin-bottom:17px}
article.page pre code{background:none;border:0;padding:0;font-size:13.5px;line-height:1.55}
article.page table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14.5px}
article.page th{text-align:left;font-weight:600;padding:7px 10px 7px 0;
  border-bottom:1px solid var(--ink)}
article.page td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
article.page a.wiki{color:var(--accent);white-space:normal}
article.page a.wiki::before{content:"[[";color:var(--faint)}
article.page a.wiki::after{content:"]]";color:var(--faint)}
.pager{display:flex;gap:16px;justify-content:space-between;margin-top:46px;
  padding-top:18px;border-top:1px solid var(--rule);font-size:14px}
.pager a{max-width:46%}
.pager .lbl{display:block;font:11px ui-monospace,Menlo,monospace;color:var(--faint)}
.src{margin-top:34px;font:12px ui-monospace,Menlo,monospace;color:var(--faint)}

/* resources */
.rwrap{max-width:1180px;margin:0 auto;padding:34px 22px 90px}

.lede{max-width:62ch;color:var(--soft);margin:12px 0 24px;font-size:17px}
.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px;

.chip.on{background:var(--accent);border-color:var(--accent);color:#F7F9F6}

.row{display:grid;grid-template-columns:minmax(180px,260px) 120px 1fr;gap:18px;

@media(max-width:760px){.row{grid-template-columns:1fr;gap:3px}}
.row .nm{font-weight:600;font-size:16px}

footer{border-top:1px solid var(--rule);padding:22px;text-align:center;

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</div></div><div class="seclist"><article><h3><a href="#01-concepts/what-is-a-second-brain">Concepts</a></h3><p>Why an LLM-maintained knowledge base beats the note system you abandoned, and what the pattern actually is.</p><div class="pg">8 pages</div></article><article><h3><a href="#02-setup/obsidian-install-and-vault">Setup</a></h3><p>From zero to a vault your agent maintains, in one evening. Follow the pages in order the first time. Nine steps, roughly twenty minutes of typing and however long the interview in step four takes you.</p><div class="pg">9 pages</div></article><article><h3><a href="#03-ingestion/web-clipper">Ingestion</a></h3><p>Getting everything you read, watch and write into <code>raw/</code> with as little friction as possible, then into the wiki without flooding it.</p><div class="pg">7 pages</div></article><article><h3><a href="#04-structuring/atomic-pages">Structuring</a></h3><p>The rules that decide whether your vault becomes a graph or a landfill.</p><div class="pg">8 pages</div></article><article><h3><a href="#05-graphs/graph-basics">Graphs</a></h3><p>The part most second-brain guides skip. They tell you to open the graph view, say it looks like a brain, and move on.</p><div class="pg">7 pages</div></article><article><h3><a href="#06-agents/agent-roles">Agents</a></h3><p>Turning a one-off setup into a system that maintains itself.</p><div class="pg">6 pages</div></article><article><h3><a href="#07-retrieval/asking-questions">Retrieval</a></h3><p>How to actually ask your vault things and get answers worth trusting.</p><div class="pg">5 pages</div></article><article><h3><a href="#08-outputs/writing-from-the-vault">Outputs</a></h3><p>The vault earns its keep when things come out of it.</p><div class="pg">4 pages</div></article><article><h3><a href="#09-maintenance/lint-and-health">Maintenance</a></h3><p>What keeps the thing alive after the novelty wears off.</p><div class="pg">6 pages</div></article><article><h3><a href="#10-troubleshooting/common-failures">Troubleshooting</a></h3><p>Concrete failures, with fixes.</p><div class="pg">5 pages</div></article></div></template>

<script id="data" type="application/json">{"pages": [{"id": "01-concepts/what-is-a-second-brain", "path": "docs/01-concepts/what-is-a-second-brain.md", "section": "01-concepts", "section_title": "Concepts", "title": "What a second brain actually is", "html": "<p>One local folder of plain text that an agent reads and writes, holding what you\nhave read and understood, that you can ask questions.</p>\n<p>That is the whole definition. Everything else in this guide is detail about\nmaking it work.</p>\n<h2 id=\"what-it-is-not\">What it is not</h2>\n<p><strong>Not a prettier notes app.</strong> The point is not organisation. You can organise\nnotes beautifully and still never reopen them.</p>\n<p><strong>Not a chatbot with your PDFs attached.</strong> Attaching documents to a chat gets you\nanswers about those documents in that session. Nothing accumulates, nothing\nconnects, and next week you attach them again.</p>\n<p><strong>Not a memory feature.</strong> Assistants that remember facts about you are useful and\nare a different thing. This is a body of knowledge you own, that outlives any\nparticular tool.</p>\n<h2 id=\"the-three-jobs\">The three jobs</h2>\n<p><strong>Capture.</strong> Everything you read, watch and write down lands in one place with\nnear-zero friction. If capture takes effort, nothing else matters, because there\nwill be nothing to organise.</p>\n<p><strong>Connect.</strong> New material gets linked into what is already there. This is the job\nhumans stop doing after two weeks and the reason every previous note system\nfailed. It is also the entire value: unconnected notes are a folder.</p>\n<p><strong>Answer.</strong> You ask questions across everything at once, and get answers grounded\nin your own sources with citations you can open.</p>\n<h2 id=\"where-the-value-comes-from\">Where the value comes from</h2>\n<p>Not from any single page. A page is a slightly better version of a note you could\nhave written.</p>\n<p>It comes from density. At fifty sources, the vault starts connecting things you\nread months apart. At five hundred, it answers questions you could not have\nanswered yourself, because nobody holds five hundred sources in their head at\nonce.</p>\n<p>That is why the first two weeks feel underwhelming and why most people quit\nbefore the payoff. The system is not broken at thirty pages, it is just\nearly. See <a href=\"what-good-looks-like.md\">what good looks like</a> for a realistic\ntimeline.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"the-save-for-later-paradox.md\">The save-for-later paradox</a></p>", "headings": ["What it is not", "The three jobs", "Where the value comes from", "Next"], "words": 327, "text": "One local folder of plain text that an agent reads and writes, holding what you have read and understood, that you can ask questions. That is the whole definition. Everything else in this guide is detail about making it work. What it is not Not a prettier notes app. The point is not organisation. You can organise notes beautifully and still never reopen them. Not a chatbot with your PDFs attached. Attaching documents to a chat gets you answers about those documents in that session. Nothing accumulates, nothing connects, and next week you attach them again. Not a memory feature. Assistants that remember facts about you are useful and are a different thing. This is a body of knowledge you own, that outlives any particular tool. The three jobs Capture. Everything you read, watch and write down lands in one place with near-zero friction. If capture takes effort, nothing else matters, because there will be nothing to organise. Connect. New material gets linked into what is already there. This is the job humans stop doing after two weeks and the reason every previous note system failed. It is also the entire value: unconnected notes are a folder. Answer. You ask questions across everything at once, and get answers grounded in your own sources with citations you can open. Where the value comes from Not from any single page. A page is a slightly better version of a note you could have written. It comes from density. At fifty sources, the vault starts connecting things you read months apart. At five hundred, it answers questions you could not have answered yourself, because nobody holds five hundred sources in their head at once. That is why the first two weeks feel underwhelming and why most people quit before the payoff. The system is not broken at thirty pages, it is just early. See what good looks like what-good-looks-like.md for a realistic timeline. Next The save-for-later paradox the-save-for-later-paradox.md", "links": [{"to": "01-concepts/what-good-looks-like", "label": "what good looks like"}, {"to": "01-concepts/the-save-for-later-paradox", "label": "The save-for-later paradox"}]}, {"id": "01-concepts/the-save-for-later-paradox", "path": "docs/01-concepts/the-save-for-later-paradox.md", "section": "01-concepts", "section_title": "Concepts", "title": "The save-for-later paradox", "html": "<p>You screenshot the post. You bookmark the article. You save the video to a\nplaylist named \"watch later\" that has four hundred items in it.</p>\n<p>You do not go back. Almost nobody does.</p>\n<h2 id=\"why-saving-fails\">Why saving fails</h2>\n<p>Saving feels like an action, and it discharges the feeling that made you want to\nsave. The intention gets spent at the moment of saving rather than at the moment\nof reading, which is why the queue grows and the reading does not.</p>\n<p>Then retrieval costs more than it is worth. Finding the thing you saved means\nremembering that you saved it, remembering where, and searching wording you no\nlonger recall. Compared to a fresh search, the saved item loses, so you search\nagain and save again.</p>\n<p>And the pile itself becomes a deterrent. Four hundred unread items is not a\nresource, it is a debt you avoid looking at.</p>\n<h2 id=\"what-actually-changes-it\">What actually changes it</h2>\n<p>Not better tagging. Not a better read-later app. Not discipline, which is the\nthing that already failed.</p>\n<p>What changes it is removing the step you keep failing at. If the filing and\nconnecting happen without you, the queue stops being a queue: the material is\nalready processed, already linked, already reachable by asking a question in\nplain language.</p>\n<p>The retrieval cost inverts too. You no longer need to remember that you saved\nsomething, or where. You ask what you know about a topic, and things you had\nforgotten saving come back.</p>\n<h2 id=\"the-honest-limit\">The honest limit</h2>\n<p>The system does not make you read things. It processes what you feed it, and\nwhat you feed it is still your choice.</p>\n<p>What it does is make saving worth doing. That is a smaller claim than most\nsecond-brain pitches make, and it is the one that holds up after a month.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"llm-wiki-pattern.md\">The LLM wiki pattern</a></p>", "headings": ["Why saving fails", "What actually changes it", "The honest limit", "Next"], "words": 305, "text": "You screenshot the post. You bookmark the article. You save the video to a playlist named \"watch later\" that has four hundred items in it. You do not go back. Almost nobody does. Why saving fails Saving feels like an action, and it discharges the feeling that made you want to save. The intention gets spent at the moment of saving rather than at the moment of reading, which is why the queue grows and the reading does not. Then retrieval costs more than it is worth. Finding the thing you saved means remembering that you saved it, remembering where, and searching wording you no longer recall. Compared to a fresh search, the saved item loses, so you search again and save again. And the pile itself becomes a deterrent. Four hundred unread items is not a resource, it is a debt you avoid looking at. What actually changes it Not better tagging. Not a better read-later app. Not discipline, which is the thing that already failed. What changes it is removing the step you keep failing at. If the filing and connecting happen without you, the queue stops being a queue: the material is already processed, already linked, already reachable by asking a question in plain language. The retrieval cost inverts too. You no longer need to remember that you saved something, or where. You ask what you know about a topic, and things you had forgotten saving come back. The honest limit The system does not make you read things. It processes what you feed it, and what you feed it is still your choice. What it does is make saving worth doing. That is a smaller claim than most second-brain pitches make, and it is the one that holds up after a month. Next The LLM wiki pattern llm-wiki-pattern.md", "links": [{"to": "01-concepts/llm-wiki-pattern", "label": "The LLM wiki pattern"}]}, {"id": "01-concepts/llm-wiki-pattern", "path": "docs/01-concepts/llm-wiki-pattern.md", "section": "01-concepts", "section_title": "Concepts", "title": "The LLM wiki pattern", "html": "<p>The specific pattern this guide implements, published by Andrej Karpathy as a\ngist on 2026-04-04.</p>\n<p>The inversion in one sentence: instead of you maintaining notes and occasionally\nasking an AI about them, the AI maintains the wiki and you read it.</p>\n<h2 id=\"what-the-pattern-specifies\">What the pattern specifies</h2>\n<p><strong>The wiki is primary.</strong> Raw sources are an archive you keep and rarely open.\nThe wiki is what you and the agent both work from, written in plain language,\none idea per page, densely linked.</p>\n<p><strong>Compilation, not summarization.</strong> Each new source is integrated into existing\npages rather than added beside them as another summary. A page about a concept\nimproves as sources accumulate; it does not turn into a list of what each source\nsaid.</p>\n<p><strong>Three operations.</strong> Ingest brings new material in. Lint keeps the structure\nsound. Query answers from the wiki. Everything else is variation on those.</p>\n<h2 id=\"why-it-holds-up\">Why it holds up</h2>\n<p>Because it removes the one task that killed every previous system. Linking fifty\nnotes to each other every time you read a paper is genuinely boring work that\nhumans stop doing, and the wiki dies when the maintainer gets tired.</p>\n<p>The other reason is that it needs no infrastructure. Markdown files, wikilinks,\nan agent that can read and write files. No database, no index to keep fresh, no\nservice to depend on.</p>\n<h2 id=\"where-the-gist-stops\">Where the gist stops</h2>\n<p>It describes intent, not implementation. Integrate new sources, lint\nperiodically, treat the wiki as primary.</p>\n<p>The mechanics are left open, which is why every implementation of it differs.\nHow integration handles contradictions, what a page must contain, when lint\nruns, who the wiki is written for. This guide's answers to those are in\n<a href=\"../04-structuring/README.md\">Structuring</a>, and they are opinions, not the\npattern itself.</p>\n<h2 id=\"what-people-build-on-top\">What people build on top</h2>\n<p>The common extensions are a journal layer, a project layer, and scheduled\nautomation. This guide covers the second and third as <a href=\"two-layers.md\">the two\nlayers</a> and <a href=\"../06-agents/README.md\">Agents</a>.</p>\n<p>The pattern also spread quickly because the primitives are ordinary: anyone with\nan agent and a folder can run it, and the implementations are all readable\nmarkdown. See <a href=\"../../resources/skills.md\">resources</a> for the ones worth reading.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"two-layers.md\">The two layers</a></p>", "headings": ["What the pattern specifies", "Why it holds up", "Where the gist stops", "What people build on top", "Next"], "words": 359, "text": "The specific pattern this guide implements, published by Andrej Karpathy as a gist on 2026-04-04. The inversion in one sentence: instead of you maintaining notes and occasionally asking an AI about them, the AI maintains the wiki and you read it. What the pattern specifies The wiki is primary. Raw sources are an archive you keep and rarely open. The wiki is what you and the agent both work from, written in plain language, one idea per page, densely linked. Compilation, not summarization. Each new source is integrated into existing pages rather than added beside them as another summary. A page about a concept improves as sources accumulate; it does not turn into a list of what each source said. Three operations. Ingest brings new material in. Lint keeps the structure sound. Query answers from the wiki. Everything else is variation on those. Why it holds up Because it removes the one task that killed every previous system. Linking fifty notes to each other every time you read a paper is genuinely boring work that humans stop doing, and the wiki dies when the maintainer gets tired. The other reason is that it needs no infrastructure. Markdown files, wikilinks, an agent that can read and write files. No database, no index to keep fresh, no service to depend on. Where the gist stops It describes intent, not implementation. Integrate new sources, lint periodically, treat the wiki as primary. The mechanics are left open, which is why every implementation of it differs. How integration handles contradictions, what a page must contain, when lint runs, who the wiki is written for. This guide's answers to those are in Structuring ../04-structuring/README.md , and they are opinions, not the pattern itself. What people build on top The common extensions are a journal layer, a project layer, and scheduled automation. This guide covers the second and third as the two layers two-layers.md and Agents ../06-agents/README.md . The pattern also spread quickly because the primitives are ordinary: anyone with an agent and a folder can run it, and the implementations are all readable markdown. See resources ../../resources/skills.md for the ones worth reading. Next The two layers two-layers.md", "links": [{"to": "01-concepts/two-layers", "label": "the two\nlayers"}, {"to": "01-concepts/two-layers", "label": "The two layers"}]}, {"id": "01-concepts/two-layers", "path": "docs/01-concepts/two-layers.md", "section": "01-concepts", "section_title": "Concepts", "title": "The two layers", "html": "<p>Most second-brain setups fail because they pick one shape and try to make it do\ntwo jobs.</p>\n<p><strong>The knowledge layer</strong> answers \"what do I know about X\". It is organised by\nidea, it grows forever, and its value is in the links between pages. This is the\nLLM wiki pattern: sources in, concepts out, everything connected.</p>\n<p><strong>The project layer</strong> answers \"what am I doing this week\". It is organised as a\npipeline, inputs to outputs, and most of it goes cold the moment the project\nships.</p>\n<p>They fail differently when merged. A wiki with project folders in it fills up\nwith dead task lists that make every search worse. A project system with\nconceptual notes in it buries the working files under material nobody opens\nwhile working.</p>\n<h2 id=\"how-they-connect\">How they connect</h2>\n<p>Projects consume the knowledge layer and feed it back:</p>\n<pre><code>        wiki/concepts \u2500\u2500\u2500\u2500\u2500\u2500&gt; project Inputs/\n              \u25b2                      \u2502\n              \u2502                      \u25bc\n        ingest what                Process/ \u2500\u2500&gt; Outputs/\n        you learned                              \u2502\n              \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<p>Work produces material worth keeping. Ingesting your own finished work is the\nstep almost everyone skips, and it is the one that makes the second project in\na domain meaningfully faster than the first.</p>\n<h2 id=\"which-to-build-first\">Which to build first</h2>\n<p>The knowledge layer, if you read a lot and retain little.</p>\n<p>The project layer, if your problem is that you re-explain your situation to a\nchat window every morning.</p>\n<p>Both eventually. See <a href=\"../02-setup/vault-structure.md\">vault structure</a> for the\nlayout that keeps them separate inside one folder.</p>", "headings": ["How they connect", "Which to build first"], "words": 242, "text": "Most second-brain setups fail because they pick one shape and try to make it do two jobs. The knowledge layer answers \"what do I know about X\". It is organised by idea, it grows forever, and its value is in the links between pages. This is the LLM wiki pattern: sources in, concepts out, everything connected. The project layer answers \"what am I doing this week\". It is organised as a pipeline, inputs to outputs, and most of it goes cold the moment the project ships. They fail differently when merged. A wiki with project folders in it fills up with dead task lists that make every search worse. A project system with conceptual notes in it buries the working files under material nobody opens while working. How they connect Projects consume the knowledge layer and feed it back: wiki/concepts \u2500\u2500\u2500\u2500\u2500\u2500 project Inputs/ \u25b2 \u2502 \u2502 \u25bc ingest what Process/ \u2500\u2500 Outputs/ you learned \u2502 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 Work produces material worth keeping. Ingesting your own finished work is the step almost everyone skips, and it is the one that makes the second project in a domain meaningfully faster than the first. Which to build first The knowledge layer, if you read a lot and retain little. The project layer, if your problem is that you re-explain your situation to a chat window every morning. Both eventually. See vault structure ../02-setup/vault-structure.md for the layout that keeps them separate inside one folder.", "links": [{"to": "02-setup/vault-structure", "label": "vault structure"}]}, {"id": "01-concepts/why-markdown-and-plain-text", "path": "docs/01-concepts/why-markdown-and-plain-text.md", "section": "01-concepts", "section_title": "Concepts", "title": "Why markdown and plain text", "html": "<p>The format looks like a detail. It decides whether the system works.</p>\n<h2 id=\"agents-handle-files-better-than-apis\">Agents handle files better than APIs</h2>\n<p>An agent reading a folder does what it is best at: reading text and writing text.\nNo schema to learn, no API to call correctly, no failure mode where a request\nhalf-succeeds.</p>\n<p>That reliability compounds over thousands of operations. A pipeline that writes\nmarkdown files fails in ways you can see in a diff; one that writes through an\nAPI fails in ways you find out about later.</p>\n<h2 id=\"portability-is-not-theoretical\">Portability is not theoretical</h2>\n<p>Every previous notes tool people trusted either shut down, changed pricing, or\nmade export deliberately awkward.</p>\n<p>Plain files remove the question. Your vault opens in any text editor, syncs with\nany tool, and works with any agent that reads files. Switch models, switch\neditors, switch operating systems, and the vault is unaffected because it was\nnever in anything.</p>\n<p>This matters more than usual here, because a second brain accumulates value over\nyears. A format that traps you is a format that eventually costs you the whole\nthing.</p>\n<h2 id=\"wikilinks-as-a-graph-format\">Wikilinks as a graph format</h2>\n<p><code>[[Page name]]</code> is a two-character convention that produces a real graph, is\nreadable as text, and survives every tool that does not understand it, because\nin the worst case it is still just words in a sentence.</p>\n<p>You can parse it with a regex, which is what <code>scripts/graph_export.py</code> does. Try\nthat with a proprietary block reference format.</p>\n<h2 id=\"git-works-on-it\">Git works on it</h2>\n<p>Text diffs. That single property is what makes an agent safe to run unattended:\nevery change it makes is reviewable, revertible, and attributable to a run.</p>\n<p>Binary formats and database-backed apps give you no equivalent. You either trust\nthe automation completely or you do not automate.</p>\n<h2 id=\"the-limits\">The limits</h2>\n<p>Plain text is bad at a few things, and pretending otherwise is how people end up\nfrustrated.</p>\n<p><strong>Structured queries at scale.</strong> Dataview covers a lot, but past a few thousand\npages, relational questions want a real database. Export the graph rather than\nabandoning markdown; see <a href=\"../05-graphs/exporting-your-graph.md\">exporting the\ngraph</a>.</p>\n<p><strong>Rich media.</strong> Images live beside the text as files, not in it. Diagrams are\nattachments.</p>\n<p><strong>Concurrent editing.</strong> Two agents writing the same file conflict in the way\nfiles conflict, which is to say badly.</p>\n<p>None of those outweigh portability for a personal vault. All of them are worth\nknowing before you hit them.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"pkm-lineage.md\">Zettelkasten, PARA, evergreen notes</a></p>", "headings": ["Agents handle files better than APIs", "Portability is not theoretical", "Wikilinks as a graph format", "Git works on it", "The limits", "Next"], "words": 403, "text": "The format looks like a detail. It decides whether the system works. Agents handle files better than APIs An agent reading a folder does what it is best at: reading text and writing text. No schema to learn, no API to call correctly, no failure mode where a request half-succeeds. That reliability compounds over thousands of operations. A pipeline that writes markdown files fails in ways you can see in a diff; one that writes through an API fails in ways you find out about later. Portability is not theoretical Every previous notes tool people trusted either shut down, changed pricing, or made export deliberately awkward. Plain files remove the question. Your vault opens in any text editor, syncs with any tool, and works with any agent that reads files. Switch models, switch editors, switch operating systems, and the vault is unaffected because it was never in anything. This matters more than usual here, because a second brain accumulates value over years. A format that traps you is a format that eventually costs you the whole thing. Wikilinks as a graph format Page name is a two-character convention that produces a real graph, is readable as text, and survives every tool that does not understand it, because in the worst case it is still just words in a sentence. You can parse it with a regex, which is what scripts/graph_export.py does. Try that with a proprietary block reference format. Git works on it Text diffs. That single property is what makes an agent safe to run unattended: every change it makes is reviewable, revertible, and attributable to a run. Binary formats and database-backed apps give you no equivalent. You either trust the automation completely or you do not automate. The limits Plain text is bad at a few things, and pretending otherwise is how people end up frustrated. Structured queries at scale. Dataview covers a lot, but past a few thousand pages, relational questions want a real database. Export the graph rather than abandoning markdown; see exporting the graph ../05-graphs/exporting-your-graph.md . Rich media. Images live beside the text as files, not in it. Diagrams are attachments. Concurrent editing. Two agents writing the same file conflict in the way files conflict, which is to say badly. None of those outweigh portability for a personal vault. All of them are worth knowing before you hit them. Next Zettelkasten, PARA, evergreen notes pkm-lineage.md", "links": [{"to": "05-graphs/exporting-your-graph", "label": "exporting the\ngraph"}, {"to": "01-concepts/pkm-lineage", "label": "Zettelkasten, PARA, evergreen notes"}]}, {"id": "01-concepts/pkm-lineage", "path": "docs/01-concepts/pkm-lineage.md", "section": "01-concepts", "section_title": "Concepts", "title": "Zettelkasten, PARA, evergreen notes", "html": "<p>None of this is new. The methods people abandoned were mostly right, and it is\nworth knowing which parts of them still apply, because the good ideas came with a\ncost that has now changed.</p>\n<h2 id=\"zettelkasten\">Zettelkasten</h2>\n<p>Niklas Luhmann's slip-box, popularised for a modern audience by S\u00f6nke Ahrens in\n\"How to Take Smart Notes\". Atomic notes, one idea each, densely cross-referenced,\nwritten in your own words.</p>\n<p><strong>Still right:</strong> atomic notes, dense linking, rewriting in your own words rather\nthan clipping quotes. All three are in this guide's <a href=\"../04-structuring/README.md\">structuring\nrules</a>.</p>\n<p><strong>The cost:</strong> every link was manual. Reading one paper meant deciding where it\nconnected among hundreds of existing notes, which is real cognitive work and the\nreason most slip-boxes die in month three.</p>\n<h2 id=\"para\">PARA</h2>\n<p>Tiago Forte's system from \"Building a Second Brain\": Projects, Areas, Resources,\nArchive. Organise by actionability rather than by subject.</p>\n<p><strong>Still right:</strong> the insight that project material and reference material want\ndifferent structures. That is exactly <a href=\"two-layers.md\">the two layers</a>, arrived at\nfrom a different direction.</p>\n<p><strong>The cost:</strong> constant filing decisions, and the fact that actionability changes,\nso the same note moves between categories over time.</p>\n<h2 id=\"evergreen-notes\">Evergreen notes</h2>\n<p>Andy Matuschak's approach: notes written to be reread and improved over years,\nconcept-oriented, densely linked, developed slowly.</p>\n<p><strong>Still right:</strong> the standard for what a good concept page is. Matuschak's\nargument that notes should be written for your future self, not as a record of\nhaving read something, is the bar this guide's concept pages aim at.</p>\n<p><strong>The counterweight:</strong> his position is that the writing is the thinking, and\ndelegating it means not doing the thinking. That is a real objection to this\nwhole approach and worth sitting with rather than dismissing.</p>\n<h2 id=\"what-changed\">What changed</h2>\n<p>One thing: the maintenance is now delegable.</p>\n<p>Every system above works. Every one of them failed for the same reason, which is\nthat they required a human to do boring linking work forever. An agent doing it\ndoes not get tired in month three.</p>\n<h2 id=\"what-did-not-change\">What did not change</h2>\n<p>You still have to choose what to read. You still have to decide what matters.\nThe agent files and connects; it does not have taste, and a vault fed\nindiscriminately is a well-organised pile.</p>\n<p>And Matuschak's objection stands: understanding comes from writing. The way to\nkeep it is to write the concept pages that matter to you yourself, and let the\nagent handle sources, entities and the linking. That split is a preference this\nguide does not enforce, and it is worth deciding deliberately rather than by\ndefault.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"wiki-vs-rag.md\">Wiki vs RAG</a></p>", "headings": ["Zettelkasten", "PARA", "Evergreen notes", "What changed", "What did not change", "Next"], "words": 427, "text": "None of this is new. The methods people abandoned were mostly right, and it is worth knowing which parts of them still apply, because the good ideas came with a cost that has now changed. Zettelkasten Niklas Luhmann's slip-box, popularised for a modern audience by S\u00f6nke Ahrens in \"How to Take Smart Notes\". Atomic notes, one idea each, densely cross-referenced, written in your own words. Still right: atomic notes, dense linking, rewriting in your own words rather than clipping quotes. All three are in this guide's structuring rules ../04-structuring/README.md . The cost: every link was manual. Reading one paper meant deciding where it connected among hundreds of existing notes, which is real cognitive work and the reason most slip-boxes die in month three. PARA Tiago Forte's system from \"Building a Second Brain\": Projects, Areas, Resources, Archive. Organise by actionability rather than by subject. Still right: the insight that project material and reference material want different structures. That is exactly the two layers two-layers.md , arrived at from a different direction. The cost: constant filing decisions, and the fact that actionability changes, so the same note moves between categories over time. Evergreen notes Andy Matuschak's approach: notes written to be reread and improved over years, concept-oriented, densely linked, developed slowly. Still right: the standard for what a good concept page is. Matuschak's argument that notes should be written for your future self, not as a record of having read something, is the bar this guide's concept pages aim at. The counterweight: his position is that the writing is the thinking, and delegating it means not doing the thinking. That is a real objection to this whole approach and worth sitting with rather than dismissing. What changed One thing: the maintenance is now delegable. Every system above works. Every one of them failed for the same reason, which is that they required a human to do boring linking work forever. An agent doing it does not get tired in month three. What did not change You still have to choose what to read. You still have to decide what matters. The agent files and connects; it does not have taste, and a vault fed indiscriminately is a well-organised pile. And Matuschak's objection stands: understanding comes from writing. The way to keep it is to write the concept pages that matter to you yourself, and let the agent handle sources, entities and the linking. That split is a preference this guide does not enforce, and it is worth deciding deliberately rather than by default. Next Wiki vs RAG wiki-vs-rag.md", "links": [{"to": "01-concepts/two-layers", "label": "the two layers"}, {"to": "01-concepts/wiki-vs-rag", "label": "Wiki vs RAG"}]}, {"id": "01-concepts/wiki-vs-rag", "path": "docs/01-concepts/wiki-vs-rag.md", "section": "01-concepts", "section_title": "Concepts", "title": "Wiki vs RAG", "html": "<p>The default advice for asking questions of your own documents is to embed them\nin a vector database. This guide does something else, and the reason is\nstructural rather than a preference about tools.</p>\n<h2 id=\"the-two-approaches\">The two approaches</h2>\n<p><strong>RAG</strong> stores your documents as chunks with embeddings. A question retrieves the\nmost similar chunks and the model answers from them. Nothing is written; the\ncorpus stays as it was.</p>\n<p><strong>A wiki</strong> processes documents once, into pages an agent wrote and linked.\nQuestions are answered by navigating those pages. The corpus is transformed and\nkeeps improving.</p>\n<p>The difference is where the work happens. RAG does it at query time, every time,\nfrom scratch. A wiki does it once, at ingest, and the result is reused.</p>\n<h2 id=\"what-that-buys\">What that buys</h2>\n<p><strong>Understanding accumulates.</strong> The tenth source about a topic improves the page\nthe first nine built. In RAG, the tenth document is just another chunk, and\nnothing gets better as the corpus grows, only larger.</p>\n<p><strong>Contradictions are visible.</strong> Two documents disagreeing produce two chunks that\nmay never be retrieved together. On a page, the disagreement is written down,\ndated, and unavoidable.</p>\n<p><strong>Answers are checkable.</strong> The page cites sources you can open. Retrieved chunks\nare fragments without the reasoning that connected them.</p>\n<p><strong>No infrastructure.</strong> No index, no re-embedding, no drift between the store and\nthe files.</p>\n<h2 id=\"what-it-costs\">What it costs</h2>\n<p><strong>Ingest is expensive.</strong> Writing and linking pages costs model time up front,\nwhere RAG's ingest is nearly free.</p>\n<p><strong>Quality depends on the ingest.</strong> A bad page contract produces a bad vault, and\nyou find out later. RAG's failures are at query time and are more visible.</p>\n<p><strong>Recall depends on linking.</strong> A page nobody linked is a page the graph cannot\nreach. RAG will find it by similarity regardless.</p>\n<h2 id=\"the-honest-position\">The honest position</h2>\n<p>This trade is right for a personal, curated corpus of a few thousand pages and\nwrong for a million documents nobody organised.</p>\n<p>Which is to say it is right for a second brain and wrong for a search product,\nand most advice about RAG is written for the second case. See <a href=\"../07-retrieval/rag-on-top.md\">adding RAG when\nyou need it</a> for the threshold where the answer\nflips, and <a href=\"../05-graphs/graph-vs-vectors.md\">graph vs embeddings</a> for the\nretrieval mechanics.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"what-good-looks-like.md\">What good looks like</a></p>", "headings": ["The two approaches", "What that buys", "What it costs", "The honest position", "Next"], "words": 375, "text": "The default advice for asking questions of your own documents is to embed them in a vector database. This guide does something else, and the reason is structural rather than a preference about tools. The two approaches RAG stores your documents as chunks with embeddings. A question retrieves the most similar chunks and the model answers from them. Nothing is written; the corpus stays as it was. A wiki processes documents once, into pages an agent wrote and linked. Questions are answered by navigating those pages. The corpus is transformed and keeps improving. The difference is where the work happens. RAG does it at query time, every time, from scratch. A wiki does it once, at ingest, and the result is reused. What that buys Understanding accumulates. The tenth source about a topic improves the page the first nine built. In RAG, the tenth document is just another chunk, and nothing gets better as the corpus grows, only larger. Contradictions are visible. Two documents disagreeing produce two chunks that may never be retrieved together. On a page, the disagreement is written down, dated, and unavoidable. Answers are checkable. The page cites sources you can open. Retrieved chunks are fragments without the reasoning that connected them. No infrastructure. No index, no re-embedding, no drift between the store and the files. What it costs Ingest is expensive. Writing and linking pages costs model time up front, where RAG's ingest is nearly free. Quality depends on the ingest. A bad page contract produces a bad vault, and you find out later. RAG's failures are at query time and are more visible. Recall depends on linking. A page nobody linked is a page the graph cannot reach. RAG will find it by similarity regardless. The honest position This trade is right for a personal, curated corpus of a few thousand pages and wrong for a million documents nobody organised. Which is to say it is right for a second brain and wrong for a search product, and most advice about RAG is written for the second case. See adding RAG when you need it ../07-retrieval/rag-on-top.md for the threshold where the answer flips, and graph vs embeddings ../05-graphs/graph-vs-vectors.md for the retrieval mechanics. Next What good looks like what-good-looks-like.md", "links": [{"to": "07-retrieval/rag-on-top", "label": "adding RAG when\nyou need it"}, {"to": "05-graphs/graph-vs-vectors", "label": "graph vs embeddings"}, {"to": "01-concepts/what-good-looks-like", "label": "What good looks like"}]}, {"id": "01-concepts/what-good-looks-like", "path": "docs/01-concepts/what-good-looks-like.md", "section": "01-concepts", "section_title": "Concepts", "title": "What good looks like", "html": "<p>Concrete criteria, so you can tell whether yours is working rather than guessing.</p>\n<h2 id=\"the-test\">The test</h2>\n<p>Ask it something you half-remember reading about, months ago, that you cannot\nname precisely.</p>\n<p>If it comes back with the idea, the sources, and two related things you had\nforgotten, it works. If it returns nothing, or returns a general explanation that\ncould have come from any model, it does not.</p>\n<h2 id=\"signals-of-health\">Signals of health</h2>\n<p><strong>You reach for it before searching the web.</strong> The strongest signal, and it\nhappens on its own once the vault is dense enough.</p>\n<p><strong>Answers cite pages you can open,</strong> and the pages say what the answer said.</p>\n<p><strong>The graph has clusters you did not plan.</strong> Evidence it is tracking what you\nactually pay attention to rather than what you told it to.</p>\n<p><strong>New sources mostly update existing pages</strong> rather than creating new ones. That\nmeans the vault has the concepts already and is deepening rather than sprawling.</p>\n<p><strong>It contradicts you occasionally,</strong> because you have material on both sides of\nsomething.</p>\n<h2 id=\"signals-of-trouble\">Signals of trouble</h2>\n<p><strong>Orphan rate climbing.</strong> Ingestion has stopped linking. See\n<a href=\"../05-graphs/metrics.md\">metrics</a>.</p>\n<p><strong>Pages that read as summaries</strong> rather than explanations. The page contract in\n<code>CLAUDE.md</code> needs tightening.</p>\n<p><strong>Concept pages untouched for months while sources keep arriving.</strong> New material\nis landing in new pages instead of updating existing ones, which produces four\npages about one thing.</p>\n<p><strong>You stopped opening it.</strong> The honest one. Usually means capture broke, not that\nthe idea failed.</p>\n<h2 id=\"a-realistic-timeline\">A realistic timeline</h2>\n<p><strong>Week one.</strong> Setup, ten or twenty sources. Feels like a folder with extra steps.\nThis is normal and it is where most people quit.</p>\n<p><strong>Week two to four.</strong> Fifty to a hundred sources. First moment of the vault\nconnecting two things you read weeks apart. This is when it starts being worth\nthe setup.</p>\n<p><strong>Month three.</strong> A few hundred pages. It answers questions faster than you could\nby rereading, and it surfaces things you had forgotten saving.</p>\n<p><strong>Month six.</strong> It knows things you do not remember learning. That is the state\neveryone describes as the payoff, and it is real, and it takes six months of\nfeeding it.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"../02-setup/README.md\">Setup</a>.</p>", "headings": ["The test", "Signals of health", "Signals of trouble", "A realistic timeline", "Next"], "words": 358, "text": "Concrete criteria, so you can tell whether yours is working rather than guessing. The test Ask it something you half-remember reading about, months ago, that you cannot name precisely. If it comes back with the idea, the sources, and two related things you had forgotten, it works. If it returns nothing, or returns a general explanation that could have come from any model, it does not. Signals of health You reach for it before searching the web. The strongest signal, and it happens on its own once the vault is dense enough. Answers cite pages you can open, and the pages say what the answer said. The graph has clusters you did not plan. Evidence it is tracking what you actually pay attention to rather than what you told it to. New sources mostly update existing pages rather than creating new ones. That means the vault has the concepts already and is deepening rather than sprawling. It contradicts you occasionally, because you have material on both sides of something. Signals of trouble Orphan rate climbing. Ingestion has stopped linking. See metrics ../05-graphs/metrics.md . Pages that read as summaries rather than explanations. The page contract in CLAUDE.md needs tightening. Concept pages untouched for months while sources keep arriving. New material is landing in new pages instead of updating existing ones, which produces four pages about one thing. You stopped opening it. The honest one. Usually means capture broke, not that the idea failed. A realistic timeline Week one. Setup, ten or twenty sources. Feels like a folder with extra steps. This is normal and it is where most people quit. Week two to four. Fifty to a hundred sources. First moment of the vault connecting two things you read weeks apart. This is when it starts being worth the setup. Month three. A few hundred pages. It answers questions faster than you could by rereading, and it surfaces things you had forgotten saving. Month six. It knows things you do not remember learning. That is the state everyone describes as the payoff, and it is real, and it takes six months of feeding it. Next Setup ../02-setup/README.md .", "links": [{"to": "05-graphs/metrics", "label": "metrics"}]}, {"id": "02-setup/obsidian-install-and-vault", "path": "docs/02-setup/obsidian-install-and-vault.md", "section": "02-setup", "section_title": "Setup", "title": "Obsidian and your first vault", "html": "<p>Obsidian is the storage half of the system. It is free, it keeps everything as\nplain text files on your own machine, and it renders the links between notes as\na graph. Nothing here is stored in a company's cloud, and the files stay\nreadable in any text editor if you ever walk away from the app.</p>\n<h2 id=\"install\">Install</h2>\n<p>Download from <a href=\"https://obsidian.md\">obsidian.md</a> and install it.</p>\n<p>On the welcome screen, click <strong>Create new vault</strong>. Name it something short you\nwill type often, <code>brain</code> works. Pick a folder on your machine and click\n<strong>Create</strong>.</p>\n<p>That folder is now your second brain. Everything the agent writes lands there\nas markdown files.</p>\n<h2 id=\"make-one-note-by-hand\">Make one note by hand</h2>\n<p>Do this once before automating anything, so the mechanic is not abstract.</p>\n<p>Click the new-note icon, type a sentence, then type <code>[[goals]]</code>. The bracketed\nword becomes a link to a page called <code>goals</code>, whether or not that page exists\nyet. Click it and Obsidian creates the page.</p>\n<p>That is the entire data model: notes pointing at notes. Everything the agent\ndoes later is this, at volume, without you doing it.</p>\n<h2 id=\"where-to-put-the-vault\">Where to put the vault</h2>\n<p>Somewhere with a stable path you can type from a terminal. Avoid a folder your\ncloud sync client rewrites aggressively, because an agent writing files while a\nsync client rewrites them produces conflict copies that are genuinely painful\nto untangle. See <a href=\"git-and-sync.md\">git and sync</a> for the options that work.</p>\n<p>Avoid spaces in the folder name. You will be pasting this path into commands.</p>\n<h2 id=\"settings-worth-changing-now\">Settings worth changing now</h2>\n<ul>\n<li><strong>Files and links \u2192 New link format:</strong> relative path or shortest path,\n  consistently. Mixed link formats are the most common cause of broken links\n  after a rename.</li>\n<li><strong>Files and links \u2192 Automatically update internal links:</strong> on.</li>\n<li><strong>Editor \u2192 Show frontmatter:</strong> on. You want to see the metadata the agent\n  writes, at least for the first weeks.</li>\n</ul>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"claude-code-setup.md\">Claude Code in the vault</a></p>", "headings": ["Install", "Make one note by hand", "Where to put the vault", "Settings worth changing now", "Next"], "words": 324, "text": "Obsidian is the storage half of the system. It is free, it keeps everything as plain text files on your own machine, and it renders the links between notes as a graph. Nothing here is stored in a company's cloud, and the files stay readable in any text editor if you ever walk away from the app. Install Download from obsidian.md https://obsidian.md and install it. On the welcome screen, click Create new vault . Name it something short you will type often, brain works. Pick a folder on your machine and click Create . That folder is now your second brain. Everything the agent writes lands there as markdown files. Make one note by hand Do this once before automating anything, so the mechanic is not abstract. Click the new-note icon, type a sentence, then type goals . The bracketed word becomes a link to a page called goals , whether or not that page exists yet. Click it and Obsidian creates the page. That is the entire data model: notes pointing at notes. Everything the agent does later is this, at volume, without you doing it. Where to put the vault Somewhere with a stable path you can type from a terminal. Avoid a folder your cloud sync client rewrites aggressively, because an agent writing files while a sync client rewrites them produces conflict copies that are genuinely painful to untangle. See git and sync git-and-sync.md for the options that work. Avoid spaces in the folder name. You will be pasting this path into commands. Settings worth changing now - Files and links \u2192 New link format: relative path or shortest path, consistently. Mixed link formats are the most common cause of broken links after a rename. - Files and links \u2192 Automatically update internal links: on. - Editor \u2192 Show frontmatter: on. You want to see the metadata the agent writes, at least for the first weeks. Next Claude Code in the vault claude-code-setup.md", "links": [{"to": "02-setup/git-and-sync", "label": "git and sync"}, {"to": "02-setup/claude-code-setup", "label": "Claude Code in the vault"}]}, {"id": "02-setup/claude-code-setup", "path": "docs/02-setup/claude-code-setup.md", "section": "02-setup", "section_title": "Setup", "title": "Claude Code in the vault", "html": "<p>Claude Code is the half that reads and writes. Two ways to run it, and the\nchoice only affects where you type, not what happens.</p>\n<h2 id=\"option-a-the-desktop-app\">Option A: the desktop app</h2>\n<p>Download Claude Desktop from <a href=\"https://claude.com/download\">claude.com/download</a>\nand sign in. The app has a <strong>Code</strong> tab, which is Claude Code without a\nterminal. If you have never used a command line, start here.</p>\n<h2 id=\"option-b-the-terminal\">Option B: the terminal</h2>\n<p>Install Claude Code and run <code>claude</code> from inside the vault folder:</p>\n<pre><code class=\"language-bash\">cd ~/brain\nclaude\n</code></pre>\n<p>Started this way, the agent reads and writes the vault directly through the\nfilesystem, with no plugin and no MCP server involved. This is the simplest\npossible setup and it is enough for everything in the ingestion, structuring\nand retrieval sections of this guide.</p>\n<p>Installation instructions for each platform are in the <a href=\"https://code.claude.com/docs/en/setup\">official setup\ndocs</a>.</p>\n<h2 id=\"option-c-inside-obsidian\">Option C: inside Obsidian</h2>\n<p>Community plugins now embed the agent in the editor, and they are heavily used:\n<a href=\"https://github.com/yishentu/claudian\">Claudian</a> sits above two million installs\nand <a href=\"https://github.com/logancyang/obsidian-copilot\">Copilot</a> is close behind.\nBoth run Claude Code, Codex or a local agent in a pane next to your notes.</p>\n<p>Worth knowing about because it removes the window switching entirely. Worth\nbeing careful with for the same reason this guide keeps ingestion on a\nschedule: an agent in the editor invites ad-hoc edits that never make it into\n<code>log.md</code>, and an unlogged vault is one you cannot audit.</p>\n<p>A reasonable split is the plugin for conversation and drafting, the terminal or\na scheduled task for anything that writes wiki pages.</p>\n<h2 id=\"plan-requirement\">Plan requirement</h2>\n<p>Claude Code needs a paid account: Pro, Max, Team, Enterprise, or a Console\naccount billed per token. The free Claude.ai plan does not include Claude Code\naccess, per Anthropic's own setup documentation. If the Code tab prompts you to\nupgrade, that is why.</p>\n<h2 id=\"filesystem-or-mcp\">Filesystem or MCP</h2>\n<p>Both work. The difference is narrow and worth knowing before you pick:</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Filesystem</th>\n<th>MCP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Setup</td>\n<td>none, just <code>cd</code> into the vault</td>\n<td>plugin plus a config command</td>\n</tr>\n<tr>\n<td>Obsidian open</td>\n<td>not required</td>\n<td>required, the plugin serves the API</td>\n</tr>\n<tr>\n<td>Scope</td>\n<td>whatever folder you started in</td>\n<td>the whole vault, from anywhere</td>\n</tr>\n<tr>\n<td>Failure mode</td>\n<td>none to speak of</td>\n<td>plugin off, app closed, wrong port</td>\n</tr>\n</tbody>\n</table>\n<p>Start on the filesystem. Move to <a href=\"mcp-obsidian.md\">MCP</a> when you want the agent\nto reach the vault from sessions that are not running inside it, which mostly\nmatters once you add scheduled tasks.</p>\n<h2 id=\"first-run\">First run</h2>\n<p>Point it at the structure before asking for anything else:</p>\n<pre><code>Read CLAUDE.md and wiki/index.md, then tell me what this vault currently\ncontains and what is missing.\n</code></pre>\n<p>The answer tells you immediately whether the agent understood its instructions.\nIf it starts inventing a structure you did not ask for, your <code>CLAUDE.md</code> is too\nvague. See <a href=\"claude-md.md\">writing your CLAUDE.md</a>.</p>\n<h2 id=\"permissions\">Permissions</h2>\n<p>The agent will ask before editing files. Grant it write access to the vault and\nnothing else. Do not grant blanket shell access on a folder that holds anything\nyou cannot lose, and read <a href=\"../06-agents/safety-and-guardrails.md\">guardrails</a>\nbefore you automate anything on a schedule.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"mcp-obsidian.md\">MCP for Obsidian</a></p>", "headings": ["Option A: the desktop app", "Option B: the terminal", "Option C: inside Obsidian", "Plan requirement", "Filesystem or MCP", "First run", "Permissions", "Next"], "words": 527, "text": "Claude Code is the half that reads and writes. Two ways to run it, and the choice only affects where you type, not what happens. Option A: the desktop app Download Claude Desktop from claude.com/download https://claude.com/download and sign in. The app has a Code tab, which is Claude Code without a terminal. If you have never used a command line, start here. Option B: the terminal Install Claude Code and run claude from inside the vault folder: bash cd ~/brain claude Started this way, the agent reads and writes the vault directly through the filesystem, with no plugin and no MCP server involved. This is the simplest possible setup and it is enough for everything in the ingestion, structuring and retrieval sections of this guide. Installation instructions for each platform are in the official setup docs https://code.claude.com/docs/en/setup . Option C: inside Obsidian Community plugins now embed the agent in the editor, and they are heavily used: Claudian https://github.com/yishentu/claudian sits above two million installs and Copilot https://github.com/logancyang/obsidian-copilot is close behind. Both run Claude Code, Codex or a local agent in a pane next to your notes. Worth knowing about because it removes the window switching entirely. Worth being careful with for the same reason this guide keeps ingestion on a schedule: an agent in the editor invites ad-hoc edits that never make it into log.md , and an unlogged vault is one you cannot audit. A reasonable split is the plugin for conversation and drafting, the terminal or a scheduled task for anything that writes wiki pages. Plan requirement Claude Code needs a paid account: Pro, Max, Team, Enterprise, or a Console account billed per token. The free Claude.ai plan does not include Claude Code access, per Anthropic's own setup documentation. If the Code tab prompts you to upgrade, that is why. Filesystem or MCP Both work. The difference is narrow and worth knowing before you pick: | | Filesystem | MCP | |---|---|---| | Setup | none, just cd into the vault | plugin plus a config command | | Obsidian open | not required | required, the plugin serves the API | | Scope | whatever folder you started in | the whole vault, from anywhere | | Failure mode | none to speak of | plugin off, app closed, wrong port | Start on the filesystem. Move to MCP mcp-obsidian.md when you want the agent to reach the vault from sessions that are not running inside it, which mostly matters once you add scheduled tasks. First run Point it at the structure before asking for anything else: Read CLAUDE.md and wiki/index.md, then tell me what this vault currently contains and what is missing. The answer tells you immediately whether the agent understood its instructions. If it starts inventing a structure you did not ask for, your CLAUDE.md is too vague. See writing your CLAUDE.md claude-md.md . Permissions The agent will ask before editing files. Grant it write access to the vault and nothing else. Do not grant blanket shell access on a folder that holds anything you cannot lose, and read guardrails ../06-agents/safety-and-guardrails.md before you automate anything on a schedule. Next MCP for Obsidian mcp-obsidian.md", "links": [{"to": "02-setup/mcp-obsidian", "label": "MCP"}, {"to": "02-setup/claude-md", "label": "writing your CLAUDE.md"}, {"to": "06-agents/safety-and-guardrails", "label": "guardrails"}, {"to": "02-setup/mcp-obsidian", "label": "MCP for Obsidian"}]}, {"id": "02-setup/mcp-obsidian", "path": "docs/02-setup/mcp-obsidian.md", "section": "02-setup", "section_title": "Setup", "title": "MCP for Obsidian", "html": "<p>MCP is the standard way Claude talks to other applications. For a vault, it\nadds a door into Obsidian itself rather than into the folder underneath, which\nmeans the agent can work with the vault from any session, not only one started\ninside that directory.</p>\n<p>You do not need this to start. Add it when you want scheduled tasks, or when\nyou are working from the desktop app rather than a terminal in the vault.</p>\n<h2 id=\"two-routes\">Two routes</h2>\n<p>The <a href=\"https://github.com/coddingtonbear/obsidian-local-rest-api\">Local REST API\nplugin</a> now ships a\nbuilt-in MCP server at <code>/mcp/</code>, so a separate server is no longer required.\nCheck its README first: if the built-in server covers what you need, skip\nstraight to registering it with your client and ignore step 2 below.</p>\n<p>The third-party route described here, <code>mcp-obsidian</code> over the plugin's REST API,\nis still the most widely documented and is what most guides describe. Both end\nup in the same place.</p>\n<h2 id=\"step-1-enable-the-plugin\">Step 1: enable the plugin</h2>\n<p>In Obsidian: <strong>Settings</strong> (gear, bottom left) \u2192 <strong>Community plugins</strong> \u2192 <strong>Turn\non community plugins</strong> \u2192 <strong>Browse</strong> \u2192 search <code>Local REST API</code> \u2192 <strong>Install</strong> \u2192\n<strong>Enable</strong>.</p>\n<p>Open the plugin's settings. There is an <strong>API Key</strong>, a long string of letters\nand numbers. Copy it.</p>\n<p>Obsidian displays the key with the word <code>Bearer</code> in front of it. That word is\nnot part of the key. Copy only the string after it. This is the single most\ncommon reason the connection fails on the first try.</p>\n<h2 id=\"step-2-register-the-server\">Step 2: register the server</h2>\n<p>In the Claude Code tab or terminal, with your key pasted in place of\n<code>PASTE-YOUR-KEY-HERE</code>:</p>\n<pre><code class=\"language-bash\">claude mcp add-json obsidian-vault '{\n  &quot;type&quot;: &quot;stdio&quot;,\n  &quot;command&quot;: &quot;uvx&quot;,\n  &quot;args&quot;: [&quot;mcp-obsidian&quot;],\n  &quot;env&quot;: {\n    &quot;OBSIDIAN_API_KEY&quot;: &quot;PASTE-YOUR-KEY-HERE&quot;,\n    &quot;OBSIDIAN_HOST&quot;: &quot;127.0.0.1&quot;,\n    &quot;OBSIDIAN_PORT&quot;: &quot;27124&quot;\n  }\n}'\n</code></pre>\n<p><code>uvx</code> runs the server without a permanent install. If the command is not found,\ninstall <code>uv</code> first.</p>\n<h2 id=\"step-3-test-it\">Step 3: test it</h2>\n<pre><code>List every file in my Obsidian vault.\n</code></pre>\n<p>If the agent reads your notes back, the connection works.</p>\n<h2 id=\"when-it-does-not-work\">When it does not work</h2>\n<ul>\n<li><strong>Obsidian is closed.</strong> The plugin serves the API from inside the app, so the\n  connection only exists while Obsidian is running.</li>\n<li><strong><code>Bearer</code> in the key.</strong> Strip it.</li>\n<li><strong>Wrong port.</strong> Check the port shown in the plugin settings against the value\n  in your config. The default is 27124.</li>\n<li><strong>Plugin disabled.</strong> Community plugins get turned off when restricted mode is\n  re-enabled after an update.</li>\n</ul>\n<h2 id=\"do-you-need-this-at-all\">Do you need this at all</h2>\n<p>One maintained fork of <code>mcp-obsidian</code> was archived with the reasoning that\nrouting through a REST plugin adds complexity when a vault is just markdown\nfiles on disk. That is the same argument this guide makes for starting on the\nfilesystem, and it is worth taking seriously: MCP earns its place when you need\nthe vault reachable from sessions not running inside it, and not before.</p>\n<h2 id=\"security\">Security</h2>\n<p>This opens a local HTTP server with a key that grants full read and write access\nto your notes. Keep it on <code>127.0.0.1</code>, never expose the port, and treat the key\nlike a password. If you paste it anywhere public, rotate it in the plugin\nsettings.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"claude-md.md\">Writing your CLAUDE.md</a></p>", "headings": ["Two routes", "Step 1: enable the plugin", "Step 2: register the server", "Step 3: test it", "When it does not work", "Do you need this at all", "Security", "Next"], "words": 525, "text": "MCP is the standard way Claude talks to other applications. For a vault, it adds a door into Obsidian itself rather than into the folder underneath, which means the agent can work with the vault from any session, not only one started inside that directory. You do not need this to start. Add it when you want scheduled tasks, or when you are working from the desktop app rather than a terminal in the vault. Two routes The Local REST API plugin https://github.com/coddingtonbear/obsidian-local-rest-api now ships a built-in MCP server at /mcp/ , so a separate server is no longer required. Check its README first: if the built-in server covers what you need, skip straight to registering it with your client and ignore step 2 below. The third-party route described here, mcp-obsidian over the plugin's REST API, is still the most widely documented and is what most guides describe. Both end up in the same place. Step 1: enable the plugin In Obsidian: Settings gear, bottom left \u2192 Community plugins \u2192 Turn on community plugins \u2192 Browse \u2192 search Local REST API \u2192 Install \u2192 Enable . Open the plugin's settings. There is an API Key , a long string of letters and numbers. Copy it. Obsidian displays the key with the word Bearer in front of it. That word is not part of the key. Copy only the string after it. This is the single most common reason the connection fails on the first try. Step 2: register the server In the Claude Code tab or terminal, with your key pasted in place of PASTE-YOUR-KEY-HERE : bash claude mcp add-json obsidian-vault '{ \"type\": \"stdio\", \"command\": \"uvx\", \"args\": \"mcp-obsidian\" , \"env\": { \"OBSIDIAN_API_KEY\": \"PASTE-YOUR-KEY-HERE\", \"OBSIDIAN_HOST\": \"127.0.0.1\", \"OBSIDIAN_PORT\": \"27124\" } }' uvx runs the server without a permanent install. If the command is not found, install uv first. Step 3: test it List every file in my Obsidian vault. If the agent reads your notes back, the connection works. When it does not work - Obsidian is closed. The plugin serves the API from inside the app, so the connection only exists while Obsidian is running. - Bearer in the key. Strip it. - Wrong port. Check the port shown in the plugin settings against the value in your config. The default is 27124. - Plugin disabled. Community plugins get turned off when restricted mode is re-enabled after an update. Do you need this at all One maintained fork of mcp-obsidian was archived with the reasoning that routing through a REST plugin adds complexity when a vault is just markdown files on disk. That is the same argument this guide makes for starting on the filesystem, and it is worth taking seriously: MCP earns its place when you need the vault reachable from sessions not running inside it, and not before. Security This opens a local HTTP server with a key that grants full read and write access to your notes. Keep it on 127.0.0.1 , never expose the port, and treat the key like a password. If you paste it anywhere public, rotate it in the plugin settings. Next Writing your CLAUDE.md claude-md.md", "links": [{"to": "02-setup/claude-md", "label": "Writing your CLAUDE.md"}]}, {"id": "02-setup/claude-md", "path": "docs/02-setup/claude-md.md", "section": "02-setup", "section_title": "Setup", "title": "Writing your CLAUDE.md", "html": "<p><code>CLAUDE.md</code> at the vault root is the file the agent reads at the start of every\nsession. It is the difference between an assistant that knows your situation and\none you brief from scratch every time.</p>\n<p>An empty vault with a good <code>CLAUDE.md</code> is more useful than a full vault without\none, because context about you shapes every page the agent writes afterwards.</p>\n<h2 id=\"do-not-type-it-get-interviewed\">Do not type it, get interviewed</h2>\n<p>Writing this file cold produces a thin, generic version. Answering questions\nproduces a specific one. Paste this into the agent:</p>\n<pre><code>You are setting up my second brain. Interview me ONE question at a time to\nbuild my profile. Ask about: who I am and what I do, my goals for this year,\nhow I want you to talk to me, my strengths and weaknesses, and my current\nprojects. Wait for each answer before the next question. When finished, write\neverything into CLAUDE.md at the vault root, structured with headers.\n</code></pre>\n<p>Answer as if briefing a co-founder on their first day. Vague answers produce a\nvague file, and every session inherits it.</p>\n<h2 id=\"what-belongs-in-it\">What belongs in it</h2>\n<ul>\n<li><strong>Who you are and what you work on.</strong> Enough that a stranger could act on it.</li>\n<li><strong>Goals with a horizon.</strong> This year, this quarter. Undated goals age badly.</li>\n<li><strong>How to talk to you.</strong> Length, tone, how much pushback you want.</li>\n<li><strong>Your strengths and weak spots.</strong> This is what lets the agent know when to\n  challenge you rather than agree.</li>\n<li><strong>Current projects,</strong> one line each, linked to their folders.</li>\n<li><strong>The vault's own rules:</strong> folder layout, page contracts, linking rules. The\n  version in <a href=\"../../vault-template/CLAUDE.md\"><code>vault-template/CLAUDE.md</code></a> is a\n  working starting point.</li>\n</ul>\n<h2 id=\"what-does-not-belong-in-it\">What does not belong in it</h2>\n<ul>\n<li>Anything that changes weekly. That goes in the project files.</li>\n<li>Long explanations of things the model already knows.</li>\n<li>Credentials of any kind.</li>\n<li>Aspirational statements you will not act on. The agent takes them literally.</li>\n</ul>\n<h2 id=\"two-levels\">Two levels</h2>\n<p>The root <code>CLAUDE.md</code> is the strategy layer: who you are, what you are aiming\nat, how the vault works. Each project folder gets its own <code>CLAUDE.md</code> covering\nthat project only. When you open a project as its own vault, the agent reads\njust that one and stops carrying your entire life into every task. See\n<a href=\"project-scoping.md\">project scoping</a>.</p>\n<h2 id=\"iterate-on-it\">Iterate on it</h2>\n<p>When the agent does something wrong twice, that is a <code>CLAUDE.md</code> problem, not a\nprompting problem. Add the rule, with the reason attached, because a rule\nwithout a reason gets applied too literally in the cases you did not anticipate.</p>\n<p>Re-read the file monthly. Goals move, projects close, and a stale profile\nquietly degrades everything the agent writes.</p>\n<h2 id=\"next\">Next</h2>\n<p><a href=\"vault-structure.md\">Vault structure</a></p>", "headings": ["Do not type it, get interviewed", "What belongs in it", "What does not belong in it", "Two levels", "Iterate on it", "Next"], "words": 451, "text": "CLAUDE.md at the vault root is the file the agent reads at the start of every session. It is the difference between an assistant that knows your situation and one you brief from scratch every time. An empty vault with a good CLAUDE.md is more useful than a full vault without one, because context about you shapes every page the agent writes afterwards. Do not type it, get interviewed Writing this file cold produces a thin, generic version. Answering questions produces a specific one. Paste this into the agent: You are setting up my second brain. Interview me ONE question at a time to build my profile. Ask about: who I am and what I do, my goals for this year, how I want you to talk to me, my strengths and weaknesses, and my current projects. Wait for each answer before the next question. When finished, write everything into CLAUDE.md at the vault root, structured with headers. Answer as if briefing a co-founder on their first day. Vague answers produce a vague file, and every session inherits it. What belongs in it - Who you are and what you work on. Enough that a stranger could act on it. - Goals with a horizon. This year, this quarter. Undated goals age badly. - How to talk to you. Length, tone, how much pushback you want. - Your strengths and weak spots. This is what lets the agent know when to challenge you rather than agree. - Current projects, one line each, linked to their folders. - The vault's own rules: folder layout, page contracts, linking rules. The version in vault-template/CLAUDE.md ../../vault-template/CLAUDE.md is a working starting point. What does not belong in it - Anything that changes weekly. That goes in the project files. - Long explanations of things the model already knows. - Credentials of any kind. - Aspirational statements you will not act on. The agent takes them literally. Two levels The root CLAUDE.md is the strategy layer: who you are, what you are aiming at, how the vault works. Each project folder gets its own CLAUDE.md covering that project only. When you open a project as its own vault, the agent reads just that one and stops carrying your entire life into every task. See project scoping project-scoping.md . Iterate on it When the agent does something wrong twice, that is a CLAUDE.md problem, not a prompting problem. Add the rule, with the reason attached, because a rule without a reason gets applied too literally in the cases you did not anticipate. Re-read the file monthly. Goals move, projects close, and a stale profile quietly degrades everything the agent writes. Next Vault structure vault-structure.md", "links": [{"to": "02-setup/project-scoping", "label": "project scoping"}, {"to": "02-setup/vault-structure", "label": "Vault structure"}]}, {"id": "02-setup/vault-structure", "path": "docs/02-setup/vault-structure.md", "section": "02-setup", "section_title": "Setup", "title": "Vault structure", "html": "<p>The vault does two different jobs, and they want different shapes. Keeping them\nin one folder tree while keeping the shapes separate is what makes the system\nhold up past the first month.</p>\n<p><strong>The knowledge layer</strong> is what you have read and understood. It grows forever\nand it is organised by idea.</p>\n<p><strong>The project layer</strong> is what you are working on now. It is organised by\npipeline and most of it goes cold when the project ships.</p>\n<pre><code>brain/\n  CLAUDE.md            who you are, how the vault works\n  raw/                 source material, never edited after it lands\n    assets/\n  wiki/                the knowledge layer\n    sources/           one page per ingested item\n    entities/          people, organisations, products, tools\n    concepts/          ideas, methods, frameworks\n    synthesis/         comparisons, themes, open questions\n    index.md           catalog of every page\n    log.md             what the agent did, chronologically\n  projects/            the project layer\n    youtube-channel/\n      CLAUDE.md        this project only\n      Inputs/          ideas, briefs, raw material\n      Process/         work in progress\n      Outputs/         finished work\n      Feedback/        results, metrics, what happened\n  output/              generated reports and drafts\n</code></pre>\n<h2 id=\"why-the-split\">Why the split</h2>\n<p>A project pipeline answers \"what am I doing this week\". A wiki answers \"what do\nI know about X\". Force one structure to do both and you get either a knowledge\nbase full of dead task folders, or projects buried under conceptual pages\nnobody opens while working.</p>\n<p>They connect through links. A project page links to the concepts it depends on;\nconcept pages accumulate references from the projects that used them. That is\nwhere the compounding shows up: the second time you start a project in a domain,\nthe knowledge layer already has it.</p>\n<h2 id=\"set-the-projects-up-by-asking\">Set the projects up by asking</h2>\n<pre><code>Create a project folder in my vault called youtube-channel. Inside it, create\nfour folders: Inputs, Process, Outputs, Feedback. Then write
